<style>
  :root{
    --parchment:#3f2c1d;
    --parchment-2:#4f3a26;
    --ink:#f8ecd4;
    --ink-soft:#e3b959;
    --leather:#2a1c11;
    --leather-2:#1e130b;
    --brass:#e0aa4e;
    --brass-light:#f3cd7d;
    --wine:#e07a6a;
    --wine-light:#e89a8c;
    --line: rgba(248,236,212,0.2);
    --radius: 3px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.06), transparent 60%),
      var(--parchment);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* Optional lighter parchment look, only if data-theme="light" is set explicitly */
  :root[data-theme="light"]{
    --parchment:#e9dfc7;
    --parchment-2:#ddd0ac;
    --ink:#241f18;
    --ink-soft:#5a5142;
    --leather:#4a3324;
    --leather-2:#3a2718;
    --brass:#a4772f;
    --brass-light:#c99c4f;
    --wine:#7a2e2c;
    --line: rgba(36,31,24,0.18);
  }

  h1,h2,h3{font-family:'Spectral', serif; margin:0; font-weight:600; color:var(--brass-light);}

  label{display:block; font-size:11px; letter-spacing:.02em; color:var(--ink-soft); margin-bottom:3px;}
  input,select,textarea{
    font-family:inherit; color:var(--ink); background:rgba(0,0,0,0.28);
    border:1px solid var(--line); border-radius:var(--radius); padding:6px 8px; width:100%;
    font-size:16px;
  }
  /* iOS Safari auto-zooms the whole page on focusing any input/select/textarea with a
     font-size under 16px — 16px here is the fix, not a design choice. Desktop can size down
     since it has no such behavior. */
  @media (pointer:fine){
    input,select,textarea{ font-size:14px; }
  }

  /* Touch-device +/- steppers for number fields. Shown by default (touch/coarse-pointer
     devices — phones, tablets); hidden on precise-pointer devices (mouse/trackpad = desktop),
     which already have their own ways to adjust a number field. */
  .num-stepper-wrap{ display:flex; align-items:stretch; gap:3px; width:100%; }
  .num-stepper-wrap input[type="number"]{ flex:1 1 auto; min-width:0; padding-left:2px; padding-right:2px; }
  .num-stepper-btn{
    flex:0 0 auto; width:24px; min-width:24px; border:1px solid var(--brass); border-radius:var(--radius);
    background:var(--leather); color:var(--ink); font-size:15px; font-weight:600; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; user-select:none;
  }
  .num-stepper-btn:active{ background:var(--leather-2); }
  @media (pointer:fine){
    .num-stepper-btn{ display:none; }
    .num-stepper-wrap{ gap:0; }
  }

  /* Toast notifications: centered on-screen on every device, styled to match the current
     theme (same parchment/brass look as the rest of the sheet) instead of a fixed alert color. */
  .toast-banner{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--parchment-2); color:var(--ink); border:1px solid var(--brass);
    padding:14px 20px; border-radius:10px; font-size:14.5px;
    max-width:85%; text-align:center; z-index:1100; box-shadow:0 6px 20px rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center; gap:10px; line-height:1.4;
  }

  /* Dice-roll result overlay: a die spins briefly, then a glowing result card pops in on top of
     it — gold/bright for a Nat 20, wine/dark for a Nat 1, plain brass otherwise. Lives outside
     #app (appended once, in <body>) so a sheet re-render right after rolling doesn't wipe it
     mid-animation. */
  #dice-fx-overlay{
    position:fixed; inset:0; z-index:2000; display:none;
    align-items:center; justify-content:center; background:rgba(0,0,0,0.55);
    cursor:pointer;
  }
  #dice-fx-overlay.show{ display:flex; }
  .dice-fx-die{
    width:94px; height:94px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    animation: diceFxSpin 2s cubic-bezier(.36,.07,.19,.97) both;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,0.6));
  }
  /* The die's actual face shape (square/triangle/diamond/kite/pentagon/hexagon/circle), colored
     from the current theme — this is also what appears as the spinning icon, and (slightly
     larger, with its own padding) as the outline of the result card below. A roll that mixes
     multiple die types has no single shape to show, so it falls back to a plain emoji die and
     the default rounded-square card — see dieShapeInfo(). The radial gradient + inset shadows
     fake a beveled, faceted look (a flat theme color read as a sticker; this reads more like a
     physical die catching light) without needing any external art. */
  .dice-fx-shape{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 34% 28%, var(--brass-light) 0%, var(--brass) 48%, var(--leather-2) 100%);
    color:var(--leather);
    font-family:'Spectral',serif; font-weight:700; font-size:18px; letter-spacing:0.5px;
    box-shadow: inset 0 3px 7px rgba(255,255,255,0.4), inset 0 -8px 14px rgba(0,0,0,0.4);
  }
  .dice-fx-die .dice-fx-emoji{ font-size:88px; }
  /* d6 gets real pips instead of a "d6" label — it's the one shape everyone already reads at a
     glance, and dots sell "this is a die" far better than text ever would. */
  .dice-fx-pips{
    display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(3,1fr);
    gap:7px; width:58%; height:72%;
  }
  .dice-fx-pip{
    width:11px; height:11px; border-radius:50%; justify-self:center; align-self:center;
    background:var(--leather);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.25);
  }
  @keyframes diceFxSpin{
    0%{ transform:rotate(0deg) scale(0.6); opacity:0; }
    8%{ opacity:1; }
    80%{ transform:rotate(1620deg) scale(1.15); }
    100%{ transform:rotate(2160deg) scale(1); }
  }
  .dice-fx-result{
    display:none; flex-direction:column; align-items:center; gap:4px; justify-content:center;
    padding:22px 32px; border-radius:16px; text-align:center; cursor:default;
    background:var(--parchment-2); border:2px solid var(--brass);
    animation: diceFxPop 0.35s cubic-bezier(.34,1.56,.64,1) both;
    max-width:90%; min-width:170px; min-height:170px;
  }
  .dice-fx-result.show{ display:flex; }
  .dice-fx-result.crit{ border-color:#ffd24a; box-shadow:0 0 40px 10px rgba(255,200,60,0.55); }
  .dice-fx-result.fail{ border-color:var(--wine); box-shadow:0 0 40px 10px rgba(180,30,30,0.5); }
  .dice-fx-total{ font-family:'Spectral',serif; font-size:46px; font-weight:700; color:var(--brass-light); line-height:1.1; }
  .dice-fx-result.crit .dice-fx-total{ color:#ffd24a; }
  .dice-fx-result.fail .dice-fx-total{ color:var(--wine-light); }
  .dice-fx-label{ font-size:13px; color:var(--ink); font-weight:600; }
  .dice-fx-breakdown{ font-size:12px; color:var(--ink-soft); }
  @keyframes diceFxPop{ 0%{ transform:scale(0.5); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  @media (prefers-reduced-motion: reduce){
    .dice-fx-result{ animation:none !important; }
  }

  /* The dropdown's OPEN option list is a native browser layer that ignores the select's own

  select{ background-color:var(--leather); color:var(--ink); }
  select option{ background-color:var(--leather); color:var(--ink); }
  :root[data-theme="light"] input, :root[data-theme="light"] select, :root[data-theme="light"] textarea{background:rgba(255,255,255,0.35);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brass); outline-offset:1px;}

  button{
    font-family:'IBM Plex Sans',sans-serif; cursor:pointer; border-radius:var(--radius);

  /* --- Dice Roller: compact toolbar layout instead of a stacked form ---

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<div id="welcome-banner"></div>
<div id="auth-bar"></div>
<div id="app"></div>
<div id="brand-badge"></div>
<div id="dice-fx-overlay"></div>

<script>
/* ===================== DATA ===================== */

const ABILS = ["str","dex","con","int","wis","cha"];

// Flavorful Quick Reference readout only — a creature's actual size category in 5e is normally
// fixed by its species/stat block (and the real rules only use Small/Medium/Large/etc. as
// defined categories, not simple height bands), so this never affects carrying capacity, reach,
// or anything else the sheet calculates. By request, this uses a deliberately simplified
// 3-tier, height-only read: Small 2-4 ft, Medium 4-6 ft, Large 6-8 ft — with anything shorter
// than 2 ft still reading as Small and anything taller than 8 ft still reading as Large, since
// those are the only three categories kept (no Tiny/Huge/Gargantuan tier to fall back to, and
// weight is no longer a factor).
function estimatedBodySize(){
  const h = parseInt(state.height)||0; // inches
  if(h<=0) return "";
  if(h<48) return "Small";   // under 4 ft
  if(h<72) return "Medium";  // 4-6 ft
  return "Large";            // 6 ft and up
}
function bodySizeChipHtml(){
  const size = estimatedBodySize();
  if(!size) return "";
  return `<span class="qr-chip" title="Estimated from your recorded Height in Character Info — not an official rule. Small is under 4 ft, Medium is 4-6 ft, Large is 6 ft and up.">Size <strong>${size}</strong></span>`;
}
const ABIL_NAMES = {str:"Strength",dex:"Dexterity",con:"Constitution",int:"Intelligence",wis:"Wisdom",cha:"Charisma"};

const SKILLS = [

function maneuversKnownCount(fLvl){ if(fLvl>=15) return 9; if(fLvl>=10) return 7; if(fLvl>=7) return 5; if(fLvl>=3) return 3; return 0; }
function superiorityDiceInfo(fLvl){
  let count = 0;

// Ki: a universal Monk resource (not subclass-specific) fueling Flurry of Blows, Patient
// Defense, and Step of the Wind (1 ki each) for every Monk, plus Way of the Four Elements'
// Elemental Disciplines below. Ki points = Monk level, restoring on a short or long rest.
function kiPointCount(monkLvl){ return monkLvl>=2 ? monkLvl : 0; }

// Level-scaling dice for common class features, so their description always reflects the
// character's actual current number instead of a vague, unhelpful "scaling damage die."
function martialArtsDie(monkLvl){
  // 2024: d6 at level 1, d8 at 5, d10 at 10, d12 at 17 — confirmed directly against the Monk Features
  // table (the d10 tier previously started one level late, at 11 instead of 10).
  if(monkLvl>=17) return 12;
  if(monkLvl>=10) return 10;
  if(monkLvl>=5) return 8;
  return 6;
}
function sneakAttackDice(rogueLvl){ return Math.ceil(Math.max(rogueLvl,0)/2); }
function bardicInspirationDie(bardLvl){
  if(bardLvl>=15) return 12;
  if(bardLvl>=10) return 10;
  if(bardLvl>=5) return 8;
  return 6;
}
function rageDamageBonus(barbLvl){
  if(barbLvl>=16) return 4;
  if(barbLvl>=9) return 3;
  return 2;
}
function brutalStrikeDice(barbLvl){
  if(barbLvl>=17) return 2;
  if(barbLvl>=9) return 1;
  return 0;
}

// A Beast Master companion's effective max HP is whichever is higher: its own stat block's
// max, or 4x the Ranger's level — it keeps pace with you as you level even if its book max is low.
function companionMaxHP(){
  const rangerLvl = classLevelOf("Ranger");
  const bookMax = parseInt(state.companion.baseHP)||0;
  return Math.max(bookMax, rangerLvl*4);
}

// 2024 Exhaustion is a completely different system from 2014 — confirmed directly against the PHB
// Rules Glossary. No more six named stages with escalating, different effects per level. Instead it's
// a single formula that scales continuously with the level itself: D20 Tests take a penalty equal to
// 2x the level, Speed is reduced by 5ft x the level, and death occurs at level 6. A Long Rest removes
// only 1 level at a time (not all of them). The old six-stage table below is retired.
function exhaustionEffectText(level){
  if(level<=0) return "";
  return `D20 Tests (ability checks, attack rolls, and saving throws) take a −${2*level} penalty. Speed is reduced by ${5*level} ft. `+(level>=6?"You die.":"");
}

// Fighting Style feats are generated from FIGHTING_STYLE_OPTIONS (single source of truth) so the
// class-feature picker and the feat list can never drift apart.
// Blessed Warrior / Druidic Warrior are NOT feats — they're options built into the Paladin / Ranger
// Fighting Style class feature — so they stay in FIGHTING_STYLE_OPTIONS (class-feature picker only)
// and are skipped here. The real Fighting Style feats need only the Fighting Style feature.
Object.keys(FIGHTING_STYLE_OPTIONS).forEach(style=>{
  if(FIGHTING_STYLE_CLASS_ONLY[style]) return;
  FEATS[style+" (Fighting Style)"] = {
    desc:FIGHTING_STYLE_OPTIONS[style],
    prereq:{fightingStyle:true},
    autoMods:[], tier:"fightingStyle", styleName:style
  };
});

// ================= Spells granted by feats =================
// Six feats hand out spells: Magic Initiate, Fey-Touched, Shadow-Touched, Ritual Caster, Telekinetic and
// Telepathic. They're tracked in their own list (shown as the "Spells from Feats" card and in Quick
// Reference) rather than the normal spell list, because: a feat's spells are ALWAYS prepared and never
// count against a prepared-spell limit; they must work for characters with no spellcasting class at all
// (the normal Spells card and its list don't exist for them); and the normal list is pruned to what a
// class's own spell list allows. Note the "Spellcasting or Pact Magic feature" feat prerequisites stay
// class-based on purpose — gaining a spell from a feat doesn't satisfy them.
const SPELL_SCHOOL_L1 = {
  "Alarm":"Abjuration","Animal Friendship":"Enchantment","Armor of Agathys":"Abjuration","Arms of Hadar":"Conjuration","Bane":"Enchantment",
  "Bless":"Enchantment","Burning Hands":"Evocation","Buzzing Bee":"Conjuration","Charm Person":"Enchantment","Chromatic Orb":"Evocation",
  "Color Spray":"Illusion","Command":"Enchantment","Compelled Duel":"Enchantment","Comprehend Languages":"Divination",
  "Create or Destroy Water":"Transmutation","Cure Wounds":"Abjuration","Detect Evil and Good":"Divination","Detect Magic":"Divination",
  "Detect Poison and Disease":"Divination","Disguise Self":"Illusion","Dissonant Whispers":"Enchantment","Divine Favor":"Transmutation",
  "Divine Smite":"Evocation","Ensnaring Strike":"Conjuration","Entangle":"Conjuration","Expeditious Retreat":"Transmutation",
  "Faerie Fire":"Evocation","False Life":"Necromancy","Feather Fall":"Transmutation","Feign Interest":"Illusion","Find Familiar":"Conjuration",
  "Fog Cloud":"Conjuration","Goodberry":"Conjuration","Grease":"Conjuration","Guiding Bolt":"Evocation","Hail of Thorns":"Conjuration",
  "Healing Word":"Abjuration","Hellish Rebuke":"Evocation","Heroism":"Enchantment","Hex":"Enchantment","Hunter's Mark":"Divination",
  "Ice Knife":"Conjuration","Identify":"Divination","Illusory Script":"Illusion","Inflict Wounds":"Necromancy","Insidious Rhythm":"Enchantment",
  "Jump":"Transmutation","Longstrider":"Transmutation","Mage Armor":"Abjuration","Magic Missile":"Evocation",
  "Protection from Evil and Good":"Abjuration","Purify Food and Drink":"Transmutation","Quick Clothier":"Transmutation","Ray of Sickness":"Necromancy",
  "Sanctuary":"Abjuration","Searing Smite":"Evocation","Shield":"Abjuration","Shield of Faith":"Abjuration","Silent Image":"Illusion",
  "Sleep":"Enchantment","Speak with Animals":"Divination","Spellfire Flare":"Evocation","Tasha's Hideous Laughter":"Enchantment",
  "Tenser's Floating Disk":"Conjuration","Thunderous Smite":"Evocation","Thunderwave":"Evocation","Unseen Servant":"Conjuration",
  "Wardaway":"Abjuration","Witch Bolt":"Evocation","Wrathful Smite":"Necromancy"
};
// Level 1 spells with the Ritual tag (per the Player's Handbook spell table).
const RITUAL_L1 = ["Alarm","Comprehend Languages","Detect Magic","Detect Poison and Disease","Find Familiar","Identify","Illusory Script","Purify Food and Drink","Speak with Animals","Tenser's Floating Disk","Unseen Servant"];
const FEAT_SPELL_FEATS = new Set(["Magic Initiate","Fey-Touched","Shadow-Touched","Ritual Caster","Telekinetic","Telepathic"]);
// Feats that pick one level 1 spell from a pair of schools (their other spell is fixed).
const FEAT_SCHOOL_PICK = {
  "Fey-Touched":{schools:["Divination","Enchantment"], fixed:"Misty Step"},
  "Shadow-Touched":{schools:["Illusion","Necromancy"], fixed:"Invisibility"}
};

function featSpellAbility(f){
  if(f.feat==="Magic Initiate") return (f.choice && f.choice.miAbility) || null;
  return resolvedFeatAbility(f);
}
function featSpellStats(abil){
  if(!abil) return null;
  const m = mod(abilTotal(abil));
  return {dc: 8 + profBonus() + m, atk: profBonus() + m};
}
// Every spell the character's feats currently grant, plus "pending" placeholders for picks not yet made.
function featSpellEntries(){
  if(_cache.featSpellEntries) return _cache.featSpellEntries;
  const out = [];
  allChosenFeats().forEach(f=>{
    if(!FEAT_SPELL_FEATS.has(f.feat)) return;
    const c = f.choice || {};
    const abil = featSpellAbility(f);
    const add = (spell, extra)=>{
      const info = SPELL_LIST.find(sp=>sp.name===spell);
      out.push(Object.assign({id:`${f.key}|${spell}`, feat:f.feat, featKey:f.key, category:f.category, spell, level:info?info.lvl:null, abil, desc:info?info.desc:""}, extra));
    };
    const pending = (label)=> out.push({id:`${f.key}|pending|${label}`, feat:f.feat, featKey:f.key, category:f.category, spell:label, pending:true, kind:"pending", abil});
    switch(f.feat){
      case "Magic Initiate":
        [c.cantrip1, c.cantrip2].forEach((sp,i)=> sp ? add(sp,{kind:"cantrip"}) : pending(`Cantrip ${i+1} — not chosen yet`));
        c.miSpell ? add(c.miSpell,{kind:"spell",free:true}) : pending("1st-level spell — not chosen yet");
        break;
      case "Fey-Touched":
      case "Shadow-Touched":
        add(FEAT_SCHOOL_PICK[f.feat].fixed,{kind:"spell",free:true});
        c.fSpell ? add(c.fSpell,{kind:"spell",free:true}) : pending(`${FEAT_SCHOOL_PICK[f.feat].schools.join(" or ")} spell — not chosen yet`);
        break;
      case "Telepathic": add("Detect Thoughts",{kind:"spell",free:true}); break;
      case "Telekinetic": add("Mage Hand",{kind:"cantrip"}); break;
      case "Ritual Caster":
        for(let i=1;i<=profBonus();i++){ c["rit"+i] ? add(c["rit"+i],{kind:"ritual"}) : pending(`Ritual spell ${i} — not chosen yet`); }
        out.push({id:`${f.key}|__quickRitual`, feat:f.feat, featKey:f.key, category:f.category, spell:"Quick Ritual", kind:"quickRitual", free:true, abil, level:null,
                  desc:"Cast one of your prepared Ritual spells at its normal casting time instead of the ritual time, without expending a spell slot."});
        break;
    }
  });
  _cache.featSpellEntries = out;
  return out;
}

function featSpellLevelLabel(e){ return e.level===0 ? "Cantrip" : (e.level ? `Level ${e.level}` : ""); }
function featSpellStatsLine(e){
  if(e.kind==="quickRitual" || e.pending) return "";
  const st = featSpellStats(e.abil);
  if(!st) return "choose this feat's spellcasting ability to see the DC / attack bonus";
  return `save DC ${st.dc} · spell attack ${fmt(st.atk)} (${ABIL_NAMES[e.abil]})`;
}

// Pickers for the feats that make you choose spells (Magic Initiate has its own, further up).
function featSpellPickerHtml(choice, key){
  const feat = choice.feat;
  const buildSelect = (field, opts, takenElsewhere, placeholder)=>`<select data-choice-key="${key}" data-choice-field="${field}" style="width:auto;margin-bottom:4px;display:block;">
      <option value="">${placeholder}</option>
      ${opts.map(n=>`<option value="${escapeAttr(n)}" ${choice[field]===n?"selected":""} ${(takenElsewhere||[]).includes(n)&&choice[field]!==n?"disabled":""}>${escapeHtml(n)}</option>`).join("")}
    </select>`;
  const note = `<div class="small-label" style="margin-bottom:4px;">The ability you pick for "Which ability gets +1?" below is also the spellcasting ability for these spells.</div>`;
  if(FEAT_SCHOOL_PICK[feat]){
    const cfg = FEAT_SCHOOL_PICK[feat];
    const opts = SPELL_LIST.filter(sp=>sp.lvl===1 && cfg.schools.includes(SPELL_SCHOOL_L1[sp.name])).map(sp=>sp.name).sort();
    return `<div style="margin-top:6px;">${note}
      <div class="small-label" style="margin-bottom:4px;">One level 1 ${cfg.schools.join(" or ")} spell (you always have it and ${cfg.fixed} prepared; each is free once per Long Rest):</div>
      ${buildSelect("fSpell", opts, [], "— choose a spell —")}
    </div>`;
  }
  if(feat==="Ritual Caster"){
    const opts = RITUAL_L1.filter(n=>SPELL_LIST.some(sp=>sp.name===n)).sort();
    const n = profBonus();
    let selects = "";
    for(let i=1;i<=n;i++){
      const others = [];
      for(let j=1;j<=n;j++){ if(j!==i && choice["rit"+j]) others.push(choice["rit"+j]); }
      selects += buildSelect("rit"+i, opts, others, `— ritual spell ${i} —`);
    }
    return `<div style="margin-top:6px;">${note}
      <div class="small-label" style="margin-bottom:4px;">${n} level 1 spells with the Ritual tag (always prepared; you gain another each time your proficiency bonus rises):</div>
      ${selects}
    </div>`;
  }
  return "";
}

function renderFeatSpellsCard(){
  const entries = featSpellEntries();
  if(!entries.length) return `<div class="small-label">No feats that grant spells yet.</div>`;
  state.featSpellUses = state.featSpellUses || {};
  const armorLocked = armorPenaltyActive();
  // group by the feat (and which copy of it, for repeatable feats) that grants them
  const groups = [];
  entries.forEach(e=>{
    let g = groups.find(x=>x.featKey===e.featKey);
    if(!g){ g = {featKey:e.featKey, feat:e.feat, rows:[]}; groups.push(g); }
    g.rows.push(e);
  });
  const rows = groups.map(g=>{
    const head = `<div class="small-label" style="margin:8px 0 2px;font-weight:600;">${escapeHtml(g.feat)}</div>`;
    const body = g.rows.map(e=>{
      if(e.pending){
        return `<div class="feat-item"><div class="fname" style="opacity:.7;">${escapeHtml(e.spell)}</div><div class="fdesc">Choose it under Classes &amp; Features, on this feat.</div></div>`;
      }
      const used = !!state.featSpellUses[e.id];
      const lvl = featSpellLevelLabel(e);
      const stats = featSpellStatsLine(e);
      const freeTitle = armorLocked ? armorLockMessage() : "";
      const free = e.free ? `<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:3px;"${freeTitle?` title="${escapeAttr(freeTitle)}"`:""}><input type="checkbox" class="check" data-featspell-use="${escapeAttr(e.id)}" ${used?"checked":""} ${armorLocked?"disabled":""}> ${e.kind==="quickRitual"?"Quick Ritual used":"Free cast used"} <span class="small-label" style="margin:0;">(resets on a Long Rest)</span></label>` : "";
      const kindNote = e.kind==="cantrip" ? "Known cantrip." : e.kind==="ritual" ? "Always prepared; castable with slots or as a ritual." : e.kind==="spell" ? "Always prepared; free once per Long Rest, or cast with a slot if you have one." : "";
      return `<div class="feat-item"><div class="fname">${escapeHtml(e.spell)}${lvl?` <span class="small-label" style="display:inline;margin:0;">· ${lvl}</span>`:""}</div>
        <div class="fdesc">${escapeHtml(e.desc||"")}${e.desc?" ":""}${escapeHtml(kindNote)}${stats?` <em>(${escapeHtml(stats)})</em>`:""}</div>${free}</div>`;
    }).join("");
    return head + body;
  }).join("");
  return `<div class="small-label" style="margin-bottom:2px;">Spells your feats give you. They're always prepared, don't count against any prepared-spell limit, and work even if you have no spellcasting class.</div>${rows}`;
}

// --- Procedural sound effects (Web Audio API) ---
// Small synthesized chimes/stingers for a handful of moments (rest, death/revive, crit/fumble)
// instead of embedded audio files — keeps this a single lightweight HTML file with no audio
// licensing to worry about. Muted entirely via Settings > Sound (state.soundMuted). The
// AudioContext is created lazily on first use, which also satisfies browsers' autoplay policy
// (it requires a user gesture — every caller here is a click handler, so that's covered).
let audioCtx = null;
function isSoundMuted(){ return !!(typeof state !== "undefined" && state && state.soundMuted); }
function getAudioCtx(){
  if(isSoundMuted()) return null;
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    try{ audioCtx = new Ctx(); }catch(e){ return null; }
  }
  if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
  return audioCtx;
}
// Schedules one short tone. startAt/duration are in seconds, relative to "now".
function playTone(ctx, freq, startAt, duration, type, peakGain){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startAt;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain==null?0.18:peakGain, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0+duration+0.05);
}
function playRestChime(){
  const ctx = getAudioCtx(); if(!ctx) return;
  [392.00, 523.25, 659.25].forEach((f,i)=> playTone(ctx, f, i*0.09, 0.35, "sine", 0.15));
}
function playDeathStinger(){
  const ctx = getAudioCtx(); if(!ctx) return;
  [220.00, 196.00, 164.81].forEach((f,i)=> playTone(ctx, f, i*0.18, 0.5, "sawtooth", 0.12));
}
function playReviveChime(){
  const ctx = getAudioCtx(); if(!ctx) return;
  [261.63, 329.63, 392.00, 523.25].forEach((f,i)=> playTone(ctx, f, i*0.07, 0.3, "triangle", 0.14));
}
function playCritFanfare(){
  const ctx = getAudioCtx(); if(!ctx) return;
  [523.25, 659.25, 783.99, 1046.50].forEach((f,i)=> playTone(ctx, f, i*0.08, 0.4, "triangle", 0.18));
}
function playFailThud(){
  const ctx = getAudioCtx(); if(!ctx) return;
  playTone(ctx, 110, 0, 0.35, "square", 0.16);
  playTone(ctx, 98, 0.05, 0.4, "square", 0.14);
}
// Short, understated HP tick sounds — these fire on every damage/heal button press (far more
// often than rest/death), so they're deliberately quieter and quicker than the other chimes.
function playDamageTick(){
  const ctx = getAudioCtx(); if(!ctx) return;
  playTone(ctx, 180, 0, 0.18, "sawtooth", 0.1);
  playTone(ctx, 140, 0.03, 0.2, "sawtooth", 0.08);
}
function playHealTick(){
  const ctx = getAudioCtx(); if(!ctx) return;
  [392.00, 493.88].forEach((f,i)=> playTone(ctx, f, i*0.05, 0.18, "triangle", 0.1));
}
// A short percussive "tick" per call, strung together by playDiceRollSound into a rattle that
// slows down over time — mimicking a physical die bouncing to a stop.
function playDiceRollSound(spanSeconds){
  const ctx = getAudioCtx(); if(!ctx) return;
  const span = spanSeconds==null ? 1.8 : spanSeconds;
  if(span <= 0){
    // Reduced-motion: no spin to accompany, so just a single quick "roll" cue instead of a rattle.
    playTone(ctx, 700, 0, 0.12, "triangle", 0.16);
    return;
  }
  let t = 0, gap = 0.05;
  while(t < span){
    const freq = 500 + Math.random()*450;
    playTone(ctx, freq, t, 0.09, "triangle", 0.16);
    t += gap;
    gap *= 1.11; // ticks spread out as the "die" settles, finishing right as the spin ends
  }
}

function migrateAttacks(st){
  st.attacks = (st.attacks||[]).map(a=>{
    if(a.weaponKey!==undefined || a.customName!==undefined) return a; // already new format
    // Old format: {name, bonus (typed string), range, damages:[{dice (typed string), type}]}.
    // Best-effort carry-over: the old typed bonus becomes a flat Misc Bonus (Ability set to
    // "Manual" so nothing else is added on top), and each damage line's type carries over but
    // its dice reset to a default the player can adjust, since a free-text string like "1d8+3"
    // can't be reliably split into a count/die dropdown pair.
    return {
      weaponKey:"",
      customName:a.name||"",
      abilityKey:"",
      proficient:false,
      miscBonus: parseInt(a.bonus)||0,
      addAbilityToDamage:false,
      range:a.range||"",
      damages:(a.damages&&a.damages.length) ? a.damages.map(d=>({count:1,die:6,type:d.type||""})) : [{count:1,die:6,type:""}]
    };
  });
  return st;
}

function migrateRace(st){
  const allocated = Object.values(st.abilityPointAllocation||{}).some(v=>v>0);
  // Old homebrew race typed into the since-removed "Race / Lineage" field, with no standard
  // race picked — carry it over as this character's custom race so nothing is lost.
  if(!st.raceBonus && st.race && !st.customRace){
    st.raceBonus = "__custom__";
    st.customRace = st.race;
  }
  // A standard race was already picked under the old fixed-bonus system — carry its exact old
  // bonus into the new free-allocation fields, so existing characters don't suddenly lose an
  // ability bonus they already had applied. (Some old bonuses total more than 3 points, or more
  // than 2 in one ability — that's fine here; the cap only applies to new choices going forward.)
  if(st.raceBonus && st.raceBonus!=="__custom__" && RACE_BONUSES[st.raceBonus] && !allocated){
    st.abilityPointAllocation = Object.assign({str:0,dex:0,con:0,int:0,wis:0,cha:0}, RACE_BONUSES[st.raceBonus]);
  }
  return st;
}

function migrateArmor(rawParsed, st){
  // Old saves (before the armor-type system existed) tracked AC as one manually-typed number in
  // acMisc, added straight onto the unarmored base. Best-effort carry-over: treat that old number
  // as Light Armor's base AC (the closest match, since Light Armor still adds your full Dex mod
  // the same way the old flat field implicitly did) so the character's AC doesn't suddenly change
  // out from under them — flagged so the player can correct it if it was actually Medium or Heavy
  // armor, which cap or remove the Dex bonus.
  if(rawParsed && !("armorEquipped" in rawParsed) && !st.unarmoredDefenseClass && (parseInt(rawParsed.acMisc)||0) > 0){
    st.armorEquipped = "Light Armor";
    st.armorBaseAC = rawParsed.acMisc;
    st.acMisc = 0;
    st._armorMigrated = true;
  }
  return st;
}

function loadState(){
  try{
    const raw = localStorage.getItem("dnd-sheet-v1:"+roster.activeId);
    if(raw){
      return parseCharacterState(raw);
    }
  }catch(e){ console.warn("Could not load saved sheet", e); }
  return structuredClone(DEFAULT_STATE);
}

function parseCharacterState(raw){
  const parsed = JSON.parse(raw);
  return migrateArmor(parsed, migrateRace(migrateAttacks(Object.assign(structuredClone(DEFAULT_STATE), parsed))));
}

// Rapid typing (a notes field, a spell's name, a misc bonus) shouldn't trigger a full
// JSON.stringify + localStorage write on every keystroke — that's real, avoidable work on
// every single character typed, and can be felt as lag on slower/mobile devices. The visible
// page stays perfectly live either way, since the in-memory `state` object is always updated
// synchronously before this is called, and the Quick Reference refresh that runs alongside it
// reads straight from that same live state. Only the actual disk persistence is delayed, and
// only while typing continues — see flushPendingSave() below for how nothing typed is ever
// actually at risk of being lost by navigating away mid-pause.
let _inputSaveTimer = null;
function debouncedSaveState(){
  clearTimeout(_inputSaveTimer);
  _inputSaveTimer = setTimeout(saveState, 400);
}
function flushPendingSave(){
  if(_inputSaveTimer){ clearTimeout(_inputSaveTimer); _inputSaveTimer = null; saveState(); }
}

function saveState(){
  invalidateRenderCache();
  try{
    localStorage.setItem("dnd-sheet-v1:"+roster.activeId, JSON.stringify(state));
    // Keep the roster's dropdown label in sync with this character's current name, whenever
    // it changes, without needing to load every other character's (possibly image-heavy) state
    // just to build the switcher list.
    const entry = roster.index.find(c=>c.id===roster.activeId);
    if(entry && entry.name !== (state.name||"")){
      entry.name = state.name||"";
      saveRoster();
    }
    // Signed in: also push this save to the account in the background (see cloudSaveCharacter's
    // own comment for why this never blocks or changes this function's synchronous behavior).
    if(isCloudMode()) cloudSaveCharacter();
    return true;
  }
  catch(e){ console.warn("Could not save sheet", e); return false; }
}

// --- Multi-character roster ---
// Storage shape: a lightweight index (id + display name for every saved character, so the
// switcher dropdown never has to load every character's full state — including any base64
// portrait/mini images — just to list them) plus one full state blob per character, each
// under its own "dnd-sheet-v1:<id>" key (the legacy unsuffixed "dnd-sheet-v1" key from before
// multi-character support existed is migrated into this as the first entry, once, below).
function genCharId(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function loadRoster(){
  try{
    const rawIndex = localStorage.getItem("dnd-roster-index-v1");
    const activeId = localStorage.getItem("dnd-active-char-v1");
    if(rawIndex){
      const index = JSON.parse(rawIndex);
      if(Array.isArray(index) && index.length && activeId && index.some(c=>c.id===activeId)){
        return {index, activeId};
      }
      if(Array.isArray(index) && index.length){
        // Index exists but the active pointer is missing/stale — fall back to the first entry
        // rather than losing access to already-saved characters.
        return {index, activeId:index[0].id};
      }
    }
  }catch(e){ console.warn("Could not load character roster", e); }
  // First time this version has run in this browser: migrate a pre-existing single-character
  // save (the old format, from before multiple characters were supported) in as entry one. If
  // there's no old save either, this is a first-ever launch — start with one blank character.
  const id = genCharId();
  let name = "";
  try{
    const oldRaw = localStorage.getItem("dnd-sheet-v1");
    if(oldRaw){
      localStorage.setItem("dnd-sheet-v1:"+id, oldRaw);
      try{ name = JSON.parse(oldRaw).name || ""; }catch(e){}
    }
  }catch(e){ console.warn("Could not migrate old single-character save", e); }
  const index = [{id, name}];
  try{
    localStorage.setItem("dnd-roster-index-v1", JSON.stringify(index));
    localStorage.setItem("dnd-active-char-v1", id);
  }catch(e){ console.warn("Could not save new character roster", e); }
  return {index, activeId:id};
}

function saveRoster(){
  try{
    localStorage.setItem("dnd-roster-index-v1", JSON.stringify(roster.index));
    localStorage.setItem("dnd-active-char-v1", roster.activeId);
    return true;
  }catch(e){ console.warn("Could not save character roster", e); return false; }
}

// Switches the active character: the one you're leaving is already persisted (saveState()
// runs on every edit), so this just points the roster at the new id and loads its state.
function switchCharacter(id){
  if(id===roster.activeId) return;
  roster.activeId = id;
  if(isCloudMode()){
    saveRoster(); // harmless local "last viewed" convenience; the account itself is the source of truth
    cloudLoadCharacterData(id).then(s=>{ state=s; render(); refreshActiveCharacterCampaignLinks(); });
    return;
  }
  saveRoster();
  state = loadState();
  render();
}

function addNewCharacterSheet(){
  if(isCloudMode()){
    const newState = structuredClone(DEFAULT_STATE);
    cloudCreateCharacter(newState).then(newId=>{
      roster.index.push({id:newId, name:""});
      roster.activeId = newId;
      state = newState;
      activeCharacterCampaignIds = []; activeCharacterLevelUps = []; // a brand-new character can't be linked into a campaign yet
      render();
      showToast("New blank character sheet created in your account — your other characters are still saved.");
    });
    return;
  }
  const id = genCharId();
  roster.index.push({id, name:""});
  roster.activeId = id;
  saveRoster();
  state = structuredClone(DEFAULT_STATE);
  saveState();
  render();
  showToast("New blank character sheet created — your other characters are still saved in the dropdown below.");
}

function deleteCharacterSheet(id){
  const idx = roster.index.findIndex(c=>c.id===id);
  if(idx===-1) return;
  roster.index.splice(idx,1);
  if(isCloudMode()){
    cloudDeleteCharacter(id);
    if(roster.index.length===0){
      const newState = structuredClone(DEFAULT_STATE);
      cloudCreateCharacter(newState).then(newId=>{
        roster.index.push({id:newId, name:""});
        roster.activeId = newId;
        state = newState;
        activeCharacterCampaignIds = []; activeCharacterLevelUps = [];
        render();
      });
    } else {
      if(roster.activeId===id) roster.activeId = roster.index[0].id;
      cloudLoadCharacterData(roster.activeId).then(s=>{ state=s; render(); refreshActiveCharacterCampaignLinks(); });
    }
    return;
  }
  try{ localStorage.removeItem("dnd-sheet-v1:"+id); }catch(e){ console.warn("Could not remove character data", e); }
  if(roster.index.length===0){
    // Never leave the roster empty — a fresh blank character takes its place.
    const newId = genCharId();
    roster.index.push({id:newId, name:""});
    roster.activeId = newId;
    saveRoster();
    state = structuredClone(DEFAULT_STATE);
    saveState();
  } else {
    if(roster.activeId===id) roster.activeId = roster.index[0].id;
    saveRoster();
    state = loadState();
  }
  render();
}

/* Top-middle welcome banner: full logo + tagline, shown whenever nobody is signed in
   (including right after a deliberate sign-out), hidden once a user is signed in. */
function renderBrandBanner(){
  const el = document.getElementById("welcome-banner");
  if(!el) return;
  if(authUser){
    el.classList.remove("show");
    el.innerHTML = "";
    return;
  }
  el.innerHTML = `
    <img src="${window.BRAND_LOCKUP_SRC}" alt="Character Ledger">
    <p>A living D&amp;D 5e character sheet that tracks your stats, spells, and inventory automatically as you play.</p>
  `;
  el.classList.add("show");
}

/* Small persistent brand mark: bottom-right on desktop (fixed), bottom of page on mobile
   (normal flow — see the #brand-badge media query). Independent of sign-in state. */
function renderBrandBadge(){
  const el = document.getElementById("brand-badge");
  if(!el) return;
  el.innerHTML = `<img src="${window.BRAND_ICON_SRC}" alt="">`;
}

function renderAuthModal(){
  const existing = document.getElementById("auth-modal-overlay");
  if(!authModalMode){
    if(existing) existing.remove();
    return;
  }
  const isSignup = authModalMode==="signup";
  const html = `<div class="auth-modal-overlay" id="auth-modal-overlay">
      <div class="auth-modal">
        <h2>${isSignup?"Create an Account":"Log In"}</h2>
        <div class="auth-error">${escapeHtml(authModalError)}</div>
        <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
        <input type="password" id="auth-password" placeholder="Password (min 6 characters)" autocomplete="${isSignup?"new-password":"current-password"}">
        <button class="small" id="auth-submit" style="width:100%;" ${authBusy?"disabled":""}>${authBusy?"Please wait…":(isSignup?"Create Account":"Log In")}</button>
        <div class="auth-switch">${isSignup ? `Already have an account? <a id="auth-switch-link">Log In</a>` : `Need an account? <a id="auth-switch-link">Sign Up</a>`}</div>
        <div class="auth-switch"><a id="auth-close-link">Cancel</a></div>
      </div>
    </div>`;
  if(existing) existing.outerHTML = html; else document.body.insertAdjacentHTML("beforeend", html);
  const closeLink = document.getElementById("auth-close-link");
  if(closeLink) closeLink.addEventListener("click", ()=>{ authModalMode=null; renderAuthModal(); });
  const switchLink = document.getElementById("auth-switch-link");
  if(switchLink) switchLink.addEventListener("click", ()=>{ authModalMode = authModalMode==="signup"?"login":"signup"; authModalError=""; renderAuthModal(); });
  const submitBtn = document.getElementById("auth-submit");
  if(submitBtn) submitBtn.addEventListener("click", handleAuthSubmit);
  ["auth-email","auth-password"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener("keydown", (e)=>{ if(e.key==="Enter") handleAuthSubmit(); });
  });
}

async function handleAuthSubmit(){
  if(authBusy) return;
  const email = (document.getElementById("auth-email")||{}).value || "";
  const password = (document.getElementById("auth-password")||{}).value || "";
  if(!email || !password){ authModalError = "Enter both an email and a password."; renderAuthModal(); return; }
  if(password.length<6){ authModalError = "Password must be at least 6 characters."; renderAuthModal(); return; }
  authBusy = true; authModalError = ""; renderAuthModal();
  try{
    const isSignup = authModalMode==="signup";
    const { data, error } = isSignup
      ? await supabaseClient.auth.signUp({ email, password })
      : await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){ authBusy = false; authModalError = error.message || "Something went wrong."; renderAuthModal(); return; }
    if(isSignup && data && data.user && !data.session){
      // Email confirmation is required before a session actually exists.
      authBusy = false; authModalMode = null; renderAuthModal();
      showToast("Account created! Check your email to confirm it, then log in.");
      return;
    }
    authUser = data.user ? {id:data.user.id, email:data.user.email} : null;
    authBusy = false; authModalMode = null; renderAuthModal(); renderAuthBar();
    await enterCloudMode();
  }catch(e){
    authBusy = false; authModalError = "Couldn't reach the server — check your connection and try again."; renderAuthModal();
  }
}

// Pulls this account's characters and takes over the roster from local storage.
async function enterCloudMode(){
  try{
    const { data, error } = await supabaseClient
      .from("characters").select("id,name,updated_at").order("updated_at", { ascending:false });
    if(error){ failCloudMode("Signed in, but couldn't load your saved characters ("+error.message+"). You're back to this device's local characters for now — try signing in again once that's resolved."); return; }
    if(data && data.length){
      roster = { index: data.map(r=>({id:r.id, name:r.name||""})), activeId: data[0].id };
      state = await cloudLoadCharacterData(roster.activeId);
    } else {
      state = structuredClone(DEFAULT_STATE);
      const newId = await cloudCreateCharacter(state);
      roster = { index: [{id:newId, name:""}], activeId:newId };
    }
    render();
    showToast("Signed in — your characters are now synced to your account.");
    // If the reason they signed in was a #join/<code> link (or they already had the Campaign
    // Tracker open), pick that right back up now that we know who they are — no need to make
    // them click the invite link a second time.
    if(currentView==="campaign") handleCampaignRouteEntry();
    refreshActiveCharacterCampaignLinks();
  }catch(e){
    // Log the real underlying error to the console (it was being silently swallowed before —
    // the toast alone couldn't show enough detail to diagnose a connectivity-level failure like
    // a blocked request or a CORS rejection, as opposed to a clean error response from Supabase).
    console.error("Cloud sync failed:", e);
    failCloudMode("Signed in, but couldn't reach the server to load your characters ("+(e&&e.message?e.message:"see console for details")+"). You're back to this device's local characters for now.");
  }
}

// If getting into cloud mode fails partway, don't leave the app signed in but still pointed at
// local data — that's exactly what caused every later save to fail too (saveState() kept trying
// to sync using an old local character id, which isn't a real database id, instead of either
// fully succeeding or cleanly stepping back). Fully revert to local mode instead, so the app is
// in one consistent, working state either way.
function failCloudMode(message){
  authUser = null;
  roster = loadRoster();
  state = loadState();
  renderAuthBar();
  render();
  showToast(message);
}

async function cloudLoadCharacterData(id){
  try{
    const { data, error } = await supabaseClient.from("characters").select("data").eq("id", id).single();
    if(error || !data) return structuredClone(DEFAULT_STATE);
    return migrateArmor(data.data, migrateRace(migrateAttacks(Object.assign(structuredClone(DEFAULT_STATE), data.data))));
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}

async function cloudCreateCharacter(initialState){
  try{
    const { data, error } = await supabaseClient.from("characters")
      .insert({ user_id: authUser.id, name: initialState.name||"", data: initialState }).select("id").single();
    if(error){ showToast("Couldn't create a new character in your account: "+error.message); return genCharId(); }
    return data.id;
  }catch(e){ showToast("Couldn't reach the server to create that character."); return genCharId(); }
}

// Fire-and-forget background sync, called from saveState() — never blocks the UI, and a failure
// just means this edit stays cached locally until the next successful save tries again.
async function cloudSaveCharacter(){
  if(!authUser) return;
  try{
    const { error } = await supabaseClient.from("characters")
      .update({ name: state.name||"", data: state, updated_at: new Date().toISOString() }).eq("id", roster.activeId);
    if(error) showToast("Couldn't sync your latest changes to your account — they're still saved on this device.");
  }catch(e){
    showToast("Couldn't reach the server to sync — your changes are still saved on this device.");
  }
}

async function cloudDeleteCharacter(id){
  try{
    const { error } = await supabaseClient.from("characters").delete().eq("id", id);
    if(error) showToast("Couldn't delete that character from your account.");
  }catch(e){ showToast("Couldn't reach the server to delete that character."); }
}

/* ===================== CAMPAIGN TRACKER =====================
   A DM runs a campaign; players join it via a shareable invite link and get their character
   linked in. It's its own standalone page (like Settings), reached via the masthead's crossed-
   swords button or a direct link, with three sub-views kept in sync with location.hash:
     #campaign            -> hub: "campaigns you run" / "campaigns you're in", + create new
     #campaign/<id>        -> detail: member list, notes, level-up controls, (DM) live roll log
     #join/<code>          -> accepting a shareable invite link
   Needs an account (campaigns are tied to auth.users via Supabase RLS — see
   campaign_tracker_migration.sql), so every sub-view has a signed-out fallback that points at
   the existing Log In/Sign Up flow above rather than duplicating it.
*/

// Parses location.hash into {view, route}. Shared by the very first page load (via function
// hoisting — this is defined after currentView's initial assignment, but `function`
// declarations are hoisted to the top of the script either way) and the hashchange listener
// further down, so a direct link and the browser's Back/Forward buttons land in the same place.
function routeFromHash(h){
  if(h === "#settings") return {view:"settings", route:null};
  if(h === "#campaign") return {view:"campaign", route:{mode:"hub"}};
  let m = h.match(/^#campaign\/([0-9a-fA-F-]+)$/);
  if(m) return {view:"campaign", route:{mode:"detail", id:m[1]}};
  m = h.match(/^#join\/([0-9a-f]+)$/i);
  if(m) return {view:"campaign", route:{mode:"join", code:m[1]}};
  return {view:"sheet", route:null};
}

function goToCampaignHub(){
  teardownCampaignRollSub();
  if(location.hash !== "#campaign") location.hash = "campaign";
  currentView = "campaign";
  campaignRoute = {mode:"hub"};
  campaignHubError = "";
  render();
  window.scrollTo(0,0);
  loadCampaignHubData();
}
function goToCampaignDetail(id){
  teardownCampaignRollSub();
  const h = "#campaign/"+id;
  if(location.hash !== h) location.hash = h;
  currentView = "campaign";
  campaignRoute = {mode:"detail", id};
  campaignDetailData = null;
  campaignDetailError = "";
  render();
  window.scrollTo(0,0);
  loadCampaignDetailData(id);
}

// Dispatches to whichever loader the current route needs. A no-op until authUser is known one
// way or the other, so it's safe to call eagerly (on first page load, and again once sign-in
// state resolves) without worrying about the order things happen in.
function handleCampaignRouteEntry(){
  if(!campaignRoute) return;
  if(campaignRoute.mode==="hub") loadCampaignHubData();
  else if(campaignRoute.mode==="detail") loadCampaignDetailData(campaignRoute.id);
  else if(campaignRoute.mode==="join") render(); // join page's own render already branches on authUser
}

function renderCampaignPage(){
  if(!campaignRoute) return "";
  if(campaignRoute.mode==="hub") return renderCampaignHubPage();
  if(campaignRoute.mode==="detail") return renderCampaignDetailPage(campaignRoute.id);
  if(campaignRoute.mode==="join") return renderCampaignJoinPage(campaignRoute.code);
  return "";
}

function campaignBackButton(){
  return `<button class="ghost small" id="btn-campaign-nav-back">&larr; Back to Character Sheet</button>`;
}
function campaignSignInPrompt(message){
  return `<div class="card open"><div class="card-body">
    <p>${escapeHtml(message)}</p>
    <div class="toolbar">
      <button class="small" id="btn-campaign-signup">Sign Up</button>
      <button class="ghost small" id="btn-campaign-login">Log In</button>
    </div>
  </div></div>`;
}

// --- Hub: "campaigns you run" + "campaigns you're in" ----------------------------------------
let campaignHubData = null; // null until loaded: {dmCampaigns:[...], memberCampaigns:[...]}
let campaignHubLoading = false;
let campaignHubError = "";
let showNewCampaignModal = false;
let newCampaignNameDraft = "";
let campaignCreateBusy = false;

async function loadCampaignHubData(){
  if(!authUser) return;
  campaignHubLoading = true;
  render();
  try{
    const [dmRes, memRes] = await Promise.all([
      supabaseClient.from("campaigns").select("id,name,level_up_mode,created_at")
        .eq("dm_user_id", authUser.id).order("created_at",{ascending:false}),
      supabaseClient.from("campaign_members").select("campaign_id, campaigns(name)")
        .eq("user_id", authUser.id)
    ]);
    if(dmRes.error) throw dmRes.error;
    if(memRes.error) throw memRes.error;
    campaignHubData = {
      dmCampaigns: dmRes.data || [],
      memberCampaigns: (memRes.data||[]).map(r=>({ id:r.campaign_id, name:(r.campaigns&&r.campaigns.name)||"Campaign" }))
    };
    campaignHubError = "";
  }catch(e){
    campaignHubError = "Couldn't load your campaigns ("+(e&&e.message?e.message:"connection error")+").";
  }
  campaignHubLoading = false;
  render();
}

async function createCampaign(){
  const name = (newCampaignNameDraft||"").trim() || "New Campaign";
  campaignCreateBusy = true;
  render();
  try{
    const { data, error } = await supabaseClient.from("campaigns")
      .insert({ dm_user_id: authUser.id, name }).select("id").single();
    if(error) throw error;
    showNewCampaignModal = false;
    newCampaignNameDraft = "";
    campaignCreateBusy = false;
    showToast("Campaign created!");
    goToCampaignDetail(data.id);
  }catch(e){
    campaignCreateBusy = false;
    showToast("Couldn't create that campaign ("+(e&&e.message?e.message:"connection error")+").");
    render();
  }
}

function renderCampaignHubPage(){
  const header = `<div class="masthead" style="justify-content:space-between;align-items:center;flex-wrap:wrap;">
    <h1>Campaigns</h1>
    ${campaignBackButton()}
  </div>`;
  if(!authUser){
    return header + campaignSignInPrompt("Campaigns need an account, so the DM and every player always see the same live data. Log in or sign up to create or join one.");
  }
  if(campaignHubLoading && !campaignHubData){
    return header + `<div class="card open"><div class="card-body"><p class="small-label">Loading your campaigns…</p></div></div>`;
  }
  const dmList = (campaignHubData && campaignHubData.dmCampaigns) || [];
  const memberList = (campaignHubData && campaignHubData.memberCampaigns) || [];
  const errorBox = campaignHubError ? `<div class="item-box" style="color:var(--wine-light);margin-bottom:10px;">${escapeHtml(campaignHubError)}</div>` : "";
  return header + `
    ${errorBox}
    <div class="card open">
      <div class="card-head"><h2 class="head-title">Campaigns You're Running</h2></div>
      <div class="card-body">
        ${dmList.length ? dmList.map(c=>campaignHubRow(c,true)).join("") : `<p class="small-label">You haven't created a campaign yet.</p>`}
        <div class="toolbar"><button class="small" id="btn-new-campaign">+ New Campaign</button></div>
      </div>
    </div>
    <div class="card open">
      <div class="card-head"><h2 class="head-title">Campaigns You're In</h2></div>
      <div class="card-body">
        ${memberList.length ? memberList.map(c=>campaignHubRow(c,false)).join("") : `<p class="small-label">You haven't joined a campaign yet — ask your DM for an invite link.</p>`}
      </div>
    </div>
    ${renderNewCampaignModal()}
    ${renderToast()}
  `;
}
function campaignHubRow(c, isDm){
  return `<div class="item-box campaign-row">
    <div><strong>${escapeHtml(c.name)}</strong>${isDm?' <span class="small-label">(DM)</span>':''}</div>
    <button class="ghost small" data-open-campaign="${c.id}">Open</button>
  </div>`;
}
function renderNewCampaignModal(){
  if(!showNewCampaignModal) return "";
  return `<div class="auth-modal-overlay" id="new-campaign-overlay">
    <div class="auth-modal">
      <h2>New Campaign</h2>
      <input type="text" id="new-campaign-name" placeholder="Campaign name" value="${escapeAttr(newCampaignNameDraft)}" maxlength="80">
      <button class="small" id="btn-create-campaign" style="width:100%;" ${campaignCreateBusy?"disabled":""}>${campaignCreateBusy?"Creating…":"Create Campaign"}</button>
      <div class="auth-switch"><a id="btn-cancel-new-campaign">Cancel</a></div>
    </div>
  </div>`;
}

// --- Detail: member list, notes, level-up controls, (DM) live roll log -----------------------
let campaignDetailData = null; // null until loaded: {campaign, isDm, members, charsById, notes, rolls}
let campaignDetailLoading = false;
let campaignDetailError = "";
let campaignRollSub = null; // active Supabase Realtime channel, or null
let campaignActionBusy = false;
let noteModalState = null; // null, or {id:null|string, title, body, visibility, visibleTo:[userIds]}
let campaignNoteBusy = false;
let campaignNoteError = "";

async function loadCampaignDetailData(id){
  if(!authUser) return;
  campaignDetailLoading = true;
  render();
  try{
    const { data: campaign, error: cErr } = await supabaseClient.from("campaigns")
      .select("id,name,dm_user_id,level_up_mode,dm_rest_control,created_at").eq("id", id).single();
    if(cErr || !campaign) throw (cErr || new Error("That campaign doesn't exist, or you don't have access to it."));
    const isDm = campaign.dm_user_id === authUser.id;

    const { data: members, error: mErr } = await supabaseClient.from("campaign_members")
      .select("id,user_id,character_id,pending_level_up,pending_rest,joined_at")
      .eq("campaign_id", id).order("joined_at",{ascending:true});
    if(mErr) throw mErr;

    const charIds = (members||[]).map(m=>m.character_id).filter(Boolean);
    const charsById = {};
    if(charIds.length){
      const { data: chars } = await supabaseClient.from("characters").select("id,name").in("id", charIds);
      (chars||[]).forEach(c=>{ charsById[c.id] = c; });
    }

    const { data: notes, error: nErr } = await supabaseClient.from("campaign_notes")
      .select("id,title,body,visibility,visible_to_user_ids,updated_at")
      .eq("campaign_id", id).order("updated_at",{ascending:false});
    if(nErr) throw nErr;

    let rolls = [];
    if(isDm){
      const { data: rollRows } = await supabaseClient.from("campaign_roll_log")
        .select("id,user_id,character_name,roll_label,total,is_crit,is_fail,created_at")
        .eq("campaign_id", id).order("created_at",{ascending:false}).limit(50);
      rolls = rollRows || [];
    }

    campaignDetailData = { campaign, isDm, members: members||[], charsById, notes: notes||[], rolls };
    campaignDetailError = "";
    subscribeToCampaignRolls(id, isDm);
  }catch(e){
    campaignDetailError = "Couldn't load that campaign ("+(e&&e.message?e.message:"connection error")+").";
  }
  campaignDetailLoading = false;
  render();
}

// Streams new dice rolls to the DM's roll-log card the instant a player's browser inserts one
// (see the Quick d20/Roll All/attack-roll call sites that write to campaign_roll_log) — no
// polling, no manual refresh. Realtime respects the same RLS policies as a normal query, so this
// subscription simply receives nothing if the signed-in user isn't actually this campaign's DM.
function subscribeToCampaignRolls(campaignId, isDm){
  teardownCampaignRollSub();
  if(!isDm || !supabaseClient) return;
  campaignRollSub = supabaseClient.channel("campaign-rolls-"+campaignId)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"campaign_roll_log", filter:"campaign_id=eq."+campaignId }, (payload)=>{
      if(!campaignDetailData || !campaignDetailData.campaign || campaignDetailData.campaign.id !== campaignId) return;
      campaignDetailData.rolls = [payload.new, ...campaignDetailData.rolls].slice(0,50);
      renderPreserveScroll();
    })
    .subscribe();
}
function teardownCampaignRollSub(){
  if(campaignRollSub){
    try{ supabaseClient.removeChannel(campaignRollSub); }catch(e){}
    campaignRollSub = null;
  }
}

// --- Streaming this player's own rolls into whichever campaign(s) their active character ------
// is linked to (usually one, but campaign_members doesn't forbid linking the same character
// into more than one campaign, so this handles that too), and surfacing the level-up banner
// below. Kept as a small cached list rather than queried on every single roll/render —
// refreshed whenever it could plausibly have changed: signing in, switching characters,
// accepting an invite, or linking a character from the campaign detail page. Logging is
// fire-and-forget, same spirit as cloudSaveCharacter() — a dropped background sync here
// shouldn't interrupt actually rolling the dice.
let activeCharacterCampaignIds = [];
// Parallel array: [{campaignId, pending, mode}] — this character's pending_level_up flag and
// its campaign's level_up_mode, for every campaign it's linked into. Powers renderLevelUpBanner().
let activeCharacterLevelUps = [];

async function refreshActiveCharacterCampaignLinks(){
  if(!isCloudMode() || !roster.activeId){
    activeCharacterCampaignIds = [];
    activeCharacterLevelUps = [];
    return;
  }
  try{
    const { data, error } = await supabaseClient.from("campaign_members")
      .select("campaign_id, pending_level_up, pending_rest, campaigns(level_up_mode)")
      .eq("user_id", authUser.id).eq("character_id", roster.activeId);
    if(error || !data){
      activeCharacterCampaignIds = [];
      activeCharacterLevelUps = [];
    } else {
      activeCharacterCampaignIds = data.map(r=>r.campaign_id);
      activeCharacterLevelUps = data.map(r=>({
        campaignId: r.campaign_id,
        pending: !!r.pending_level_up,
        mode: (r.campaigns && r.campaigns.level_up_mode) || "dm_only"
      }));
      // A rest the DM triggered while this character wasn't even loaded (app closed, different
      // character active, etc.) is still sitting on the row — apply it now rather than only on
      // the next live update, same reasoning as the level-up cache just above.
      data.forEach(r=>{ if(r.pending_rest) applyRemoteRest(r.campaign_id, r.pending_rest); });
    }
  }catch(e){
    activeCharacterCampaignIds = [];
    activeCharacterLevelUps = [];
  }
  // Nothing awaits this function — it's kicked off fire-and-forget after sign-in, switching
  // characters, etc. — so once it actually resolves, re-render to pick up the level-up banner
  // (and any newly-linked campaign for the roll log) rather than waiting for some unrelated
  // render to happen to show it.
  if(currentView==="sheet") renderPreserveScroll();
  subscribeToOwnLevelUps();
}

// --- DM-triggered rests: the DM sets campaign_members.pending_rest on a player's row; the
// player's own client (via the realtime subscription below, or on next load) applies the rest
// locally with performShortRest/performLongRest — exactly the same code their own Short/Long
// Rest buttons run — then clears the flag back to null. The DM never touches the player's HP,
// slots, etc. directly; they only ever flip this one flag, same pattern as pending_level_up.
async function applyRemoteRest(campaignId, kind){
  if(kind==="short") performShortRest({ triggeredByDm:true });
  else if(kind==="long") performLongRest({ triggeredByDm:true });
  else return;
  clearPendingRest(campaignId);
}
async function clearPendingRest(campaignId){
  try{
    await supabaseClient.from("campaign_members")
      .update({ pending_rest: null }).eq("campaign_id", campaignId).eq("user_id", authUser.id);
  }catch(e){
    console.warn("Couldn't clear pending_rest:", e);
  }
}

// Live level-up notifications: without this, a player who already has the sheet open when the
// DM clicks "Grant Level-Up" wouldn't see the banner until they switched characters or reloaded
// — the cache above only refreshes on specific triggers, not continuously. One Realtime
// subscription (filtered to this user's own campaign_members rows — RLS backs this up too, so
// it could never receive anyone else's) picks up that change the instant it happens. Needs
// `campaign_members` added to the supabase_realtime publication — see
// campaign_members_realtime_migration.sql.
let ownLevelUpSub = null;
function subscribeToOwnLevelUps(){
  teardownOwnLevelUpSub();
  if(!isCloudMode() || !supabaseClient) return;
  ownLevelUpSub = supabaseClient.channel("own-level-ups-"+authUser.id)
    .on("postgres_changes", { event:"UPDATE", schema:"public", table:"campaign_members", filter:"user_id=eq."+authUser.id }, (payload)=>{
      const row = payload.new;
      // Only matters if it's about the character currently on screen — a player could in theory
      // have a different character linked into a different campaign in the background.
      if(!row || row.character_id !== roster.activeId) return;
      const rec = activeCharacterLevelUps.find(x=>x.campaignId===row.campaign_id);
      if(rec) rec.pending = !!row.pending_level_up;
      else activeCharacterLevelUps.push({ campaignId: row.campaign_id, pending: !!row.pending_level_up, mode:"dm_only" });
      if(row.pending_rest) applyRemoteRest(row.campaign_id, row.pending_rest);
      if(currentView==="sheet") renderPreserveScroll();
    })
    .subscribe();
}
function teardownOwnLevelUpSub(){
  if(ownLevelUpSub){
    try{ supabaseClient.removeChannel(ownLevelUpSub); }catch(e){}
    ownLevelUpSub = null;
  }
}

// Tells renderLevelUpBanner() what, if anything, to show for the currently active character:
//   {pending:true, campaignId}            — a level-up is waiting; show "Take Level Up".
//   {pending:false, selfGrantable:true, campaignId} — no pending flag yet, but this campaign's
//                                            level_up_mode lets the player grant it themselves.
//   null                                   — nothing to show.
// If more than one linked campaign has something to show, the first pending one wins, otherwise
// the first self-grantable one — covers the v1 case (one character, one campaign) correctly and
// degrades reasonably for the rare multi-campaign case.
function pendingLevelUpInfo(){
  const withPending = activeCharacterLevelUps.find(x=>x.pending);
  if(withPending) return { campaignId: withPending.campaignId, pending:true };
  const selfGrantable = activeCharacterLevelUps.find(x=>!x.pending && (x.mode==="player_only" || x.mode==="both"));
  if(selfGrantable) return { campaignId: selfGrantable.campaignId, pending:false, selfGrantable:true };
  return null;
}

function renderLevelUpBanner(){
  const info = pendingLevelUpInfo();
  if(!info) return "";
  if(info.pending){
    return `<div class="level-up-banner">
      <span>&#11088; Your DM has granted you a level up!</span>
      <button class="small" id="btn-take-level-up">Take Level Up</button>
    </div>`;
  }
  return `<div class="level-up-banner subtle">
    <span>This campaign lets you level up whenever you're ready.</span>
    <button class="ghost small" id="btn-self-grant-level-up">Level Up</button>
  </div>`;
}

async function takeLevelUp(){
  const info = pendingLevelUpInfo();
  if(!info || !info.pending) return;
  try{
    const { error } = await supabaseClient.rpc("set_pending_level_up",
      { p_campaign_id: info.campaignId, p_target_user_id: authUser.id, p_value: false });
    if(error) throw error;
    const rec = activeCharacterLevelUps.find(x=>x.campaignId===info.campaignId);
    if(rec) rec.pending = false;
    showToast("Level up taken! Update your class level, HP, and features below — they're all yours to edit, as always.");
  }catch(e){
    showToast("Couldn't clear that ("+(e&&e.message?e.message:"connection error")+").");
  }
  renderPreserveScroll();
}
async function selfGrantLevelUp(){
  const info = pendingLevelUpInfo();
  if(!info || !info.selfGrantable) return;
  try{
    const { error } = await supabaseClient.rpc("set_pending_level_up",
      { p_campaign_id: info.campaignId, p_target_user_id: authUser.id, p_value: true });
    if(error) throw error;
    const rec = activeCharacterLevelUps.find(x=>x.campaignId===info.campaignId);
    if(rec) rec.pending = true;
    showToast("Level up granted — click Take Level Up when you're ready to apply it.");
  }catch(e){
    showToast("Couldn't do that ("+(e&&e.message?e.message:"connection error")+").");
  }
  renderPreserveScroll();
}

async function logRollToCampaigns({ total, label, breakdown, isCrit, isFail }){

  const row = {

}

async function copyInviteLink(campaignId){

      .insert({ campaign_id: campaignId }).select("invite_code").single();
    if(error) throw error;

async function copyToClipboard(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    return true;
  }catch(e){ return false; }
}

async function linkCharacterToCampaign(membershipId, characterId){
  if(!characterId) return;
  try{
    const { error } = await supabaseClient.from("campaign_members").update({ character_id: characterId }).eq("id", membershipId);
    if(error) throw error;
    if(campaignDetailData){
      const m = campaignDetailData.members.find(x=>x.id===membershipId);
      if(m) m.character_id = characterId;
      const found = roster.index.find(c=>c.id===characterId);
      if(found) campaignDetailData.charsById[characterId] = { id:characterId, name:found.name };
    }
    if(characterId === roster.activeId) refreshActiveCharacterCampaignLinks();
    showToast("Character linked to this campaign.");
  }catch(e){
    showToast("Couldn't link that character ("+(e&&e.message?e.message:"connection error")+").");
  }
  renderPreserveScroll();
}

async function saveNote(campaignId){
  const title = (document.getElementById("note-title-input")||{}).value || "";
  const body = (document.getElementById("note-body-input")||{}).value || "";
  const visibility = (document.getElementById("note-visibility-select")||{}).value || "dm_only";
  const visibleTo = Array.from(document.querySelectorAll(".note-visible-to:checked")).map(el=>el.value);
  if(!title.trim()){ campaignNoteError = "Give it a title."; renderPreserveScroll(); return; }
  campaignNoteBusy = true; campaignNoteError = ""; renderPreserveScroll();
  const payload = { campaign_id: campaignId, title: title.trim(), body, visibility, visible_to_user_ids: visibility==="specific"?visibleTo:[] };
  try{
    let error;
    if(noteModalState.id){
      ({ error } = await supabaseClient.from("campaign_notes").update(payload).eq("id", noteModalState.id));
    } else {
      ({ error } = await supabaseClient.from("campaign_notes").insert(payload));
    }
    if(error) throw error;
    noteModalState = null;
    campaignNoteBusy = false;
    showToast("Note saved.");
    loadCampaignDetailData(campaignId);
  }catch(e){
    campaignNoteBusy = false;
    campaignNoteError = (e&&e.message) ? e.message : "Couldn't save that note.";
    renderPreserveScroll();
  }
}
