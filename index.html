// ---- Subclass features in Quick Reference ----
// Every unlocked SUBCLASS_FEATURES entry is surfaced automatically. Spell-list entries ("... Spells",
// "Spellcasting") are left out since the Spells section already shows them; Combat Superiority has its
// own maneuver block; features with a picker (SUBCLASS_SINGLE_CHOICE) show the picked option instead.
function subclassFeatureExcludedFromQR(f){
  // Only genuine spell LISTS are left out (their spells show in the Spells section). A feature merely
  // named "... Spells" (Share Spells, Sculpt Spells, Psychic Spells) is a real feature and stays.
  const isSpellList = /\sSpells$/.test(f.name) && /always-prepared spells|spells are always prepared/i.test(f.desc);
  return isSpellList || f.name==="Spellcasting" || f.name==="Combat Superiority" || !!SUBCLASS_SINGLE_CHOICE[f.name];
}
// Default In Combat / Out of Combat / Both bucket, judged from the feature's text. Clear combat wording
// -> combat, clear utility wording -> out of combat, mixed or unclear -> both (so nothing is ever hidden
// by a wrong guess). The player can override per feature in Classes & Features.
// A few features the keyword rules can't judge (their text is about spells/dice rather than combat verbs).
const SUBCLASS_SCENARIO_OVERRIDE = {
  "Soulknife|Psionic Power":"both",
  "Warrior of Shadow|Shadow Arts":"both",
  "Warrior of the Elements|Stride of the Elements":"both",
  "War Domain|War God's Blessing":"combat"
};
function defaultSubclassScenario(f, sub){
  const ov = SUBCLASS_SCENARIO_OVERRIDE[`${sub}|${f.name}`];
  if(ov) return ov;
  const t = (f.name+" "+f.desc).toLowerCase();
  const combat = /attack|damage|reaction|bonus action|saving throw|\bsaves?\b|armor class|\bac\b|advantage|disadvantage|resistance|initiative|critical|temporary hit points|teleport|frighten|charm|prone|restrain|invisib|d20 test|combat|opportunity/.test(t);
  const explore = /proficien|language|\britual|expertise|telepath|speak with|commune|darkvision|spellbook|attune|spell scroll|minor illusion|herbalism|disguise|mimic/.test(t);
  if(combat && !explore) return "combat";
  if(explore && !combat) return "exploration";
  return "both";
}
function subclassFeatureScenario(cls, f){
  const ch = state.featureChoices[featureKey(cls,f.lvl,f.name)];
  if(ch && ch.category) return ch.category;
  const sub = (state.classes.find(c=>c.cls===cls)||{}).subclass;
  return defaultSubclassScenario(f, sub);
}
// Live, level/ability-aware wording for the few subclass features whose numbers scale.
function liveSubclassFeatureText(c, f, lvl){
  if(f.name==="Wholeness of Body" && c.subclass==="Warrior of the Open Hand"){
    const w = mod(abilTotal("wis")), uses = Math.max(1,w);
    return `Bonus action: heal d${martialArtsDie(lvl)}${fmt(w)} HP (Martial Arts die + Wisdom modifier); ${uses} use${uses===1?"":"s"} per long rest.`;
  }
  if(f.name==="Preserve Life") return `Channel Divinity: a pool of ${lvl*5} HP to split among Bloodied creatures within 30 ft (each up to half its HP maximum).`;
  if(f.name==="Radiance of the Dawn") return `Channel Divinity: dispel magical darkness within 30 ft; enemies there take 2d10 + ${lvl} radiant damage (Con save for half).`;
  if(f.name==="Survivor" && c.subclass==="Champion") return `Advantage on death saves (18-20 counts as a 20); while Bloodied and above 0 HP, regain ${5+mod(abilTotal("con"))} HP at the start of each of your turns.`;
  if(f.name==="Additional Fighting Style"){
    const st = (state.featureChoices[featureKey(c.cls,f.lvl,f.name)]||{}).style;
    return st ? `${st} — ${FIGHTING_STYLE_OPTIONS[st]}` : "Not chosen yet — pick it in Classes & Features.";
  }
  return null;
}

function chosenSubclassSubfeaturesHtml(scenario){
  const matches = cat => (cat||"combat")==="both" || (cat||"combat")===scenario;
  const parts = [];
  state.classes.forEach(c=>{
    if(!c.cls || !c.subclass) return;
    const fLvl = classLevelOf(c.cls);
    if(c.subclass==="Battle Master" && fLvl>=3){
      const bmKey = featureKey(c.cls,3,"Combat Superiority");
      const bmChoice = state.featureChoices[bmKey] || {};
      const maneuverKey = `class-agg:${c.cls}:BattleMasterManeuvers`;
      const selected = (state.featureChoices[maneuverKey] && state.featureChoices[maneuverKey].picks) || [];
      if(selected.length && matches(bmChoice.category)){
        const dice = superiorityDiceInfo(fLvl);
        const remaining = dice.count - (state.superiorityDiceUsed||0);
        const maneuverList = selected.map(m=>`<div class="feat-item"><div class="fname">${escapeHtml(m)}</div><div class="fdesc">${escapeHtml(BATTLE_MASTER_MANEUVERS[m])}</div></div>`).join("");
        parts.push(`<div class="small-label" style="margin-bottom:2px;font-weight:600;">Maneuvers &middot; Superiority Dice ${remaining}/${dice.count} (d${dice.die})</div>${maneuverList}`);
      }
    }
    (SUBCLASS_FEATURES[c.subclass] || []).forEach(f=>{
      if(f.lvl > fLvl) return;
      if(SUBCLASS_SINGLE_CHOICE[f.name]){
        const choice = state.featureChoices[featureKey(c.cls, f.lvl, f.name)];
        if(choice && choice.pick && matches(choice.category)){
          parts.push(`<div class="feat-item"><div class="fname">${escapeHtml(f.name)}: ${escapeHtml(choice.pick)}</div><div class="fdesc">${escapeHtml(SUBCLASS_SINGLE_CHOICE[f.name][choice.pick])}</div></div>`);
        }
        return;
      }
      if(subclassFeatureExcludedFromQR(f)) return;
      const cat = subclassFeatureScenario(c.cls, f);
      if(cat!=="both" && cat!==scenario) return;
      const text = liveSubclassFeatureText(c, f, fLvl);
      parts.push(`<div class="feat-item"><div class="fname">${escapeHtml(f.name)}</div><div class="fdesc">${escapeHtml(text!==null?text:f.desc)}</div></div>`);
    });
  });
  if(!parts.length) return "";
  return parts.join("") + `<hr class="divider">`;
}

function mysticArcanumUnlockedLevels(){
  const levels = new Set();
  state.classes.forEach(c=>{
    if(c.cls!=="Warlock") return;
    const lvl = parseInt(c.level)||0;
    Object.entries(MYSTIC_ARCANUM_LEVEL_MAP).forEach(([classLvl, spellLvl])=>{
      if(lvl >= parseInt(classLvl)) levels.add(spellLvl);
    });
  });
  return levels;
}

function mysticArcanumSummaryHtml(scenario){
  const unlocked = mysticArcanumUnlockedLevels();
  const entries = Object.entries(state.mysticArcanum||{})
    .filter(([lvl,a])=> unlocked.has(parseInt(lvl)) && a.spell && !a.used)
    .filter(([lvl,a])=> { const cat = a.category||"combat"; return cat==="both" || cat===scenario; })
    .sort((a,b)=>parseInt(a[0])-parseInt(b[0]));
  if(!entries.length) return "";
  const items = entries.map(([lvl,a])=>{
    const matched = SPELL_LIST.find(sp=>sp.name===a.spell);
    return `<div class="feat-item"><div class="fname">${escapeHtml(a.spell)} <span class="small-label">(Mystic Arcanum, Lv ${lvl})</span></div><div class="fdesc">${matched?matched.desc:""}</div></div>`;
  }).join("");
  return `<div class="small-label" style="margin-bottom:2px;">Mystic Arcanum (unused today):</div>${items}<hr class="divider">`;
}

function preparedSpellsHtml(scenario){
  if(!hasSpellcasting()) return "";
  const prepared = (state.spellsKnown||[]).filter(s=>{
    if(!s.prepared || !s.name) return false;
    const cat = s.category || "both";
    return cat==="both" || cat===scenario;
  });
  if(!prepared.length) return "";
  const items = prepared.map(s=>{
    const matched = SPELL_LIST.find(sp=>sp.name===s.name);
    const desc = matched ? matched.desc : (s.desc||"");
    const lvlTag = (s.lvl!==undefined && s.lvl!=="") ? ` <span class="small-label">(${s.lvl==0?"Cantrip":"Lv "+s.lvl})</span>` : "";
    return `<div class="feat-item"><div class="fname">${escapeHtml(s.name)}${lvlTag}</div><div class="fdesc">${escapeHtml(desc)}</div></div>`;
  }).join("");
  return `<div class="small-label" style="margin-bottom:2px;">Prepared Spells:</div>${items}<hr class="divider">`;
}

function featuresSectionHtml(standardHtml, subclassHtml, featsHtml, toggleableHtml, additionalHtml){
  const parts = [];
  if(standardHtml) parts.push(`<div class="small-label" style="margin-bottom:4px;font-weight:600;">Standard Class Features</div>${standardHtml}`);
  if(subclassHtml) parts.push(`<div class="small-label" style="margin-bottom:4px;font-weight:600;">Subclass Features</div>${subclassHtml}`);
  if(featsHtml) parts.push(`<div class="small-label" style="margin-bottom:4px;font-weight:600;">Feats</div>${featsHtml}`);
  if(toggleableHtml) parts.push(`<div class="small-label" style="margin-bottom:4px;font-weight:600;">Toggleable Class Features</div>${toggleableHtml}`);
  if(additionalHtml) parts.push(`<div class="small-label" style="margin-bottom:4px;font-weight:600;">Additional Features</div>${additionalHtml}`);
  if(!parts.length) return `<div class="small-label">No features to show yet.</div>`;
  return parts.join('<hr class="divider">');
}

// Builds the display name + description for one allChosenFeats() entry — handles a repeatable
// feat's pick substitution (damage type, spell list), Magic Initiate's extra specifics (ability,
// cantrips, spell chosen), and the Origin Feat's bonus tool proficiency note. Shared by the
// Quick Reference Feats list and the Background section in Character Info, so the two can never
// end up describing the same feat differently.
function describeChosenFeat(f){
  const def = FEATS[f.feat];
  const pick = (def.repeatable && def.repeatField) ? f.choice[def.repeatField] : "";
  let desc = def.desc;
  if(pick){
    const label = def.repeatLabel[0].toUpperCase()+def.repeatLabel.slice(1);
    if(f.feat==="Magic Initiate"){
      const abilName = f.choice.miAbility ? ABIL_NAMES[f.choice.miAbility] : "(ability not chosen)";
      const cantrips = [f.choice.cantrip1, f.choice.cantrip2].filter(Boolean).join(", ") || "(cantrips not chosen)";
      const spell = f.choice.miSpell || "(spell not chosen)";
      desc = `${label}: ${pick}. Ability: ${abilName}. Cantrips: ${cantrips}. Spell: ${spell}.`;
    } else {
      desc = `${label}: ${pick}. ${def.desc}`;
    }
  }
  let name = f.feat + (pick ? ` — ${pick}` : "");
  if(f.source==="Origin"){
    name += ` · Origin Feat (${state.background})`;
    const bgInfo = BACKGROUNDS[state.background];
    if(bgInfo) desc += ` Also grants proficiency with ${bgInfo.tool} — see Tool Proficiencies under Equipment &amp; Currency.`;
  } else if(def.tier==="epic"){
    name += " · Epic Boon";
  }
  return {name, desc};
}

function chosenFeatsHtmlFor(scenario){
  const feats = allChosenFeats().filter(f=> f.category==="both" || f.category===scenario);
  if(!feats.length) return "";
  return feats.map(f=>{
    const {name, desc} = describeChosenFeat(f);
    return `<div class="feat-item"><div class="fname">${escapeHtml(name)}</div><div class="fdesc">${escapeHtml(desc)}</div></div>`;
  }).join("");
}

// Shared between the Combat and Exploration Quick Reference views, so both always show
// identical skill totals computed the same way, rather than two copies that could drift.
function profSkillListText(){
  const pb = profBonus();
  return SKILLS.filter(([n])=>isSkillProficient(n)).map(([n,a])=>{
    const exp = isSkillExpertise(n);
    const total = mod(abilTotal(a)) + (exp?pb*2:pb);
    return `${n} ${fmt(total)}${exp?" (expertise)":""}`;
  }).join(", ") || "No proficient skills yet";
}

function renderExplorationSummary(){
  const pb = profBonus();
  const profSkillList = profSkillListText();
  // 2024 rules: Expertise applies only to skills, never to tool proficiencies — see
  // showThievesToolsRow() for the confirmed source citation. Tool checks always use a plain
  // proficiency bonus, never doubled.
  const profToolList = computeToolProficiencies().map(e=>{
    const abil = TOOL_DEFAULT_ABILITY[e.label] || "int";
    const total = mod(abilTotal(abil)) + pb;
    return `${e.label} ${fmt(total)}`;
  }).join(", ") || "No tool proficiencies yet";
  const feats = scenarioFeatureList("exploration");
  const standardHtml = feats.length ? standardFeaturesHtml(feats) : "";
  const chosenFeatsHtml = chosenFeatsHtmlFor("exploration");
  const toggleableHtml = activeClassEffectsHtmlFor("exploration");
  const additionalHtml = customFeaturesHtmlFor("exploration");
  const subclassHtml = chosenSubclassSubfeaturesHtml("exploration");
  const featsHtml = featuresSectionHtml(standardHtml, subclassHtml, chosenFeatsHtml, toggleableHtml, additionalHtml);
  const chips = [inspirationChipHtml(), bodySizeChipHtml()].filter(Boolean).join("");
  return `

function renderPersonalityNotesLoreSummary(){
  const bgInfo = state.background ? BACKGROUNDS[state.background] : null;
  const backgroundHtml = bgInfo ? `<div class="feat-item"><div class="fname">${escapeHtml(state.background)}</div><div class="fdesc">${escapeHtml(bgInfo.desc||"")}</div></div><hr class="divider">` : "";

    <div class="small-label" style="font-weight:600;">${label}</div>

      ? `<div class="fdesc" style="white-space:pre-wrap;">${escapeHtml(val)}</div>`

function qrBodyHtml(){
  const view = state.scenarioView || "combat";
  let body;
  if(view==="combat") body = renderCombatSummary();
  else if(view==="exploration") body = renderExplorationSummary();
  // "lore" and "notes" are kept here only so a view preference saved before these three were
  // combined into one still lands somewhere sensible, instead of silently falling through.
  else if(view==="personality" || view==="lore" || view==="notes") body = renderPersonalityNotesLoreSummary();
  else body = renderCombatSummary();
  const combinedSelected = (view==="personality"||view==="lore"||view==="notes") ? "selected" : "";
  return `
      <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
        <select data-field="scenarioView" style="width:auto;">
          <option value="combat" ${view==="combat"?"selected":""}>In Combat</option>
          <option value="exploration" ${view==="exploration"?"selected":""}>Out of Combat</option>
          <option value="personality" ${combinedSelected}>Personality, Notes &amp; Lore</option>
        </select>
      </div>
      ${body}
  `;
}

// Refreshes just the Quick Reference card's contents (without a full app re-render), so typing
// in a field elsewhere on the sheet (attacks, spells, custom features, etc.) doesn't lose focus
// but still updates the summary live.
function refreshQuickReference(){
  const container = document.getElementById("qr-card-body");
  if(!container) return;
  container.innerHTML = qrBodyHtml();
  const sel = container.querySelector('select[data-field="scenarioView"]');
  if(sel) sel.addEventListener("change", ()=>{
    state.scenarioView = sel.value;
    saveState(); renderPreserveScroll();
  });
}

function lbl(text,tip){
  return `<label class="field-label">${text}${tip?`<span class="help" title="${escapeAttr(tip)}">?</span>`:""}</label>`;
}

function feetIn(totalInches){
  const n = parseInt(totalInches)||0;
  const ft = Math.floor(n/12), inch = n%12;
  return `${ft}'${inch}"`;
}

function applyHpDelta(delta){
  const beforePool = (state.hp.current||0) + (state.hp.temp||0);
  if(delta < 0){
    // Damage: temp HP absorbs it first, then current HP takes the remainder.
    let dmg = -delta;
    checkConcentrationOnDamage(dmg);
    const tempAbsorbed = Math.min(state.hp.temp||0, dmg);
    state.hp.temp = (state.hp.temp||0) - tempAbsorbed;
    dmg -= tempAbsorbed;
    state.hp.current = Math.max(0, state.hp.current - dmg);
  } else {
    state.hp.current = Math.min(autoMaxHP(), state.hp.current + delta);
  }
  saveState(); renderPreserveScroll();
  const afterPool = (state.hp.current||0) + (state.hp.temp||0);
  if(afterPool < beforePool) playDamageTick();
  else if(afterPool > beforePool) playHealTick();
}

function rollAttackAndShow(atkIdx){
  if(diceRollLocked) return; // a roll is already spinning — ignore the click instead of quietly re-rolling behind it
  const a = state.attacks[atkIdx];
  if(!a) return;
  const advMode = state.diceRoller.advantageMode || "normal";
  const atkBonus = computeAttackBonus(a);
  const name = attackDisplayName(a);

  let toHit;
  if(advMode!=="normal"){
    const v1 = 1 + Math.floor(Math.random()*20);
    const v2 = 1 + Math.floor(Math.random()*20);
    let chosenIndex;
    if(v1===20 || v2===20) chosenIndex = v1===20 ? 0 : 1;
    else if(v1===1 || v2===1) chosenIndex = v1===1 ? 0 : 1;
    else if(advMode==="advantage") chosenIndex = v1>=v2 ? 0 : 1;
    else chosenIndex = v1<=v2 ? 0 : 1;
    const values = [v1,v2];
    toHit = {values, chosenIndex, roll:values[chosenIndex], advMode, isNat20:values[chosenIndex]===20, isNat1:values[chosenIndex]===1};
  } else {
    const roll = 1 + Math.floor(Math.random()*20);
    toHit = {values:[roll], chosenIndex:0, roll, advMode:"normal", isNat20:roll===20, isNat1:roll===1};
  }
  toHit.bonus = atkBonus;
  toHit.total = toHit.roll + atkBonus;

  const abilMod = a.abilityKey ? mod(abilTotal(a.abilityKey)) : 0;
  const weaponDef = WEAPONS[a.weaponKey];
  const gwfActive = a.gwfActive !== undefined ? a.gwfActive : (weaponDef ? !!weaponDef.gwf : false);
  const gwfApplies = gwfActive && fightingStyleChoice().includes("Great Weapon Fighting") && !(weaponDef && weaponDef.ranged);
  let gwfUpgradedCount = 0;
  let damageTotal = 0;
  const damageLines = (a.damages||[]).filter(d=>d.active!==false).map((d,i)=>{
    const count = parseInt(d.count)||1;
    const die = parseInt(d.die)||6;
    const values = [];
    for(let k=0;k<count;k++){
      let v = 1 + Math.floor(Math.random()*die);
      if(i===0 && gwfApplies && v<=2){ v = 3; gwfUpgradedCount++; }
      values.push(v);
    }
    let subtotal = values.reduce((s,v)=>s+v,0);
    let addedMod = 0;
    if(i===0 && a.addAbilityToDamage && a.abilityKey){ addedMod = abilMod; subtotal += addedMod; }
    damageTotal += subtotal;
    return {count, die, type:d.type, values, addedMod, subtotal};
  });
  const gwfNote = gwfApplies ? (gwfUpgradedCount>0 ? `Great Weapon Fighting: ${gwfUpgradedCount} die${gwfUpgradedCount===1?"":"s"} showing 1-2 treated as 3.` : "Great Weapon Fighting applies (no dice rolled 1 or 2 this time).") : "";

  let masteryNote = "";
  if(weaponDef && weaponDef.mastery && (state.weaponMasteries||[]).includes(a.weaponKey)){
    const m = weaponDef.mastery;
    if(m==="Topple"){
      masteryNote = `Topple: target makes a DC ${8+profBonus()+abilMod} Constitution save or falls prone.`;
    } else if(m==="Graze"){
      masteryNote = `Graze: on a miss, still deal ${abilMod} damage (your ability modifier).`;
    } else {
      const def = WEAPON_MASTERY_DEFS[m];
      masteryNote = `${m} (${def.trigger}): ${def.desc}`;
    }
  }

  // The to-hit roll is always a d20; damage dice are usually a different size, so an attack
  // only gets a die-specific shape in the rare case every damage die happens to match (d20 too).
  const attackFaces = new Set([20, ...damageLines.map(d=>d.die)]);
  const attackDieFace = attackFaces.size===1 ? 20 : null;
  // Same deliberate hold as Roll All above: state.diceRoller.attackResult (and its render) don't
  // land until onReveal fires, so the to-hit/damage readout can't spoil the result mid-spin.
  triggerDiceFx({
    total: toHit.isNat1 ? toHit.total : (damageTotal || toHit.total),
    label: toHit.isNat20 ? "Critical Hit!" : (toHit.isNat1 ? "Critical Miss!" : name),
    breakdown: toHit.isNat1 ? `To Hit: ${toHit.roll} + ${fmt(atkBonus)} = ${toHit.total}` : `To Hit: ${toHit.total}  •  Damage: ${damageTotal}`,
    isCrit: toHit.isNat20,
    isFail: toHit.isNat1,
    dieFace: attackDieFace,
    onReveal: ()=>{
      state.diceRoller.attackResult = {name, toHit, damage:{lines:damageLines, total:damageTotal}, gwfNote, masteryNote};
      saveState(); renderPreserveScroll();
    }
  });
}

function computeRollModifier(){
  const rt = state.diceRoller.rollType;
  const target = state.diceRoller.rollTarget;
  if(!rt || rt==="none" || !target) return null;
  const pb = profBonus();
  if(rt==="ability"){
    let val = mod(abilTotal(target));
    return {label:`${ABIL_NAMES[target]} Check`, value: val};
  }
  if(rt==="save"){
    const prof = hasSaveProficiency(target);
    return {label:`${ABIL_NAMES[target]} Saving Throw`, value: mod(abilTotal(target)) + (prof?pb:0)};
  }
  if(rt==="skill"){
    const abilKey = (SKILLS.find(([n])=>n===target)||[])[1];
    if(!abilKey) return null;
    const prof = isSkillProficient(target);
    const exp = isSkillExpertise(target);
    let val = mod(abilTotal(abilKey));
    if(exp) val += pb*2;
    else if(prof) val += pb;
    else if(state.classes.some(c=>c.cls==="Bard" && classLevelOf("Bard")>=2)) val += Math.floor(pb/2); // Jack of All Trades
    return {label:`${target} (${abilKey.toUpperCase()}) Skill Check`, value: val};
  }
  if(rt==="tool"){
    // Per the Tool Proficiencies table, each tool has one listed default ability — same as a
    // skill's default ability — so this isn't a player choice the way it is for a bare Ability Check.
    // 2024 rules: Expertise applies only to skills, never tools (see showThievesToolsRow()) —
    // always a plain proficiency bonus here, never doubled.
    const abilKey = TOOL_DEFAULT_ABILITY[target] || "int";
    let val = mod(abilTotal(abilKey)) + pb; // dropdown only ever offers proficient tools
    return {label:`${target} (${abilKey.toUpperCase()}) Tool Check`, value: val};
  }
  return null;
}

// Each die size gets its own silhouette (a rough stand-in for its real polyhedron face — no
// attempt at geometric accuracy, just something visually distinct) drawn with clip-path, plus
// how much extra padding the result card needs so the total/label/breakdown text clears the
// shape's points instead of getting clipped by them. d6 and d100 use the plain rounded-square/
// circle look with no clip-path at all. Pulled from a single die face (dieFace); when a roll
// mixes more than one die size, there's no single shape to show (see rollDieFace()) and both
// the icon and the card fall back to the plain default look.
const DICE_FX_SHAPES = {
  4:  {clip:"polygon(50% 2%, 96% 95%, 4% 95%)",                                   pad:"58px 28px 26px"},
  8:  {clip:"polygon(50% 2%, 98% 50%, 50% 98%, 2% 50%)",                          pad:"44px 30px"},
  10: {clip:"polygon(50% 0%, 90% 30%, 90% 70%, 50% 100%, 10% 70%, 10% 30%)",      pad:"38px 20px"},
  12: {clip:"polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%)",              pad:"44px 30px 36px"},
  20: {clip:"polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%)",      pad:"32px 44px"}
};
function dieShapeInfo(dieFace){
  const shape = DICE_FX_SHAPES[dieFace];
  if(shape) return {clip:shape.clip, pad:shape.pad, circle:false, label:`d${dieFace}`};
  if(dieFace===6 || dieFace===100) return {clip:null, pad:null, circle:dieFace===100, label:`d${dieFace}`};
  return null; // mixed dice, or no single die size known — default look, no label
}

// Spins a die on screen, then pops a glowing result card over it — gold for a Nat 20, dark red
// for a Nat 1, plain brass otherwise. Plays the matching sound (crit fanfare / fail thud) for
// those two cases; a normal roll gets the visual with no extra sound. Runs independently of the
// sheet's render cycle (see the #dice-fx-overlay CSS note) so a saveState()+render() right after
// rolling doesn't cut the animation off. dieFace (e.g. 20 for a d20) shapes both the spinning
// icon and the result card's outline to match the die actually rolled, in the current theme's
// colors; omit it (or pass a mixed roll's null) to fall back to the plain emoji + square card.
let diceFxDismissTimer = null;
// True for exactly the 2-second spin of the most recent roll — every roll trigger (Roll All,
// an attack, Quick d20) checks this FIRST and bails out before touching any state if a roll is
// already spinning, so mashing the button can't quietly recompute/overwrite a result behind the
// animation's back. The overlay itself also can't be click-dismissed until the spin is actually
// done, closing the other way someone could skip past it. Cleared the moment the spin ends —
// the result card lingering afterward doesn't keep the next roll locked out.
let diceRollLocked = false;
// `onReveal`, if given, fires at the exact moment the spin ends and the number becomes visible
// (same instant as `diceRollLocked` clearing below) — never earlier. Callers use it to commit the
// roll into whatever state drives their own on-page display (the Dice Roller card's Result box,
// an attack's to-hit/damage readout, the campaign roll log) so nothing on screen reveals the
// outcome ahead of the animation. Nothing about `total`/`label`/etc. above leaks early either —
// they only ever reach the DOM inside the overlay's own innerHTML, which stays display:none via
// CSS until the reveal.
function triggerDiceFx({total, label, breakdown, isCrit, isFail, dieFace, onReveal}){
  if(diceRollLocked) return;
  const overlay = document.getElementById("dice-fx-overlay");
  if(!overlay){ if(typeof onReveal==="function") onReveal(); return; }
  diceRollLocked = true;
  clearTimeout(diceFxDismissTimer);
  const shape = dieShapeInfo(dieFace);
  const shapeStyle = shape ? `clip-path:${shape.clip||"none"};${shape.circle?"border-radius:50%;":(shape.clip?"border-radius:0;":"")}` : "";
  const resultStyle = shape ? `${shapeStyle}${shape.pad?`padding:${shape.pad};`:""}` : "";
  const shapeContent = (dieFace===6)
    ? `<div class="dice-fx-pips">${Array(6).fill('<div class="dice-fx-pip"></div>').join("")}</div>`
    : shape && shape.label;
  const dieIconInner = shape ? `<div class="dice-fx-shape" style="${shapeStyle}">${shapeContent}</div>` : `<div class="dice-fx-emoji">&#127922;</div>`;
  overlay.innerHTML = `
    <div class="dice-fx-die" id="dice-fx-die">${dieIconInner}</div>
    <div class="dice-fx-result" id="dice-fx-result" style="${resultStyle}">
      <div class="dice-fx-total">${total}</div>
      ${label?`<div class="dice-fx-label">${escapeHtml(label)}</div>`:""}
      ${breakdown?`<div class="dice-fx-breakdown">${escapeHtml(breakdown)}</div>`:""}
    </div>
  `;
  const resultEl = document.getElementById("dice-fx-result");
  resultEl.classList.toggle("crit", !!isCrit);
  resultEl.classList.toggle("fail", !!isFail);
  overlay.classList.add("show");
  const dismiss = ()=>{ overlay.classList.remove("show"); overlay.innerHTML = ""; overlay.onclick = null; };
  // Deliberately NOT click-dismissable yet — that was the other way someone could skip past the
  // spin early. It becomes clickable again once the spin finishes, below.
  overlay.onclick = null;
  // The dice spin always runs its full 2 seconds — this is a personal tool for one table, not
  // a public page, so there's no reason to let an OS-level "reduce motion" setting silently cut
  // the roll short. (It still trims the subtler result-pop animation via the CSS media query
  // above, in case that setting really is on, but the roll itself and its sound always play out.)
  const spinDuration = 2000;
  playDiceRollSound(1.8);
  setTimeout(()=>{
    document.getElementById("dice-fx-die")?.remove();
    const r = document.getElementById("dice-fx-result");
    if(r){
      r.classList.add("show");
      if(isCrit) playCritFanfare(); else if(isFail) playFailThud();
    }
    overlay.onclick = dismiss; // the mandatory wait is over — happy to be dismissed early now
    diceRollLocked = false; // ...and the next roll may begin
    // Fire-and-forget: streams this roll to the DM's live roll log if this character is linked
    // into a campaign. Deliberately held until right here (not back at trigger time) so the DM's
    // feed can't tip anyone off to the result before the roller's own screen reveals it either.
    logRollToCampaigns({total, label, breakdown, isCrit, isFail});
    if(typeof onReveal === "function") onReveal();
  }, spinDuration);
  diceFxDismissTimer = setTimeout(dismiss, spinDuration + 2200);
}

function renderDiceRollerCard(){
  const pool = state.diceRoller.pool || [];
  const rows = pool.map((d,i)=>`
    <div class="dice-chip" data-dice-idx="${i}">
      <select data-dice="count" title="How many of this die to roll.">
        ${Array.from({length:20},(_,n)=>n+1).map(n=>`<option value="${n}" ${d.count===n?"selected":""}>${n}</option>`).join("")}
      </select>
      <select data-dice="die" title="Which die.">
        ${DICE_OPTIONS.map(sides=>`<option value="${sides}" ${d.die===sides?"selected":""}>d${sides}</option>`).join("")}
      </select>
      <label class="inc" title="Include this dice line the next time you hit Roll All. Leave your other dice set up and just toggle on what you need for this roll.">
        <input type="checkbox" class="check" data-dice-included="${i}" ${d.included!==false?"checked":""}> inc
      </label>
      <button class="icon ghost small dice-chip-x" data-remove-dice="${i}" title="Remove this dice line.">&times;</button>
    </div>`).join("");

  const results = state.diceRoller.results;
  let resultsHtml = "";
  if(results){
    const lines = results.rolls.map(r=>{
      if(r.advMode){
        const shown = r.values.map((v,i)=> i===r.chosenIndex
          ? `<strong style="color:var(--brass);">${v}</strong>`
          : `<span style="opacity:.5;text-decoration:line-through;">${v}</span>`
        );
        const tag = r.isNat20 ? ' <span class="small-label" style="color:var(--brass);">Nat 20!</span>' : (r.isNat1 ? ' <span class="small-label" style="color:var(--wine);">Nat 1!</span>' : '');
        return `<div class="fdesc">1d20 (${r.advMode==="advantage"?"Advantage":"Disadvantage"}): [${shown.join(", ")}] = ${r.subtotal}${tag}</div>`;
      }
      return `<div class="fdesc">${r.count}d${r.die}: [${r.values.join(", ")}] = ${r.subtotal}</div>`;
    }).join("");
    const modLine = results.modifier ? `<div class="fdesc">${results.modifier.label}: ${fmt(results.modifier.value)}</div>` : "";
    resultsHtml = `<div class="item-box" style="margin-top:8px;">
      <div class="small-label" style="margin-bottom:4px;font-weight:600;">Result</div>
      ${lines}
      ${modLine}
      <div class="fname" style="margin-top:4px;">Total: ${results.total}</div>
    </div>`;
  }

  const ar = state.diceRoller.attackResult;
  let attackResultHtml = "";
  if(ar){
    const th = ar.toHit;
    let toHitDisplay;
    if(th.advMode!=="normal"){
      const shown = th.values.map((v,i)=> i===th.chosenIndex
        ? `<strong style="color:var(--brass);">${v}</strong>`
        : `<span style="opacity:.5;text-decoration:line-through;">${v}</span>`
      );
      toHitDisplay = `[${shown.join(", ")}] ${fmt(th.bonus)} = <strong>${th.total}</strong>`;
    } else {
      toHitDisplay = `[${th.roll}] ${fmt(th.bonus)} = <strong>${th.total}</strong>`;
    }
    const critTag = th.isNat20 ? ' <span class="small-label" style="color:var(--brass);">Nat 20!</span>' : (th.isNat1 ? ' <span class="small-label" style="color:var(--wine);">Nat 1!</span>' : '');
    const dmgLines = ar.damage.lines.map(l=>`<div class="fdesc">${l.count}d${l.die}${l.type?` ${l.type}`:""}: [${l.values.join(", ")}]${l.addedMod?` ${fmt(l.addedMod)}`:""} = ${l.subtotal}</div>`).join("");
    attackResultHtml = `<div class="item-box" style="margin-top:8px;">
      <div class="small-label" style="margin-bottom:4px;font-weight:600;">${escapeHtml(ar.name)} — Attack Result</div>
      <div class="fdesc">To Hit${th.advMode!=="normal"?` (${th.advMode==="advantage"?"Advantage":"Disadvantage"})`:""}: ${toHitDisplay}${critTag}</div>
      <hr class="divider">
      <div class="small-label" style="margin-bottom:2px;">Damage:</div>
      ${dmgLines}
      ${ar.gwfNote ? `<div class="small-label" style="margin-top:2px;color:var(--brass-light);">${escapeHtml(ar.gwfNote)}</div>` : ""}
      ${ar.masteryNote ? `<div class="small-label" style="margin-top:2px;color:var(--brass-light);">${escapeHtml(ar.masteryNote)}</div>` : ""}
      <div class="fname" style="margin-top:4px;">Total Damage: ${ar.damage.total}</div>
    </div>`;
  }

  const advMode = state.diceRoller.advantageMode || "normal";

  const rollType = state.diceRoller.rollType || "none";
  const rollTarget = state.diceRoller.rollTarget || "";
  let targetOptions = "";
  if(rollType==="ability"){
    targetOptions = ABILS.map(a=>`<option value="${a}" ${rollTarget===a?"selected":""}>${ABIL_NAMES[a]}</option>`).join("");
  } else if(rollType==="save"){
    targetOptions = ABILS.map(a=>`<option value="${a}" ${rollTarget===a?"selected":""}>${ABIL_NAMES[a]} Save</option>`).join("");
  } else if(rollType==="skill"){
    targetOptions = SKILLS.map(([n])=>`<option value="${n}" ${rollTarget===n?"selected":""}>${n}</option>`).join("");
  } else if(rollType==="tool"){
    // Only tools you're actually proficient with — same "eligible options only" rule as everywhere
    // else on the sheet, since an untrained tool check gets no bonus and isn't worth listing here.
    const proficientTools = TOOL_LIST.filter(isToolProficient);
    targetOptions = proficientTools.map(n=>`<option value="${escapeAttr(n)}" ${rollTarget===n?"selected":""}>${escapeHtml(n)}</option>`).join("");
  }
  const advModeTitle = "Advantage rolls two d20s and keeps the higher; Disadvantage keeps the lower. Either way, a natural 20 always wins outright, and — if no 20 came up — a natural 1 gets called out instead. Needs exactly one d20 (count 1) in your included dice.";
  const rollModeToggle = `
    <div class="dice-inline-label" title="${escapeAttr(advModeTitle)}">Roll Mode<span class="help" title="${escapeAttr(advModeTitle)}">?</span></div>
    <div class="seg-toggle" data-dice-advmode-group>
      <button type="button" data-dice-advmode="normal" class="${advMode==="normal"?"active":""}">Normal</button>
      <button type="button" data-dice-advmode="advantage" class="${advMode==="advantage"?"active":""}">Adv</button>
      <button type="button" data-dice-advmode="disadvantage" class="${advMode==="disadvantage"?"active":""}">Dis</button>
    </div>
  `;

  const modifierSection = `
    <div class="dice-inline-row" style="margin-top:10px;">
      <div>
        ${lbl("Add a Modifier","Automatically adds your current bonus — pulled live from your sheet, including racial bonuses, feats, equipment, and any active Toggleable Class Effects — as its own line item in the result.")}
        <select id="dice-roll-type">
          <option value="none" ${rollType==="none"?"selected":""}>No modifier</option>
          <option value="ability" ${rollType==="ability"?"selected":""}>Ability Check</option>
          <option value="save" ${rollType==="save"?"selected":""}>Saving Throw</option>
          <option value="skill" ${rollType==="skill"?"selected":""}>Skill Check</option>
          ${computeToolProficiencies().length ? `<option value="tool" ${rollType==="tool"?"selected":""}>Tool Check</option>` : ""}
        </select>
      </div>
      ${rollType!=="none" ? `<div>
        ${lbl("Which one",rollType==="tool" ? "Which tool. Not proficient still works — no bonus is added, just like an untrained skill check." : "Which ability, save, or skill to pull the modifier from.")}
        <select id="dice-roll-target">
          <option value="">— choose —</option>
          ${targetOptions}
        </select>
      </div>` : ""}
    </div>
  `;

  return `
    <div class="dice-card">
      <div class="dice-grid">
        <div>
          ${lbl("Dice Pool","Add any number of dice lines, each with its own count and die type. Use 'include' to pick which ones count toward the total on your next roll — keep dice you don't need right now unchecked instead of deleting them.")}

        </div>
        <div>

          ${modifierSection}
          <button class="small" id="btn-roll-dice" style="margin-top:4px;">&#127922; Roll All</button>
        </div>
      </div>
      ${resultsHtml}
      ${attackResultHtml}
    </div>
  `;
}

function renderConcentrationTracker(){
  const conc = state.concentration || {active:false, label:"", isCustom:false};
  const options = concentrationOptions();
  return `

      <select id="concentration-select" style="flex:1;min-width:160px;">
        <option value="" ${!conc.active?"selected":""}>Not Concentrating</option>
        ${options.map(name=>`<option value="${escapeAttr(name)}" ${(conc.active && !conc.isCustom && conc.label===name)?"selected":""}>${name}</option>`).join("")}

function checkConcentrationOnDamage(dmgAmount){
  if(!state.concentration || !state.concentration.active || dmgAmount<=0) return;
  const dc = Math.max(10, Math.floor(dmgAmount/2));
  showToast(`Concentration check! DC ${dc} Constitution save or you lose concentration on ${state.concentration.label||"your spell/effect"} (took ${dmgAmount} damage).`);
}

// A class row's Hit Die size — a Custom class uses its own chosen die (customHitDie()) instead
// of the fixed CLASS_HIT_DIE lookup, which doesn't have a "Custom" entry at all.
function classHitDie(c){ return c.cls==="Custom" ? customHitDie(c) : (CLASS_HIT_DIE[c.cls] || 8); }

function hitDiceSummary(){
  const byClass = {};
  state.classes.forEach(c=>{ if(c.cls){ const die=classHitDie(c); byClass[die] = (byClass[die]||0) + (parseInt(c.level)||0);} });
  return Object.entries(byClass).map(([die,n])=>`${n}d${die}`).join(" + ") || "—";
}

// Puts the Hit Die size front-and-center on the Hit Dice Used line instead of buried in a
// trailing parenthetical, so it's obvious at a glance which die to actually roll. A single-class
// (or same-die-size multiclass) character just gets a clean "d8" — only a genuine mix of Hit Die
// sizes across classes (e.g. a Fighter/Wizard, d10 and d6) falls back to the full "5d10 + 3d6"
// breakdown, since there isn't one size to show.
function hitDiceLabel(){
  const sizes = new Set();
  state.classes.forEach(c=>{ if(c.cls) sizes.add(classHitDie(c)); });
  if(sizes.size===0) return "";
  if(sizes.size===1) return `d${[...sizes][0]}`;
  return `(${hitDiceSummary()})`;
}

function primaryClass(){ return (state.classes[0] && state.classes[0].cls) || ""; }

function pointBuyTotal(abilities){ return ABILS.reduce((s,a)=> s + (POINT_BUY_COST[abilities[a]] ?? 0), 0); }

function skillEligibility(){
  const primCls = primaryClass();
  const primInfo = primCls ? CLASS_SKILLS[primCls] : null;
  const primList = primInfo ? (primInfo.list==="ALL" ? SKILLS.map(s=>s[0]) : primInfo.list) : null;
  let count = primInfo ? primInfo.count : 0;
  let combinedList = primList ? [...primList] : null;
  const sourceParts = primCls ? [primCls] : [];

  // Multiclassing rules also grant one bonus skill pick from Bard or Rogue when either is a
  // SECONDARY class (not your first) — separate from that class's own full starting list.
  state.classes.forEach((c,idx)=>{
    if(idx===0 || !c.cls) return;
    if(c.cls==="Bard"){
      count += 1;
      const bardAll = SKILLS.map(s=>s[0]);
      combinedList = combinedList ? Array.from(new Set([...combinedList, ...bardAll])) : bardAll;
      sourceParts.push("Bard multiclass");
    }
    if(c.cls==="Rogue"){
      count += 1;
      const rogueList = CLASS_SKILLS.Rogue.list;
      combinedList = combinedList ? Array.from(new Set([...combinedList, ...rogueList])) : [...rogueList];
      sourceParts.push("Rogue multiclass");
    }
  });

  const bgSkills = (state.background && BACKGROUNDS[state.background]) ? BACKGROUNDS[state.background].skills : [];

  // Skilled (a repeatable feat) grants 3 picks per time taken, each a skill OR a tool (2024 text).
  // Tool-typed picks are tracked in computeToolProficiencies() instead; only skill-typed picks (the
  // default, so older saves keep behaving as before) raise the skill budget here.
  let skilledSkillPicks = 0, skilledInstanceCount = 0;
  allChosenFeats().filter(f=>f.feat==="Skilled").forEach(f=>{
    skilledInstanceCount++;
    const c = f.choice||{};
    [1,2,3].forEach(i=>{ const t = c["pick"+i+"Type"]; if(!t || t==="skill") skilledSkillPicks++; });
  });
  if(skilledSkillPicks>0){
    count += skilledSkillPicks;
    const allSkills = SKILLS.map(s=>s[0]);
    combinedList = combinedList ? Array.from(new Set([...combinedList, ...allSkills])) : allSkills;
    sourceParts.push(`Skilled x${skilledInstanceCount} (${skilledSkillPicks} as skills)`);
  }

  // Feats that grant a free skill of your choice (Skill Expert): one pick each, from any list.
  const featSkillPicks = allChosenFeats().reduce((n,f)=> n + (FEATS[f.feat].grantsSkillPicks||0), 0);
  if(featSkillPicks>0){
    count += featSkillPicks;
    const allSkills = SKILLS.map(s=>s[0]);
    combinedList = combinedList ? Array.from(new Set([...combinedList, ...allSkills])) : allSkills;
    sourceParts.push(`Skill Expert${featSkillPicks>1?` x${featSkillPicks}`:""}`);
  }

  const classInfo = combinedList ? {count} : null;
  return {primCls, classInfo, classList:combinedList, bgSkills, sourceLabel: sourceParts.join(" + ")};
}

function renderAbilitiesCard(pb){
  const usedPoints = pointBuyTotal(state.abilities);
  const abilBoxes = ABILS.map(a=>{
    const base = state.abilities[a];
    const total = abilTotal(a);
    const bonus = total - base;
    return `
    <div class="ability-box" title="${escapeAttr(ABILITY_DESC[a] + (bonus?` (Base ${base} + ${fmt(bonus)} from race/ASI/equipment = ${total}.)`:""))}">
      <label>${a}</label>
      <div class="mod">${fmt(mod(total))}</div>
      <input type="number" min="8" max="15" data-abil="${a}" value="${base}">
      ${bonus?`<div class="small-label" style="margin-top:2px;">${total} total (${fmt(bonus)})</div>`:""}
    </div>`;
  }).join("");

  const elig = skillEligibility();

  const saves = ABILS.map(a=>{
    const prof = hasSaveProficiency(a);
    const classSaveList = elig.primCls==="Custom" ? ((state.classes[0] && state.classes[0].customSaves) || []) : (CLASS_SAVES[elig.primCls]||[]);
    const fromFeat = prof && !(elig.primCls && classSaveList.includes(a));
    const total = mod(abilTotal(a)) + (prof?pb:0);
    return `<div class="row" style="align-items:flex-start;">
      <span title="${fromFeat?"Granted by a feat (Resilient).":"Automatically updated — determined by your first class, not editable."}" style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-top:2px;border:1px solid var(--brass);border-radius:3px;background:${prof?'var(--brass)':'transparent'};color:#241f18;font-size:11px;flex-shrink:0;">${prof?"&#10003;":""}</span>
      <div class="name" style="display:flex;flex-direction:column;gap:1px;">
        <span>${ABIL_NAMES[a]} Save${fromFeat?' <span class="small-label">&middot; feat</span>':""}</span>
        <span class="small-label" style="font-weight:normal;">${SAVE_EXAMPLES[a]}</span>
      </div>
      <span class="mod" style="margin-top:2px;">${fmt(total)}</span>
    </div>`;
  }).join("");

  let classChosenCount = 0;
  if(elig.classList){
    classChosenCount = SKILLS.filter(([n])=> elig.classList.includes(n) && !elig.bgSkills.includes(n) && state.skillProf[n]).length;
  }
  const expLimit = expertiseLimit();
  // 2024 rules: Expertise applies only to skill proficiencies, never tools — see
  // showThievesToolsRow() for the confirmed source citation. Thieves' Tools no longer
  // consumes an Expertise pick here.
  const expUsed = SKILLS.filter(([n])=>state.skillExpertise[n]).length;

  const skills = SKILLS.map(([name,abil])=>{
    const key = name;
    const isBg = elig.bgSkills.includes(name);
    const effProf = effectGrantsSkill(key); // granted by a custom/homebrew toggleable feature
    const effExp = effectGrantsSkillExpertise(key);
    const prof = isSkillProficient(key);
    const exp = isSkillExpertise(key);
    const inClassList = !elig.classList || elig.classList.includes(name);
    const atCap = elig.classList && classChosenCount >= elig.classInfo.count;
    const disableProf = isBg || effProf || (elig.classList ? (!inClassList || (atCap && !prof)) : false);
    const expAtCap = expUsed >= expLimit && !exp;
    let total = mod(abilTotal(abil));
    if(exp) total += pb*2; else if(prof) total += pb;
    let profTitle = "Proficient — adds your proficiency bonus.";
    let sourceTag = "";
    if(isBg){ profTitle = "Automatically granted — from your background."; sourceTag = " &middot; background"; }
    else if(effProf){ profTitle = "Granted by an active custom toggleable feature (Classes & Features)."; sourceTag = " &middot; custom feature"; }
    else if(elig.classList && !inClassList){ profTitle = `Not on ${elig.sourceLabel}'s skill list or your background.`; sourceTag = " &middot; not eligible"; }
    else if(atCap && !prof){ profTitle = `You've used all ${elig.classInfo.count} skill choices ${elig.sourceLabel} grants.`; sourceTag = " &middot; picks used"; }
    let expTitle = "Expertise — doubles your proficiency bonus (requires proficiency).";
    if(effExp) expTitle = "Expertise granted by an active custom toggleable feature (Classes & Features).";
    else if(expLimit===0) expTitle = "No Expertise slots yet — unlocked by the Expertise class feature (e.g. Rogue, Bard).";
    else if(expAtCap) expTitle = `You've used all ${expLimit} Expertise picks currently unlocked.`;
    return `<div class="row" style="align-items:flex-start;">
      <input type="checkbox" class="check" style="margin-top:2px;" data-skillprof="${key}" ${prof?"checked":""} ${disableProf?"disabled":""} title="${escapeAttr(profTitle)}">
      <input type="checkbox" class="check" data-skillexp="${key}" ${exp?"checked":""} ${(!prof || expAtCap || effExp)?"disabled":""} title="${escapeAttr(expTitle)}" style="accent-color:var(--wine);margin-top:2px;">
      <div class="name" style="display:flex;flex-direction:column;gap:1px;">
        <span>${name} <span class="small-label">(${abil.toUpperCase()})</span><span class="small-label">${sourceTag}</span></span>
        <span class="small-label" style="font-weight:normal;">${SKILL_EXAMPLES[name]||""}</span>
      </div>
      <span class="mod" style="margin-top:2px;">${fmt(total)}</span>
    </div>`;
  }).join("");

  return `
    <div class="small-label" style="margin-bottom:4px;display:flex;align-items:center;">Point Buy — ${usedPoints} / ${POINT_BUY_BUDGET} points used<span class="help" title="Standard 5e point-buy: scores range 8-15 before racial bonuses, and the table costs more for higher scores (14=7pts, 15=9pts). Race, Ability Score Improvements, and equipment bonuses are added on top automatically and shown under each score. If your table uses rolled stats or the standard array instead, you can ignore this limit.">?</span></div>
    <div class="grid grid-6">${abilBoxes}</div>
    <div class="small-label" style="margin-top:2px;">Hover an ability box for what it governs and how it's used.</div>
    <hr class="divider">
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;display:flex;align-items:center;">Saving Throws${elig.primCls?` — from ${elig.primCls}`:""}<span class="help" title="Automatically updated: saving throw proficiencies come from your first class only, even if you multiclass, plus any granted by the Resilient feat. Choose a class above to set these — they can't be edited by hand.">?</span></div>
    <div class="small-label" style="margin-bottom:4px;">Hover the checkbox for why it's checked; examples shown below each save.</div>
    ${saves}
    <hr class="divider">
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;display:flex;align-items:center;">Skills${elig.classInfo?` — ${classChosenCount}/${elig.classInfo.count} ${elig.sourceLabel} choices`:""} &middot; Expertise ${expUsed}/${expLimit}<span class="help" title="Skill choices are limited to your class's list (or automatically granted by your background). Multiclassing into Bard or Rogue grants one bonus pick from that class's list. Expertise picks are limited to how many the Expertise feature has granted you so far (2 per grant — e.g. Rogue at levels 1 and 6).">?</span></div>
    <div class="small-label" style="margin-bottom:4px;">Hover a checkbox for why it's checked/locked; examples shown below each skill. "&middot; background" tags show what auto-granted the skill.</div>
    ${skills}
    ${showThievesToolsRow() ? (()=>{
      const abil = "dex";
      const total = mod(abilTotal(abil)) + pb;
      return `<hr class="divider">
      <div class="row" style="align-items:flex-start;">
        <span style="width:18px;"></span>
        <span style="width:18px;"></span>
        <div class="name" style="display:flex;flex-direction:column;gap:1px;">
          <span>Thieves' Tools <span class="small-label">(DEX)</span></span>
          <span class="small-label" style="font-weight:normal;">Tool proficiency — shown here for visibility. Expertise applies only to skills under 2024 rules, not tools.</span>
        </div>
        <span class="mod" style="margin-top:2px;">${fmt(total)}</span>
      </div>`;
    })() : ""}
  `;
}

function renderChoiceUI(cls,l,fname){
  const key = featureKey(cls,l,fname);
  if(SUBCLASS_SINGLE_CHOICE[fname]){
    const opts = SUBCLASS_SINGLE_CHOICE[fname];
    const choice = state.featureChoices[key] || {};
    return `<div style="margin-top:4px;">
      <select data-choice-key="${key}" data-choice-field="pick" style="width:auto;">
        <option value="">— choose —</option>
        ${Object.keys(opts).map(o=>`<option value="${o}" ${choice.pick===o?"selected":""}>${o}</option>`).join("")}
      </select>
      ${choice.pick ? `<div class="fdesc" style="margin-top:2px;">${opts[choice.pick]}</div>
        <select data-choice-key="${key}" data-choice-field="category" style="width:auto;margin-top:4px;" title="Where this should appear in the Quick Reference summary above.">
          <option value="combat" ${(!choice.category||choice.category==="combat")?"selected":""}>In Combat</option>
          <option value="exploration" ${choice.category==="exploration"?"selected":""}>Out of Combat</option>
          <option value="both" ${choice.category==="both"?"selected":""}>Both</option>
        </select>` : ""}
    </div>`;
  }
  if(fname==="Spellcasting" && (cls==="Fighter" || cls==="Rogue")){
    const fLvl = classLevelOf(cls);
    const limit = thirdCasterWildcardLimit(fLvl);
    if(limit<=0) return "";
    const wildcardKey = `class-agg:${cls}:ThirdCasterWildcards`;
    const selected = (state.featureChoices[wildcardKey] && state.featureChoices[wildcardKey].picks) || [];
    const maxLvl = maxCastableSpellLevel();
    const pool = SPELL_LIST.filter(sp=>sp.classes.includes("Wizard") && sp.lvl>0 && sp.lvl<=maxLvl).sort((a,b)=>a.lvl-b.lvl || a.name.localeCompare(b.name));
    const rows = pool.map(sp=>{
      const checked = selected.includes(sp.name);
      const disable = !checked && selected.length>=limit;
      return `<label style="display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0;">
        <input type="checkbox" class="check" data-multi-key="${wildcardKey}" data-multi-opt="${sp.name}" data-multi-limit="${limit}" ${checked?"checked":""} ${disable?"disabled":""}>
        <span>${sp.name} <span class="small-label">(Lv ${sp.lvl})</span></span>
      </label>`;
    }).join("");
    return `<div style="margin-top:6px;">
      <div class="small-label" style="margin-bottom:4px;">"Any school" picks (${selected.length}/${limit}) — your other spells must come from ${cls==="Fighter"?"Abjuration or Evocation":"Illusion or Enchantment"}, but the real rule gives you a few free picks from any Wizard school (gained at levels 3, 8, 14, and 20). Cantrips are never school-restricted, so they're not counted here.</div>
      ${rows || '<div class="small-label">No Wizard spells at your current castable level yet.</div>'}
    </div>`;
  }
  if(fname==="Ranger's Companion"){
    const comp = state.companion;
    const maxHP = companionMaxHP();
    const atkRows = (comp.attacks||[]).map((a,i)=>`
      <div class="attack-row" data-companion-atk-idx="${i}" style="grid-template-columns:1.4fr 0.7fr 1fr auto;margin-bottom:4px;">
        <input placeholder="Attack name (e.g. Bite)" data-companion-atk="name" value="${escapeAttr(a.name)}">
        <input placeholder="Bonus" data-companion-atk="bonus" value="${escapeAttr(a.bonus)}" title="Attack bonus — remember to include your proficiency bonus, since the companion is proficient with its own attacks.">
        <input placeholder="Damage (e.g. 1d6+2 piercing)" data-companion-atk="damage" value="${escapeAttr(a.damage)}">
        <button class="icon ghost small" data-remove-companion-atk="${i}">&times;</button>
      </div>`).join("");
    return `<div style="margin-top:6px;">
      <div class="small-label" style="margin-bottom:4px;">Fill in your companion's real stats from its stat block (Monster Manual/SRD beast of your choice) — the sheet tracks its current state and levels its HP with you. Remember: your companion adds <strong>your</strong> proficiency bonus to its attack rolls, damage (if applicable), AC, and any saving throw or skill it's already proficient in.</div>
      <div class="grid grid-3" style="margin-bottom:6px;">
        <div>${lbl("Name","Your companion's name.")}<input data-companion="name" value="${escapeAttr(comp.name)}"></div>
        <div>${lbl("Species","What kind of beast — Wolf, Panther, Giant Owl, etc.")}<input data-companion="species" value="${escapeAttr(comp.species)}"></div>
        <div>${lbl("AC","From its stat block, plus your proficiency bonus.")}<input type="number" data-companion="ac" value="${escapeAttr(comp.ac)}"></div>
      </div>
      <div class="grid grid-3" style="margin-bottom:6px;">
        <div>${lbl("Speed (ft)","From its stat block.")}<input type="number" data-companion="speed" value="${escapeAttr(comp.speed)}"></div>
        <div>${lbl("Book Max HP","Its normal hit point maximum from its stat block.")}<input type="number" data-companion="baseHP" value="${escapeAttr(comp.baseHP)}"></div>
        <div>${lbl("Effective Max HP","Whichever is higher: its book max, or 4× your Ranger level. Calculated automatically.")}<input type="number" value="${maxHP}" disabled style="opacity:.8;"></div>
      </div>
      <div class="grid grid-2" style="margin-bottom:6px;">
        <div>${lbl("Current HP","Adjust as your companion takes damage or heals.")}<input type="number" data-companion="currentHP" value="${escapeAttr(comp.currentHP)}"></div>
        <div>${lbl("Temp HP","Any temporary hit points your companion currently has.")}<input type="number" data-companion="tempHP" value="${escapeAttr(comp.tempHP)}"></div>
      </div>
      <div class="small-label" style="margin-bottom:4px;">Attacks</div>
      ${atkRows || '<div class="small-label" style="margin-bottom:6px;">No attacks added yet.</div>'}
      <button class="ghost small" id="btn-add-companion-atk">+ Add companion attack</button>
      <select data-companion="category" style="width:auto;margin-top:8px;display:block;" title="Where your companion should appear in the Quick Reference summary above.">
        <option value="combat" ${(!comp.category||comp.category==="combat")?"selected":""}>In Combat</option>
        <option value="exploration" ${comp.category==="exploration"?"selected":""}>Out of Combat</option>
        <option value="both" ${comp.category==="both"?"selected":""}>Both</option>
      </select>
      <div class="small-label" style="margin-top:8px;">
        <strong>Lv 7 — Exceptional Training:</strong> your companion can Dash, Disengage, or Help without you using your action.<br>
        <strong>Lv 11 — Bestial Fury:</strong> your companion can make two attacks when you command it to attack.<br>
        <strong>Lv 15 — Share Spells:</strong> your companion benefits when you cast a spell on yourself (if within 30 ft).
      </div>
    </div>`;
  }
  if(fname==="Second Wind"){
    const fLvl = classLevelOf(cls);
    return `<div class="fdesc" style="margin-top:2px;"><strong>Roll: 1d10 + ${fLvl}</strong> (your Fighter level) HP recovered.</div>`;
  }
  if(fname==="Sneak Attack"){
    const rLvl = classLevelOf(cls);
    const dice = sneakAttackDice(rLvl);
    return `<div class="fdesc" style="margin-top:2px;"><strong>Currently: ${dice}d6</strong> extra damage, once per turn.</div>`;
  }
  if(fname==="Martial Arts"){
    const mLvl = classLevelOf(cls);
    return `<div class="fdesc" style="margin-top:2px;"><strong>Currently: d${martialArtsDie(mLvl)}</strong> for your Martial Arts die (unarmed strikes and monk weapons).</div>`;
  }
  if(fname==="Bardic Inspiration"){
    const bLvl = classLevelOf(cls);
    return `<div class="fdesc" style="margin-top:2px;"><strong>Currently: d${bardicInspirationDie(bLvl)}</strong> Bardic Inspiration die.</div>`;
  }
  if(fname==="Rage" && cls==="Barbarian"){
    const barbLvl = classLevelOf(cls);
    return `<div class="fdesc" style="margin-top:2px;"><strong>Currently: +${rageDamageBonus(barbLvl)}</strong> damage on Strength-based melee weapon attacks while raging.</div>`;
  }
  if(fname==="Lay on Hands"){
    const pLvl = classLevelOf(cls);
    return `<div class="fdesc" style="margin-top:2px;"><strong>Pool: ${pLvl*5} HP</strong> (5 × your Paladin level), refills on a long rest — spend 5 from it to also cure one disease or neutralize one poison instead of healing.</div>`;
  }
  if(fname==="Brutal Strike" || fname==="Improved Brutal Strike"){
    const barbLvl = classLevelOf(cls);
    const n = brutalStrikeDice(barbLvl);
    return `<div class="fdesc" style="margin-top:2px;"><strong>Currently: +${n}d10 extra damage</strong> plus a rider effect, in place of one Reckless Attack's advantage.</div>`;
  }
  if(fname==="Wholeness of Body"){
    const mLvl = classLevelOf(cls);
    return `<div class="fdesc" style="margin-top:2px;"><strong>Currently: ${mLvl*3} HP</strong> self-healed (3 × your monk level), once per long rest.</div>`;
  }
  if(fname==="Channel Divinity: Preserve Life"){
    const cLvl = classLevelOf(cls);
    return `<div class="fdesc" style="margin-top:2px;"><strong>Pool: ${cLvl*5} HP</strong> (5 × your Cleric level) to split among nearby creatures.</div>`;
  }
  if(fname==="Channel Divinity: Radiance of the Dawn"){
    const cLvl = classLevelOf(cls);
    return `<div class="fdesc" style="margin-top:2px;"><strong>Currently: 2d10 + ${cLvl}</strong> radiant damage (half on a successful Con save).</div>`;
  }
  if(fname==="Monk's Focus"){
    const monkLvl = classLevelOf(cls);
    const count = kiPointCount(monkLvl);
    const used = state.kiUsed||0;
    let boxes = "";
    for(let i=0;i<count;i++){ boxes += `<span class="slot-box ${i<used?'used':''}" data-ki-point="${i}"></span>`; }
    const kiChoice = state.featureChoices[key] || {};
    return `<div style="margin-top:6px;">
      <div class="small-label">Spent on Flurry of Blows, Patient Defense, or Step of the Wind (1 Focus Point each) — click a point to mark it used; they all restore on a short or long rest.</div>
      <div class="slots-row">${boxes}</div>
      <select data-choice-key="${key}" data-choice-field="category" style="width:auto;margin-top:6px;" title="Where this should appear in the Quick Reference summary above.">
        <option value="combat" ${(!kiChoice.category||kiChoice.category==="combat")?"selected":""}>In Combat</option>
        <option value="exploration" ${kiChoice.category==="exploration"?"selected":""}>Out of Combat</option>
        <option value="both" ${kiChoice.category==="both"?"selected":""}>Both</option>
      </select>
    </div>`;
  }
  if(fname==="Combat Superiority"){
    const fLvl = classLevelOf(cls);
    const maneuverKey = `class-agg:${cls}:BattleMasterManeuvers`;
    const limit = maneuversKnownCount(fLvl);
    const selected = (state.featureChoices[maneuverKey] && state.featureChoices[maneuverKey].picks) || [];
    const rows = Object.keys(BATTLE_MASTER_MANEUVERS).map(opt=>{
      const checked = selected.includes(opt);
      const disable = !checked && selected.length>=limit;
      return `<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin:3px 0;">
        <input type="checkbox" class="check" data-multi-key="${maneuverKey}" data-multi-opt="${opt}" data-multi-limit="${limit}" ${checked?"checked":""} ${disable?"disabled":""}>
        <span><strong>${opt}</strong> — ${BATTLE_MASTER_MANEUVERS[opt]}</span>
      </label>`;
    }).join("");
    const dice = superiorityDiceInfo(fLvl);
    const used = state.superiorityDiceUsed||0;
    let boxes = "";
    for(let i=0;i<dice.count;i++){ boxes += `<span class="slot-box ${i<used?'used':''}" data-superiority-die="${i}"></span>`; }
    const bmChoice = state.featureChoices[key] || {};
    return `<div style="margin-top:6px;">
      <div class="small-label">Maneuvers known (${selected.length}/${limit}):</div>
      ${rows}
      <div class="small-label" style="margin-top:6px;">Superiority Dice (d${dice.die}) — click a box to mark it used; they all restore on a short or long rest:</div>
      <div class="slots-row">${boxes}</div>
      <select data-choice-key="${key}" data-choice-field="category" style="width:auto;margin-top:6px;" title="Where this should appear in the Quick Reference summary above.">
        <option value="combat" ${(!bmChoice.category||bmChoice.category==="combat")?"selected":""}>In Combat</option>
        <option value="exploration" ${bmChoice.category==="exploration"?"selected":""}>Out of Combat</option>
        <option value="both" ${bmChoice.category==="both"?"selected":""}>Both</option>
      </select>
    </div>`;
  }
  if(fname==="Magical Discoveries"){
    const maxLvl = maxCastableSpellLevel();
    const choice = state.featureChoices[key] || {spell1:"",spell2:""};
    const opts = SPELL_LIST.filter(sp=>sp.lvl<=maxLvl && (sp.classes.includes("Cleric")||sp.classes.includes("Druid")||sp.classes.includes("Wizard"))).sort((a,b)=> a.lvl-b.lvl || a.name.localeCompare(b.name));
    const buildSelect = (field, otherVal) => `<select data-choice-key="${key}" data-choice-field="${field}" style="width:auto;margin-bottom:4px;display:block;">
      <option value="">— choose a spell —</option>
      ${opts.map(sp=>`<option value="${sp.name}" ${choice[field]===sp.name?"selected":""} ${sp.name===otherVal?"disabled":""}>${sp.name} (${sp.lvl===0?"Cantrip":"Lv "+sp.lvl})</option>`).join("")}
    </select>`;
    return `<div style="margin-top:4px;">
      <div class="small-label" style="margin-bottom:4px;">Pick 2 spells from the Cleric, Druid, or Wizard list, of a level you can currently cast:</div>
      ${buildSelect("spell1", choice.spell2)}
      ${buildSelect("spell2", choice.spell1)}
    </div>`;
  }
  if(fname==="Mystic Arcanum"){
    const arcLvl = MYSTIC_ARCANUM_LEVEL_MAP[l];
    if(!arcLvl) return "";
    const options = SPELL_LIST.filter(sp=>sp.lvl===arcLvl && sp.classes.includes("Warlock"));
    const entry = (state.mysticArcanum && state.mysticArcanum[arcLvl]) || {spell:"",used:false,category:"combat"};
    return `<div style="margin-top:4px;">
      <select data-arcanum-level="${arcLvl}" style="width:auto;">
        <option value="">— choose your level ${arcLvl} spell —</option>
        ${options.map(sp=>`<option value="${sp.name}" ${entry.spell===sp.name?"selected":""}>${sp.name}</option>`).join("")}
      </select>
      ${entry.spell ? `
        <div class="fdesc" style="margin-top:2px;">${(SPELL_LIST.find(sp=>sp.name===entry.spell)||{}).desc||""}</div>
        <label style="display:flex;align-items:center;gap:6px;font-size:11px;margin-top:4px;width:auto;" title="Mark this used for today — Mystic Arcanum resets on a Long Rest.">
          <input type="checkbox" class="check" data-arcanum-used="${arcLvl}" ${entry.used?"checked":""}> Used today
        </label>
        <select data-arcanum-category="${arcLvl}" style="width:auto;margin-top:4px;" title="Where this should appear in the Quick Reference summary above.">
          <option value="combat" ${(!entry.category||entry.category==="combat")?"selected":""}>In Combat</option>
          <option value="exploration" ${entry.category==="exploration"?"selected":""}>Out of Combat</option>
          <option value="both" ${entry.category==="both"?"selected":""}>Both</option>
        </select>` : ""}
    </div>`;
  }
  if(fname==="Fighting Style" || fname==="Additional Fighting Style"){
    const choice = state.featureChoices[key] || {};
    // A style can only be held once, whichever source gave it (class feature, Champion's second
    // style, or a Fighting Style feat) — so hide styles other sources already hold, but always
    // keep this picker's own current pick visible. Blessed/Druidic Warrior only show for their class.
    const takenElsewhere = new Set(fightingStyleSources().filter(x=>x.key!==key).map(x=>x.style));
    const opts = Object.keys(FIGHTING_STYLE_OPTIONS).filter(o=>{
      const only = FIGHTING_STYLE_CLASS_ONLY[o];
      if(only && only!==cls && o!==choice.style) return false;
      return o===choice.style || !takenElsewhere.has(o);
    });
    return `<div style="margin-top:4px;">
      <select data-choice-key="${key}" data-choice-field="style" style="width:auto;display:inline-block;">
        <option value="">— choose a style —</option>
        ${opts.map(o=>`<option value="${o}" ${choice.style===o?"selected":""}>${o}</option>`).join("")}
      </select>
      ${choice.style?`<div class="fdesc" style="margin-top:2px;">${FIGHTING_STYLE_OPTIONS[choice.style]}</div>`:""}
      ${fname==="Additional Fighting Style"?`<div class="small-label" style="margin-top:2px;">Must differ from any other Fighting Style you have — those are already excluded above.</div>`:""}
    </div>`;
  }
  if(fname==="Ability Score Improvement" || fname==="Epic Boon"){
    // Both slots follow the same rule text: "the Ability Score Improvement feat / an Epic Boon feat OR
    // another feat of your choice for which you qualify" — so both offer +2, +1/+1, or any feat you
    // qualify for. The Epic Boon slot just defaults to taking a feat, and the 30 cap applies only to the
    // ability increase from an Epic Boon feat itself (a plain ASI stays capped at 20).
    const isEpicSlot = fname==="Epic Boon";
    const choice = Object.assign({mode:isEpicSlot?"feat":"",a1:"",a2:"",feat:"",category:"both"}, state.featureChoices[key]||{});
    // An ability can't be pushed above the 20 cap using Ability Score Improvement — but the exact
    // increment matters: +2 to one ability excludes anything at 19 or higher (19+2=21, over cap),
    // while +1 to two abilities only excludes anything already at 20 (19+1=20 is still fine).
    // Magic items and other modifiers are a separate mechanism and are never capped this way — see
    // totalBonus()/equipmentBonus(), neither of which clamps its result.
    // The currently-selected value always stays visible even if it's now over the limit for its
    // own increment, so an existing choice never silently disappears from its own dropdown.
    const abilOpts = (sel, increment)=> ABILS.filter(a=>a===sel || abilTotal(a)+increment<=20).map(a=>`<option value="${a}" ${sel===a?"selected":""}>${ABIL_NAMES[a]}${abilTotal(a)+increment>20?` (would exceed 20 cap)`:""}</option>`).join("");
    let extra = `<select data-choice-key="${key}" data-choice-field="mode" style="width:auto;display:inline-block;margin-right:6px;">
      <option value="">— choose —</option>
      <option value="plus2" ${choice.mode==="plus2"?"selected":""}>+2 to one ability</option>
      <option value="plus1" ${choice.mode==="plus1"?"selected":""}>+1 to two abilities</option>
      <option value="feat" ${choice.mode==="feat"?"selected":""}>Take a Feat</option>
    </select>`;
    if(choice.mode==="plus2"){
      extra += `<select data-choice-key="${key}" data-choice-field="a1" style="width:auto;display:inline-block;">
        <option value="">— ability —</option>${abilOpts(choice.a1, 2)}
      </select>`;
    } else if(choice.mode==="plus1"){
      extra += `<select data-choice-key="${key}" data-choice-field="a1" style="width:auto;display:inline-block;margin-right:6px;">
        <option value="">— ability 1 —</option>${abilOpts(choice.a1, 1)}
      </select>
      <select data-choice-key="${key}" data-choice-field="a2" style="width:auto;display:inline-block;">
        <option value="">— ability 2 —</option>${abilOpts(choice.a2, 1)}
      </select>`;
    } else if(choice.mode==="feat"){
      // A feat already taken at an earlier ASI can't be taken again UNLESS it's one of the few
      // marked repeatable (Elemental Adept, Magic Initiate, Skilled) — none of the other feats have
      // "you can take this feat more than once" language. For a repeatable feat with a fixed list
      // of sub-choices (a damage type, a spell list), it drops out entirely once every option in
      // that list has been used by some other instance. The currently-selected feat for this
      // instance always stays visible even so, so an existing choice never vanishes from its own
      // dropdown. Epic Boons are listed like any other feat but their Level 19+ prerequisite keeps
      // them out of sight until then. A Fighting Style feat is excluded if that same style was already granted for
      // free by the class's own Fighting Style feature (no double-dipping the same style).
      const otherInstances = allChosenFeats().filter(f=>f.key!==key);
      const otherChosenFeats = new Set(otherInstances.map(f=>f.feat));
      const grantedStyles = new Set(fightingStyleChoice());
      const isMaxedOut = (fk)=>{
        const def = FEATS[fk];
        if(def.tier==="fightingStyle" && grantedStyles.has(def.styleName)) return true;
        if(!def.repeatable) return otherChosenFeats.has(fk);
        // Resilient has no fixed repeatChoices list (its "which ability" picker is the shared
        // half-feat featAbility dropdown, not a repeatField) — it's maxed out once every ability
        // already has saving throw proficiency, since there'd be nothing left for another pick
        // to grant.
        if(fk==="Resilient") return ABILS.every(a=>hasSaveProficiency(a));
        if(!def.repeatChoices) return false; // e.g. Skilled — no fixed list, never maxed out here
        const usedChoices = new Set(otherInstances.filter(f=>f.feat===fk).map(f=>f.choice[def.repeatField]).filter(Boolean));
        return def.repeatChoices.every(c=>usedChoices.has(c));
      };
      const featOpts = Object.keys(FEATS).sort().filter(fk=>fk===choice.feat || (!isMaxedOut(fk) && checkFeatPrereq(fk).ok)).map(fk=>{
        const def = FEATS[fk];
        // Every Origin feat is a legal pick at an ASI slot ("another feat you qualify for") — tag them so
        // they're recognisable as the background-style feats.
        const tag = def.tier==="origin" ? " (Origin)" : "";
        return `<option value="${fk}" ${choice.feat===fk?"selected":""}>${fk}${tag}</option>`;
      }).join("");
      extra += `<div style="margin-top:4px;">
        <select data-choice-key="${key}" data-choice-field="feat" style="width:auto;display:inline-block;">
          <option value="">— choose a feat —</option>
          ${featOpts}
        </select>`;
      if(choice.feat && FEATS[choice.feat]){
        const check = checkFeatPrereq(choice.feat);
        const def = FEATS[choice.feat];
        const featCap = def.tier==="epic" ? 30 : 20; // only an Epic Boon's +1 may exceed 20
        extra += `<div class="fdesc" style="margin-top:2px;">${def.desc}</div>
          <div class="small-label" style="margin-top:2px;color:${check.ok?'inherit':'var(--wine)'};">${check.text}</div>`;
        if(def.repeatable && def.repeatChoices){
          const usedElsewhere = new Set(otherInstances.filter(f=>f.feat===choice.feat).map(f=>f.choice[def.repeatField]).filter(Boolean));
          extra += `<div style="margin-top:4px;">
            ${lbl(`Which ${def.repeatLabel}?`,`Each time you take ${choice.feat}, it must be a different ${def.repeatLabel} than one you already have.`)}
            <select data-choice-key="${key}" data-choice-field="${def.repeatField}" style="width:auto;">
              <option value="">— choose —</option>
              ${def.repeatChoices.filter(c=>c===choice[def.repeatField] || !usedElsewhere.has(c)).map(c=>`<option value="${c}" ${choice[def.repeatField]===c?"selected":""}>${c}</option>`).join("")}
            </select>
          </div>`;
        }
        if(choice.feat==="Magic Initiate" && choice.list){
          const miChoice = choice;
          const cantripOpts = SPELL_LIST.filter(sp=>sp.lvl===0 && sp.classes.includes(miChoice.list)).sort((a,b)=>a.name.localeCompare(b.name));
          const spellOpts = SPELL_LIST.filter(sp=>sp.lvl===1 && sp.classes.includes(miChoice.list)).sort((a,b)=>a.name.localeCompare(b.name));
          const buildSelect = (field, opts, otherVal, placeholder) => `<select data-choice-key="${key}" data-choice-field="${field}" style="width:auto;margin-bottom:4px;display:block;">
            <option value="">${placeholder}</option>
            ${opts.map(sp=>`<option value="${sp.name}" ${miChoice[field]===sp.name?"selected":""} ${sp.name===otherVal?"disabled":""}>${sp.name}</option>`).join("")}
          </select>`;
          extra += `<div style="margin-top:6px;">
            ${lbl("Spellcasting Ability","Choose Intelligence, Wisdom, or Charisma to use for these spells.")}
            <select data-choice-key="${key}" data-choice-field="miAbility" style="width:auto;">
              <option value="">— choose —</option>
              ${["int","wis","cha"].map(a=>`<option value="${a}" ${miChoice.miAbility===a?"selected":""}>${ABIL_NAMES[a]}</option>`).join("")}
            </select>
          </div>
          <div style="margin-top:6px;">
            <div class="small-label" style="margin-bottom:4px;">Two cantrips from the ${miChoice.list} list:</div>
            ${buildSelect("cantrip1", cantripOpts, miChoice.cantrip2, "— cantrip 1 —")}
            ${buildSelect("cantrip2", cantripOpts, miChoice.cantrip1, "— cantrip 2 —")}
            <div class="small-label" style="margin-bottom:4px;">One 1st-level spell from the ${miChoice.list} list (always prepared; cast once free per long rest):</div>
            ${buildSelect("miSpell", spellOpts, null, "— 1st-level spell —")}
          </div>`;
        }
        if(FEAT_SCHOOL_PICK[choice.feat] || choice.feat==="Ritual Caster") extra += featSpellPickerHtml(choice, key);
        if(def.abilityBoost && def.abilityBoost.length>1){
          // Resilient additionally excludes any ability that already has saving throw
          // proficiency (from your class, or a previous Resilient pick) — the ability you
          // choose gets both the +1 AND save proficiency in one choice, so an ability that's
          // already covered has nothing left for another Resilient pick to grant it.
          const isResilient = choice.feat==="Resilient";
          const abilOptsFiltered = def.abilityBoost.filter(a=>
            a===choice.featAbility || (abilTotal(a)+1<=featCap && (!isResilient || !hasSaveProficiency(a)))
          );
          extra += `<div style="margin-top:4px;">
            ${lbl(isResilient?"Which ability gets +1 and save proficiency?":"Which ability gets +1?", isResilient?"Grants both a +1 to this ability and proficiency in its saving throw — the same single choice covers both. Abilities that already have save proficiency aren't offered, since there'd be nothing left for another pick to add.":`This feat lets you choose which ability score its +1 applies to (maximum ${featCap}).`)}
            <select data-choice-key="${key}" data-choice-field="featAbility" style="width:auto;">
              <option value="">— choose —</option>
              ${abilOptsFiltered.map(a=>`<option value="${a}" ${choice.featAbility===a?"selected":""}>${ABIL_NAMES[a]}${abilTotal(a)+1>featCap?` (would exceed ${featCap} cap)`:""}</option>`).join("")}
            </select>
          </div>`;
        } else if(def.abilityBoost && def.abilityBoost.length===1){
          const singleAbil = def.abilityBoost[0];
          const atCap = abilTotal(singleAbil)+1 > featCap;
          extra += atCap
            ? `<div class="small-label" style="margin-top:2px;color:var(--wine);">${ABIL_NAMES[singleAbil]} has already reached its ${featCap} cap — the ability point won't be added since the cap has already been met. You can still take this feat for its other benefits.</div>`
            : `<div class="small-label" style="margin-top:2px;">+1 ${ABIL_NAMES[singleAbil]}${featCap===30?", up to 30":""} (applied automatically).</div>`;
        }
        extra += `<select data-choice-key="${key}" data-choice-field="category" style="width:auto;margin-top:4px;" title="Where this feat should appear in the Quick Reference summary above.">
            <option value="combat" ${choice.category==="combat"?"selected":""}>In Combat</option>
            <option value="exploration" ${choice.category==="exploration"?"selected":""}>Out of Combat</option>
            <option value="both" ${(!choice.category||choice.category==="both")?"selected":""}>Both</option>
          </select>`;
      }
      extra += `</div>`;
    }
    return `<div style="margin-top:4px;">${extra}</div>`;
  }
  if(fname==="Metamagic"){
    if(!isHighestOccurrence(cls,fname,l)) return `<div class="fdesc" style="margin-top:2px;font-style:italic;">Your Metamagic options expand further at a higher level — see that entry below for the full picker.</div>`;
    const mmKey = `class-agg:${cls}:Metamagic`;
    const count = metamagicCount(classLevelOf(cls));
    const selected = (state.featureChoices[mmKey] && state.featureChoices[mmKey].picks) || [];
    const rows = Object.keys(METAMAGIC_OPTIONS).map(opt=>{
      const checked = selected.includes(opt);
      const disable = !checked && selected.length>=count;
      return `<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin:3px 0;">
        <input type="checkbox" class="check" data-multi-key="${mmKey}" data-multi-opt="${opt}" data-multi-limit="${count}" ${checked?"checked":""} ${disable?"disabled":""}>
        <span><strong>${opt}</strong> — ${METAMAGIC_OPTIONS[opt]}</span>
      </label>`;
    }).join("");
    return `<div style="margin-top:6px;"><div class="small-label">Choose ${count} (currently ${selected.length}/${count}):</div>${rows}</div>`;
  }
  if(fname==="Eldritch Invocations"){
    const eiKey = `class-agg:${cls}:EldritchInvocations`;
    const count = invocationsKnown(classLevelOf(cls));
    const selected = (state.featureChoices[eiKey] && state.featureChoices[eiKey].picks) || [];
    const rows = Object.keys(ELDRITCH_INVOCATION_OPTIONS).map(opt=>{
      const checked = selected.includes(opt);
      const disable = !checked && selected.length>=count;
      return `<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin:3px 0;">
        <input type="checkbox" class="check" data-multi-key="${eiKey}" data-multi-opt="${opt}" data-multi-limit="${count}" ${checked?"checked":""} ${disable?"disabled":""}>
        <span><strong>${opt}</strong> — ${ELDRITCH_INVOCATION_OPTIONS[opt]}</span>
      </label>`;
    }).join("");
    return `<div style="margin-top:6px;"><div class="small-label">Choose ${count} (currently ${selected.length}/${count}) — prerequisites aren't checked here, use your judgment:</div>${rows}</div>`;
  }
  if(fname==="Expertise"){
    return `<div class="fdesc" style="margin-top:2px;font-style:italic;">Pick which skills get Expertise in the Skills list in Abilities, Saves &amp; Skills above.</div>`;
  }
  if(SUBCLASS_FEATURE_NAMES.has(fname)){
    return `<div class="fdesc" style="margin-top:2px;font-style:italic;">Pick your subclass in the dropdown above — it'll be noted next to every feature it grants.</div>`;
  }
  // Flat subclass feature with no picker of its own: offer just the Quick Reference bucket.
  {
    const subName = (state.classes.find(c=>c.cls===cls)||{}).subclass;
    const subDef = subName && SUBCLASS_FEATURES[subName] && SUBCLASS_FEATURES[subName].find(f=>f.lvl===l && f.name===fname);
    if(subDef && !subclassFeatureExcludedFromQR(subDef)){
      const cat = subclassFeatureScenario(cls, subDef);
      return `<div style="margin-top:4px;">
