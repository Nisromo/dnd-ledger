function wireCampaignPageEvents(){
  const backBtn = document.getElementById("btn-campaign-nav-back");
  if(backBtn) backBtn.addEventListener("click", goToSheet);
  const hubBtn = document.getElementById("btn-campaign-back-to-hub");
  if(hubBtn) hubBtn.addEventListener("click", goToCampaignHub);

  // Shared by the hub's, detail's, and join's identical "you need an account" fallback
  // (campaignSignInPrompt()), so the same two ids cover sign-in from any of the three sub-pages.
  const signupBtn = document.getElementById("btn-campaign-signup");
  if(signupBtn) signupBtn.addEventListener("click", ()=>{ authModalMode="signup"; authModalError=""; renderAuthModal(); });
  const loginBtn = document.getElementById("btn-campaign-login");
  if(loginBtn) loginBtn.addEventListener("click", ()=>{ authModalMode="login"; authModalError=""; renderAuthModal(); });

  // Hub
  document.querySelectorAll("[data-open-campaign]").forEach(el=>{
    el.addEventListener("click", ()=>goToCampaignDetail(el.getAttribute("data-open-campaign")));
  });
  const newCampaignBtn = document.getElementById("btn-new-campaign");
  if(newCampaignBtn) newCampaignBtn.addEventListener("click", ()=>{ showNewCampaignModal=true; newCampaignNameDraft=""; renderPreserveScroll(); });
  const cancelNewCampaignBtn = document.getElementById("btn-cancel-new-campaign");
  if(cancelNewCampaignBtn) cancelNewCampaignBtn.addEventListener("click", ()=>{ showNewCampaignModal=false; renderPreserveScroll(); });
  const createCampaignBtn = document.getElementById("btn-create-campaign");
  if(createCampaignBtn) createCampaignBtn.addEventListener("click", ()=>{
    newCampaignNameDraft = (document.getElementById("new-campaign-name")||{}).value || "";
    createCampaign();
  });
  const newCampaignNameInput = document.getElementById("new-campaign-name");
  if(newCampaignNameInput) newCampaignNameInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") document.getElementById("btn-create-campaign").click(); });

  // Detail
  if(campaignDetailData){
    const { campaign, isDm } = campaignDetailData;
    const modeSelect = document.getElementById("campaign-level-up-mode");
    if(modeSelect) modeSelect.addEventListener("change", ()=>updateLevelUpMode(campaign.id, modeSelect.value));
    const restControlToggle = document.getElementById("campaign-dm-rest-control");
    if(restControlToggle) restControlToggle.addEventListener("change", ()=>updateDmRestControl(campaign.id, restControlToggle.checked));
    const copyLinkBtn = document.getElementById("btn-copy-invite-link");
    if(copyLinkBtn) copyLinkBtn.addEventListener("click", ()=>copyInviteLink(campaign.id));
    document.querySelectorAll("[data-grant-levelup]").forEach(el=>{
      el.addEventListener("click", ()=>toggleMemberLevelUp(campaign.id, el.getAttribute("data-grant-levelup"), el.getAttribute("data-value")==="true"));
    });
    document.querySelectorAll("[data-trigger-rest]").forEach(el=>{
      el.addEventListener("click", ()=>triggerRemoteRest(campaign.id, el.getAttribute("data-trigger-rest"), el.getAttribute("data-rest-kind")));
    });
    document.querySelectorAll("[data-link-character-select]").forEach(el=>{
      el.addEventListener("change", ()=>linkCharacterToCampaign(el.getAttribute("data-link-character-select"), el.value));
    });
    const addNoteBtn = document.getElementById("btn-add-note");
    if(addNoteBtn) addNoteBtn.addEventListener("click", ()=>{
      noteModalState = { id:null, title:"", body:"", visibility:"dm_only", visibleTo:[] };
      campaignNoteError = "";
      renderPreserveScroll();
    });
    document.querySelectorAll("[data-edit-note]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const id = el.getAttribute("data-edit-note");
        const n = campaignDetailData.notes.find(x=>x.id===id);
        if(!n) return;
        noteModalState = { id:n.id, title:n.title, body:n.body, visibility:n.visibility, visibleTo:(n.visible_to_user_ids||[]).slice() };
        campaignNoteError = "";
        renderPreserveScroll();
      });
    });
    document.querySelectorAll("[data-delete-note]").forEach(el=>{
      el.addEventListener("click", ()=>deleteNote(campaign.id, el.getAttribute("data-delete-note")));
    });
    // Keep noteModalState in sync with every keystroke/change, not just at Save time — without
    // this, any re-render while the modal is open (the DM's live roll log updating in the
    // background, say, or the "give it a title" validation error re-rendering the same modal)
    // rebuilds the title/body/visibility fields from the stale state they had when the modal
    // first opened, silently erasing whatever had been typed since.
    const noteTitleInput = document.getElementById("note-title-input");
    if(noteTitleInput) noteTitleInput.addEventListener("input", ()=>{ noteModalState.title = noteTitleInput.value; });
    const noteBodyInput = document.getElementById("note-body-input");
    if(noteBodyInput) noteBodyInput.addEventListener("input", ()=>{ noteModalState.body = noteBodyInput.value; });
    document.querySelectorAll(".note-visible-to").forEach(cb=>{
      cb.addEventListener("change", ()=>{
        const v = cb.value;
        if(cb.checked){ if(!noteModalState.visibleTo.includes(v)) noteModalState.visibleTo.push(v); }
        else { noteModalState.visibleTo = noteModalState.visibleTo.filter(x=>x!==v); }
      });
    });
    const visSelect = document.getElementById("note-visibility-select");
    if(visSelect) visSelect.addEventListener("change", ()=>{
      noteModalState.visibility = visSelect.value;
      const panel = document.getElementById("note-specific-players");
      if(panel) panel.style.display = (visSelect.value==="specific") ? "" : "none";
    });
    const saveNoteBtn = document.getElementById("btn-save-note");
    if(saveNoteBtn) saveNoteBtn.addEventListener("click", ()=>saveNote(campaign.id));
    const cancelNoteBtn = document.getElementById("btn-cancel-note");
    if(cancelNoteBtn) cancelNoteBtn.addEventListener("click", ()=>{ noteModalState=null; renderPreserveScroll(); });
  }

  // Join
  const confirmJoinBtn = document.getElementById("btn-confirm-join");
  if(confirmJoinBtn && campaignRoute && campaignRoute.mode==="join") confirmJoinBtn.addEventListener("click", ()=>{
    const sel = document.getElementById("join-character-select");
    acceptInvite(campaignRoute.code, sel ? sel.value : "");
  });

  const dismissToastBtn2 = document.getElementById("btn-dismiss-toast");
  if(dismissToastBtn2) dismissToastBtn2.addEventListener("click", ()=>{ toastMessage=null; clearTimeout(toastTimer); renderPreserveScroll(); });
}

// Offers a generated file to the viewer via the platform's downloads capability (a published
// page can't trigger a browser download directly — it has to ask through this). Falls back to
// the classic anchor-click technique if the capability isn't available in this view.
async function saveFile(filename, data){
  try{
    if(window.claude && window.claude.use){
      const downloads = await window.claude.use("downloads");
      if(downloads){
        try{
          await downloads.save({filename, data});
          return true;
        }catch(err){
          if(err && err.code === "declined") return false;
          console.warn("downloads.save failed, falling back", err);
        }
      }
    }
  }catch(e){ console.warn("downloads capability unavailable", e); }
  try{
    const blob = data instanceof Blob ? data : new Blob([data], {type:"text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return true;
  }catch(e){
    showToast("Couldn't save the file — try again.");
    return false;
  }
}

/* ===================== HELPERS ===================== */

function hexToRgb(hex){
  hex = hex.replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex,16);
  return [(num>>16)&255, (num>>8)&255, num&255];
}
function shade(hex, amt){
  // amt negative darkens toward black, positive lightens toward white (range -1..1)
  const [r,g,b] = hexToRgb(hex);
  const t = amt<0 ? 0 : 255, p = Math.abs(amt);
  const mix = (c)=> Math.max(0,Math.min(255,Math.round(c+(t-c)*p)));
  return "#"+[mix(r),mix(g),mix(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function rgba(hex, alpha){
  const [r,g,b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

function currentThemeKey(){
  return (state.themeMode && THEMES[state.themeMode]) ? state.themeMode : "default";
}

function applyTheme(){
  const t = THEMES[currentThemeKey()] || THEMES.default;
  const root = document.documentElement.style;
  root.setProperty("--parchment", t.parchment);
  root.setProperty("--parchment-2", t.parchment2);
  root.setProperty("--ink", t.ink);
  root.setProperty("--ink-soft", t.inkSoft);
  root.setProperty("--leather", t.leather);
  root.setProperty("--leather-2", shade(t.leather,-0.3));
  root.setProperty("--brass", t.brass);
  root.setProperty("--brass-light", t.brassLight);
  root.setProperty("--wine", t.wine);
  root.setProperty("--line", rgba(t.ink,0.2));
}

function mod(score){ return Math.floor((score-10)/2); }
function fmt(n){ return (n>=0?"+":"") + n; }
function totalLevel(){ return state.classes.reduce((s,c)=>s+(parseInt(c.level)||0),0); }
function profBonus(){ return Math.floor((Math.max(totalLevel(),1)-1)/4)+2; }

function initiativeBonus(){
  const hasAlert = allChosenFeats().some(f=>f.feat==="Alert");
  return mod(abilTotal("dex")) + totalBonus("initiative") + (hasAlert ? profBonus() : 0);
}

// Every unlocked feature gets a stable key so choices persist across re-renders/levels.
function featureKey(cls,lvl,fname){ return `${cls}:${lvl}:${fname}`; }

function subfeatureChoiceText(cls, fname, lvl){
  const choice = state.featureChoices[featureKey(cls, lvl, fname)];
  if(SUBCLASS_SINGLE_CHOICE[fname]){
    return (choice && choice.pick) ? ` — chosen: ${choice.pick}` : "";
  }
  if(fname==="Combat Superiority"){
    const selected = (state.featureChoices[`class-agg:${cls}:BattleMasterManeuvers`] || {}).picks || [];
    return selected.length ? ` — maneuvers known: ${selected.join(", ")}` : "";
  }
  if(fname==="Magical Discoveries" && choice && (choice.spell1 || choice.spell2)){
    return ` — chosen: ${[choice.spell1,choice.spell2].filter(Boolean).join(", ")}`;
  }
  return "";
}


// ===== Render-scoped memoization =====
// These functions are pure, deterministic reads of `state` that get called many times over
// in a single render (once per skill/save/ability, once per attack row, etc.) — caching them
// for one render pass avoids redoing the same work dozens of times. saveState() clears the
// cache on every mutation, so nothing here can ever go stale.
let _cache = {};
function invalidateRenderCache(){ _cache = {}; }

function unlockedFeatureInstances(){
  if(_cache.unlockedFeatureInstances) return _cache.unlockedFeatureInstances;
  // Returns every (class, level, featureName) triple currently unlocked, in order.
  const out = [];
  state.classes.forEach(c=>{
    if(!c.cls) return;
    const table = CLASS_TABLE[c.cls] || [];
    const lvl = Math.min(parseInt(c.level)||0, 20);
    table.filter(([l])=>l<=lvl).forEach(([l,feats])=>{
      feats.forEach(fname=> out.push({cls:c.cls, lvl:l, fname}));
    });
  });
  _cache.unlockedFeatureInstances = out;
  return out;
}

function scenarioFeatureList(mode){
  // mode: "combat" (combat-only + both) or "exploration" (everything except combat-only)
  const seen = new Set();
  const out = [];
  unlockedFeatureInstances().forEach(inst=>{
    if(inst.fname==="Ability Score Improvement" || inst.fname==="Epic Boon" || inst.fname==="Monk's Focus" || inst.fname==="Subclass Feature") return;
    if(SUBCLASS_FEATURE_NAMES.has(inst.fname)) return;
    const isCombatOnly = FEATURE_COMBAT_TAGS.has(inst.fname);
    const isBoth = FEATURE_BOTH_TAGS.has(inst.fname);
    const include = mode==="combat" ? (isCombatOnly || isBoth) : !isCombatOnly;
    if(!include) return;
    const k = inst.cls+":"+inst.fname;
    if(seen.has(k)) return;
    seen.add(k);
    out.push(inst);
  });
  return out;
}

function asiBonus(a){
  // Sum of +ability increases the player has allocated via unlocked Ability Score Improvements.
  let total = 0;
  unlockedFeatureInstances().forEach(inst=>{
    if(inst.fname !== "Ability Score Improvement" && inst.fname !== "Epic Boon") return;
    const choice = state.featureChoices[featureKey(inst.cls,inst.lvl,inst.fname)];
    if(!choice) return;
    if(choice.mode === "plus2" && choice.a1 === a) total += 2;
    if(choice.mode === "plus1" && (choice.a1 === a || choice.a2 === a)) total += 1;
  });
  return total;
}

function equipmentBonus(stat){
  let total = 0;
  (state.equipmentItems||[]).forEach(item=>{
    if(!item.equipped) return;
    (item.mods||[]).forEach(m=>{ if(m.stat===stat) total += (parseInt(m.amount)||0); });
  });
  return total;
}

// A concentration-flagged class effect has no "active" checkbox of its own — it's "on" only
// while it's the thing currently selected in the Combat & Health Concentration tracker, same
// as how a concentration spell works. A non-concentration effect still just uses its own
// "active" toggle. Shared by both the stat-bonus calculation and the Quick Reference display,
// so they can never disagree about whether a given effect is currently in effect.
function isClassEffectOn(e){
  return e.concentration
    ? !!(state.concentration && state.concentration.active && !state.concentration.isCustom && state.concentration.label===e.name)
    : !!e.active;
}

function classEffectBonus(stat){
  let total = 0;
  (state.classEffects||[]).forEach(effect=>{
    if(!isClassEffectOn(effect)) return;
    (effect.mods||[]).forEach(m=>{ if(m.stat===stat) total += (parseInt(m.amount)||0); });
  });
  return total;
}

function allChosenFeats(){
  if(_cache.allChosenFeats) return _cache.allChosenFeats;
  const out = [];
  unlockedFeatureInstances().forEach(inst=>{
    if(inst.fname !== "Ability Score Improvement" && inst.fname !== "Epic Boon") return;
    const key = featureKey(inst.cls, inst.lvl, inst.fname);
    const choice = state.featureChoices[key];
    if(!choice || !choice.feat || !FEATS[choice.feat]) return;
    // An Epic Boon slot saved before it had a mode selector has no `mode` — that always meant "a feat".
    if((choice.mode || (inst.fname==="Epic Boon" ? "feat" : "")) !== "feat") return;
    out.push({key, feat:choice.feat, category:choice.category||"both", choice, source:inst.fname});
  });
  // Background Origin Feat — granted automatically at level 1 under current rules; doesn't
  // consume an Ability Score Improvement. Folding it in here means every existing mechanism
  // that already reads allChosenFeats() (HP bonus, proficiency grants, skill-pick counting,
  // the "already taken" ASI exclusion) picks it up for free, with no separate wiring needed.
  const bgInfo = state.background ? BACKGROUNDS[state.background] : null;
  if(bgInfo && bgInfo.originFeat && FEATS[bgInfo.originFeat]){
    const bgChoice = Object.assign({mode:"feat", feat:bgInfo.originFeat, category:"both"}, state.backgroundFeatChoice||{});
    if(bgInfo.originFeatSub) bgChoice.list = bgInfo.originFeatSub;
    out.push({key:"background:originFeat", feat:bgInfo.originFeat, category:"both", choice:bgChoice, source:"Origin"});
  }
  _cache.allChosenFeats = out;
  return out;
}

function featBonus(stat){
  let total = 0;
  allChosenFeats().forEach(f=>{
    (FEATS[f.feat].autoMods||[]).forEach(m=>{ if(m.stat===stat) total += m.amount; });
  });
  return total;
}

function resolvedFeatAbility(f){
  // f is {key, feat, category, ...} from allChosenFeats(); resolves which ability a
  // half-feat's +1 applies to — the fixed one if there's only one option, else the player's pick.
  const def = FEATS[f.feat];
  if(!def || !def.abilityBoost || !def.abilityBoost.length) return null;
  if(def.abilityBoost.length===1) return def.abilityBoost[0];
  const choice = state.featureChoices[f.key];
  return (choice && choice.featAbility) || null;
}

function featAbilityBonus(a){
  let total = 0;
  allChosenFeats().forEach(f=>{
    if(resolvedFeatAbility(f)===a) total += 1;
  });
  return total;
}

function featGrantedSaveProf(a){
  return allChosenFeats().some(f=> FEATS[f.feat].grantsSaveProf && resolvedFeatAbility(f)===a);
}

function hasSaveProficiency(a){
  const primCls = primaryClass();
  if(primCls==="Custom"){
    const picks = (state.classes[0] && state.classes[0].customSaves) || [];
    return picks.includes(a) || featGrantedSaveProf(a);
  }
  return (primCls && (CLASS_SAVES[primCls]||[]).includes(a)) || featGrantedSaveProf(a);
}

function featHpBonus(){
  let total = 0;
  allChosenFeats().forEach(f=>{
    const def = FEATS[f.feat];
    if(def.hpPerLevel) total += def.hpPerLevel * totalLevel();
  });
  return total;
}

function featGrantedProficiencies(){
  const out = [];
  allChosenFeats().forEach(f=>{
    (FEATS[f.feat].grantsProficiency||[]).forEach(p=> out.push({label:p, source:`Feat: ${f.feat}`}));
  });
  return out;
}

function hasProficiencyMatching(text){
  const all = computeProficiencies().map(e=>e.label).concat(state.customProficiencies||[]);
  return all.some(p=>p && p.toLowerCase().includes(text.toLowerCase()));
}

function checkFeatPrereq(featKey){
  const def = FEATS[featKey];
  if(!def || !def.prereq) return {ok:true, text:"No prerequisite."};
  const p = def.prereq;
  const notes = [];
  let ok = true;
  if(p.level){
    const met = totalLevel()>=p.level;
    ok = ok && met;
    notes.push(`Level ${p.level}+ (you're ${totalLevel()})`);
  }
  if(p.abilAny){
    const met = p.abilAny.some(a=>abilTotal(a)>=p.min);
    ok = ok && met;
    notes.push(`${p.abilAny.map(a=>ABIL_NAMES[a]).join(", ").replace(/, ([^,]*)$/," or $1")} ${p.min}+ (you have ${p.abilAny.map(a=>abilTotal(a)).join("/")})`);
  }
  if(p.abil){
    const score = abilTotal(p.abil);
    const met = score >= p.min;
    if(p.abil2){
      const score2 = abilTotal(p.abil2);
      const met2 = score2 >= p.min2;
      ok = ok && (met || met2);
      notes.push(`${ABIL_NAMES[p.abil]} or ${ABIL_NAMES[p.abil2]} ${p.min}+ (you have ${score} and ${score2})`);
    } else {
      ok = ok && met;
      notes.push(`${ABIL_NAMES[p.abil]} ${p.min}+ (you have ${score})`);
    }
  }
  if(p.spellcasting){
    const met = hasSpellcasting();
    ok = ok && met;
    notes.push(`the ability to cast at least one spell (${met?"met":"not currently met"})`);
  }
  if(p.armorProf){
    const met = hasProficiencyMatching(p.armorProf);
    ok = ok && met;
    notes.push(`proficiency with ${p.armorProf.toLowerCase()} (${met?"met":"not currently listed in your Proficiencies"})`);
  }
  if(p.fightingStyle){
    const met = unlockedFeatureInstances().some(i=>i.fname==="Fighting Style");
    ok = ok && met;
    notes.push(`the Fighting Style class feature (${met?"met":"not currently granted by any class"})`);
  }
  if(p.classReq){
    const met = unlockedFeatureInstances().some(i=>i.cls===p.classReq && i.fname==="Fighting Style");
    ok = ok && met;
    notes.push(`${p.classReq} class (${met?"met":"not met"})`);
  }
  if(p.epic){
    const met = totalLevel()>=19;
    ok = ok && met;
    notes.push(`Level 19+ (you're ${totalLevel()})`);
  }
  if(!notes.length) return {ok:true, text:"No prerequisite."};
  return {ok, text:`Requires ${notes.join(", ")}.`};
}

function totalBonus(stat){
  return equipmentBonus(stat) + classEffectBonus(stat) + featBonus(stat);
}

// Every Fighting Style the character has, from any source: the class feature, Champion's
// Additional Fighting Style (a SUBCLASS feature, so it isn't in CLASS_TABLE), and Fighting Style
// feats spent from an ASI slot. Each entry carries the key of the choice it came from, so a picker
// can exclude styles taken by OTHER sources while leaving its own current pick selectable.
function fightingStyleSources(){
  const out = [];
  unlockedFeatureInstances().forEach(inst=>{
    if(inst.fname !== "Fighting Style") return;
    const key = featureKey(inst.cls,inst.lvl,inst.fname);
    const choice = state.featureChoices[key];
    if(choice && choice.style) out.push({key, style:choice.style});
  });
  state.classes.forEach(c=>{
    if(!c.cls || !c.subclass || !SUBCLASS_FEATURES[c.subclass]) return;
    const lvl = classLevelOf(c.cls);
    SUBCLASS_FEATURES[c.subclass].forEach(f=>{
      if(f.name!=="Additional Fighting Style" || f.lvl>lvl) return;
      const key = featureKey(c.cls,f.lvl,f.name);
      const choice = state.featureChoices[key];
      if(choice && choice.style) out.push({key, style:choice.style});
    });
  });
  allChosenFeats().forEach(f=>{
    const def = FEATS[f.feat];
    if(def && def.tier==="fightingStyle") out.push({key:f.key, style:def.styleName});
  });
  return out;
}
function fightingStyleChoice(){ return fightingStyleSources().map(x=>x.style); }

function isHighestOccurrence(cls, fname, lvl){
  const insts = unlockedFeatureInstances().filter(i=>i.cls===cls && i.fname===fname);
  if(!insts.length) return false;
  return lvl === Math.max(...insts.map(i=>i.lvl));
}

function metamagicCount(level){
  if(level>=17) return 6;
  if(level>=10) return 4;
  if(level>=2) return 2;
  return 0;
}

function invocationsKnown(level){
  // Confirmed against the Warlock Features table: the final tier (10 known) begins at level 17, not 18.
  if(level>=17) return 10;
  if(level>=15) return 9;
  if(level>=12) return 8;
  if(level>=9) return 7;
  if(level>=7) return 6;
  if(level>=5) return 5;
  if(level>=2) return 3;
  if(level>=1) return 1;
  return 0;
}

function classLevelOf(cls){
  const c = state.classes.find(c=>c.cls===cls);
  return c ? (parseInt(c.level)||0) : 0;
}

function computeProficiencies(){
  if(_cache.computeProficiencies) return _cache.computeProficiencies;
  const entries = [];
  state.classes.forEach((c,idx)=>{
    if(!c.cls) return;
    const set = idx===0 ? CLASS_PROFICIENCIES_FULL[c.cls] : CLASS_PROFICIENCIES_MULTI[c.cls];
    if(!set) return;
    (set.armor||[]).forEach(a=> entries.push({label:a, source:c.cls}));
    (set.weapons||[]).forEach(w=> entries.push({label:w, source:c.cls}));
  });
  if(state.raceBonus && RACE_WEAPON_PROFICIENCIES[state.raceBonus]){
    RACE_WEAPON_PROFICIENCIES[state.raceBonus].forEach(w=> entries.push({label:w, source:state.raceBonus}));
  }
  entries.push(...featGrantedProficiencies());
  _cache.computeProficiencies = entries;
  return entries;
}

function allProficiencyLabels(){
  if(_cache.allProficiencyLabels) return _cache.allProficiencyLabels;
  const out = computeProficiencies().map(e=>e.label.toLowerCase())
    .concat((state.customProficiencies||[]).map(p=>(p||"").toLowerCase()));
  _cache.allProficiencyLabels = out;
  return out;
}

// Checked the same way as weapon/tool proficiency: against the actual Armor & Weapon
// Proficiencies the character currently has, not just whatever's selected in the Armor Worn
// dropdown. Lets that dropdown show every armor category while still being able to flag when
// the one that's equipped isn't one you're trained with.
function isArmorProficient(category){
  return allProficiencyLabels().includes((category||"").toLowerCase());
}

// 2024 PHB, "Light, Medium, or Heavy Armor" / Armor Training glossary entry: wearing an armor
// category you lack training with gives Disadvantage on every Strength- or Dexterity-based
// D20 Test, and you can't cast spells, for as long as you're wearing it.
function armorPenaltyActive(){
  return !!state.armorEquipped && !isArmorProficient(state.armorEquipped);
}

function armorPenaltySummaryHtml(){
  if(!armorPenaltyActive()) return "";
  return `<div class="small-label" style="margin-bottom:2px;font-weight:600;">Armor Proficiency Penalty</div>
    <div class="feat-item" style="border-left-color:var(--wine);">
      <div class="fname" style="color:var(--wine);">Not proficient with ${escapeHtml(state.armorEquipped)}</div>
      <div class="fdesc">Disadvantage on every Strength- and Dexterity-based D20 Test (ability checks, attack rolls, and saving throws) while wearing it, and you can't cast spells.</div>
    </div><hr class="divider">`;
}

// Shared wording for every spell-casting control (prep checkboxes, spell slot boxes, feat-spell
// free-cast checkboxes) that gets locked while armorPenaltyActive() is true, so they all read
// identically instead of drifting into slightly different phrasing over time.
function armorLockMessage(){
  return `You can't cast spells right now — you're wearing ${state.armorEquipped} without proficiency in it. Switch to Unarmored, or armor you're proficient with, in Equipment & Currency.`;
}

// ---- Tool proficiency computation (mirrors computeProficiencies for armor/weapons) ----
function computeToolProficiencies(){
  if(_cache.computeToolProficiencies) return _cache.computeToolProficiencies;
  const entries = [];
  const bg = state.background && BACKGROUNDS[state.background];
  if(bg && bg.tool){
    if(TOOL_CATEGORIES[bg.tool]){
      if(state.backgroundToolChoice) entries.push({label:state.backgroundToolChoice, source:state.background});
    } else {
      entries.push({label:bg.tool, source:state.background});
    }
  }
  state.classes.forEach(c=>{
    if(!c.cls) return;
    if(c.cls==="Druid") entries.push({label:"Herbalism Kit", source:"Druid"});
    if(c.cls==="Rogue") entries.push({label:"Thieves' Tools", source:"Rogue"});
    if(c.cls==="Monk"){
      const t = (state.classToolChoice||{}).Monk;
      if(t) entries.push({label:t, source:"Monk"});
    }
    if(c.cls==="Bard"){
      const picks = (state.classToolChoice||{}).Bard || [];
      picks.forEach(t=>{ if(t) entries.push({label:t, source:"Bard"}); });
    }
  });
  allChosenFeats().forEach(f=>{
    const c = f.choice||{};
    if(f.feat==="Chef") entries.push({label:"Cook's Utensils", source:"Chef"});
    if(f.feat==="Poisoner") entries.push({label:"Poisoner's Kit", source:"Poisoner"});
    if(f.feat==="Crafter"){ ["tool1","tool2","tool3"].forEach(k=>{ if(c[k]) entries.push({label:c[k], source:"Crafter"}); }); }
    if(f.feat==="Musician"){ ["instr1","instr2","instr3"].forEach(k=>{ if(c[k]) entries.push({label:c[k], source:"Musician"}); }); }
    if(f.feat==="Skilled"){ [1,2,3].forEach(i=>{ if(c["pick"+i+"Type"]==="tool" && c["pick"+i]) entries.push({label:c["pick"+i], source:"Skilled"}); }); }
  });
  entries.push(...(state.customTools||[]).map(t=>({label:t, source:"Custom"})));
  _cache.computeToolProficiencies = entries;
  return entries;
}
function toolProficiencyLabels(){
  return computeToolProficiencies().map(e=>e.label.toLowerCase());
}
function isToolProficient(toolName){
  return toolProficiencyLabels().includes((toolName||"").toLowerCase());
}
// Rogue and Bard's Expertise feature can apply to Thieves' Tools as well as skills, if proficient.
// 2024 rules: Expertise applies only to skill proficiencies, never to tool proficiencies
// (confirmed against both Rogue's and Bard's Expertise feature text, which say "skill
// proficiencies" with no mention of tools — a change from 2014, where Rogue's Expertise could
// include Thieves' Tools). This just gates whether to show Thieves' Tools as an informational
// row under Skills, for visibility — not an Expertise option.
function showThievesToolsRow(){
  return isToolProficient("Thieves' Tools");
}

function weaponsAvailableToCharacter(){
  if(_cache.weaponsAvailableToCharacter) return _cache.weaponsAvailableToCharacter;
  const profs = allProficiencyLabels();
  const hasSimple = profs.includes("simple weapons");
  const hasMartial = profs.includes("martial weapons");
  const out = Object.keys(WEAPONS).filter(name=>{
    if(name==="Unarmed Strike") return true; // everyone can use it, no weapon training needed
    const w = WEAPONS[name];
    if(w.cat==="Simple" && hasSimple) return true;
    if(w.cat==="Martial" && hasMartial) return true;
    // Class tables list named weapon proficiencies in plural form (e.g. "Rapiers"), matching
    // PHB style, while WEAPONS keys are singular ("Rapier") — check both.
    return profs.includes(name.toLowerCase()) || profs.includes(name.toLowerCase()+"s");
  }).sort();
  _cache.weaponsAvailableToCharacter = out;
  return out;
}

// Single-weapon check, verified the same way as weaponsAvailableToCharacter() — i.e. against
// the actual Armor & Weapon Proficiencies the character currently has (Simple/Martial category
// proficiency, or the named weapon specifically). Used so the Attacks dropdown can list every
// catalog weapon while still only granting the proficiency bonus to ones you're really
// proficient with, instead of hiding non-proficient weapons from the list entirely.
function isWeaponProficient(weaponName){
  return weaponsAvailableToCharacter().includes(weaponName);
}

// How many weapon "kinds" a single class's Weapon Mastery feature grants at a given level,
// per the 2024 PHB Features table for that class (0 if the class doesn't grant it yet/at all).
function weaponMasterySlotsForClass(cls, lvl){
  const rule = WEAPON_MASTERY_CLASS_RULES[cls];
  if(!rule || lvl<1) return 0;
  let n = 0;
  rule.thresholds.forEach(([atLvl,count])=>{ if(lvl>=atLvl) n = count; });
  return n;
}

// Weapons eligible for mastery selection under a given restriction:
// null = any weapon you're proficient with; "meleeOnly" = Barbarian (melee only);
// "rogueList" = Rogue (Simple weapons, or Martial weapons with Finesse or Light).
function weaponMasteryEligibleWeapons(restrict){
  return weaponsAvailableToCharacter().filter(name=>{
    const w = WEAPONS[name];
    if(!w.mastery) return false;
    if(restrict==="meleeOnly") return !w.ranged;
    if(restrict==="rogueList") return w.cat==="Simple" || w.finesse || w.light;
    return true;
  });
}

// Slot count, source breakdown, and eligible-weapon list for the character's Weapon Mastery.
// Multiclass note: this currently takes the single best class rather than stacking multiple
// mastery-granting classes — a simplification flagged for later review, not strict RAW.
function weaponMasteryInfo(){
  let best = {count:0, cls:null, restrict:null};
  state.classes.forEach(c=>{
    if(!c.cls || !WEAPON_MASTERY_CLASS_RULES[c.cls]) return;
    const n = weaponMasterySlotsForClass(c.cls, parseInt(c.level)||0);
    if(n>best.count) best = {count:n, cls:c.cls, restrict:WEAPON_MASTERY_CLASS_RULES[c.cls].restrict};
  });
  const sources = [];
  if(best.count>0) sources.push(`${best.count} from ${best.cls}`);
  let slots = best.count;
  if(allChosenFeats().some(f=>f.feat==="Weapon Master")){
    slots += 1;
    sources.push("+1 from the Weapon Master feat");
  }
  return {slots, sources, restrict:best.restrict, eligible:weaponMasteryEligibleWeapons(best.restrict)};
}

// Drops any chosen mastery weapons that are no longer eligible (lost proficiency, class
// changed, etc.). There's no equivalent prune for the Attacks list itself anymore — as of
// the 2024-rules-accurate Attacks dropdown, any catalog weapon can stay selected even without
// proficiency; computeAttackBonus() just stops adding the proficiency bonus for it live,
// rather than kicking the weapon out to a "Custom" slot the way this used to work.
// Drops chosen mastery weapons that are no longer eligible — either because a specific pick
// lost its proficiency/mastery eligibility, or because the character no longer has ANY Weapon
// Mastery slots at all (e.g. switched from a mastery-granting class like Fighter to one that
// doesn't have the feature, such as Wizard, with no Weapon Master feat to fall back on). The
// second case matters on its own: a still-proficient weapon (e.g. a Wizard keeps Simple Weapon
// proficiency, which includes Dagger) would otherwise read as "eligible" and survive the prune
// even with zero slots to justify it.
function pruneStaleWeaponMasteries(){
  const info = weaponMasteryInfo();
  const before = (state.weaponMasteries||[]).length;
  if(info.slots<=0){
    state.weaponMasteries = [];
  } else {
    const eligible = new Set(info.eligible);
    state.weaponMasteries = (state.weaponMasteries||[]).filter(w=>!w || eligible.has(w));
  }
  if(state.weaponMasteries.length < before) showToast("A weapon mastery choice was cleared since it's no longer eligible.");
}

// If a feat/feature that granted bonus skill or Expertise picks is removed, swapped for a
// different feat, or its unlock condition goes away (e.g. lowering level below where Expertise
// was granted), the skill/Expertise budget can shrink below what's currently checked. Without
// this, those picks just stay checked forever with no valid source behind them anymore — this
// trims back down to the new, smaller budget, dropping the most recently checked ones first
// (by the order they were set, same convention used elsewhere on the sheet for "most recent")
// until the count fits again. A skill that loses its own proficiency this way loses any
// Expertise on it too, since Expertise requires proficiency in 2024.
function pruneExcessSkillsAndExpertise(){
  // This runs BEFORE saveState() at every call site (so the prune itself gets persisted in the
  // same write as the change that triggered it), but that means the usual cache invalidation
  // saveState() does hasn't happened yet — without forcing it here too, skillEligibility() and
  // expertiseLimit() would see stale, pre-change cached data (e.g. still-cached feature counts
  // from before a level change that just lowered them) and wrongly conclude nothing needs pruning.
  invalidateRenderCache();
  let changed = false;
  const elig = skillEligibility();
  const skillLimit = elig.classInfo ? elig.classInfo.count : 0;

  // A feat like Skilled temporarily opens the list to every skill, not just the restricted
  // amount your class's own list has — so losing that feat can make a checked skill fall
  // completely off the (now smaller) eligible list, not just push the total over budget. Those
  // are stale outright and come off regardless of count; what's left on a valid list is then
  // trimmed down to the numeric budget if that's now smaller too.
  const chosen = Object.keys(state.skillProf||{}).filter(k=>state.skillProf[k] && !elig.bgSkills.includes(k));
  const stillEligible = [];
  chosen.forEach(k=>{
    const onList = !elig.classList || elig.classList.includes(k);
    if(!onList){
      state.skillProf[k] = false;
      if(state.skillExpertise && state.skillExpertise[k]) state.skillExpertise[k] = false;
      changed = true;
    } else {
      stillEligible.push(k);
    }
  });
  while(stillEligible.length > skillLimit){
    const removed = stillEligible.pop();
    state.skillProf[removed] = false;
    if(state.skillExpertise && state.skillExpertise[removed]) state.skillExpertise[removed] = false;
    changed = true;
  }

  const expLimit = expertiseLimit();
  const chosenExpKeys = Object.keys(state.skillExpertise||{}).filter(k=>state.skillExpertise[k]);
  while(chosenExpKeys.length > expLimit){
    const removed = chosenExpKeys.pop();
    state.skillExpertise[removed] = false;
    changed = true;
  }
  if(changed) showToast("A feat or feature granting bonus skill/Expertise picks was removed or changed — the picks that no longer fit were cleared. Re-pick in Abilities, Saves & Skills if you have room again.");
}

function computeAttackBonus(a){
  if(!a.abilityKey) return parseInt(a.miscBonus)||0;
  // Catalog weapons check proficiency live against current Armor & Weapon Proficiencies, so
  // the bonus always reflects reality even if a.proficient is stale (e.g. multiclassed away
  // from it since picking it). Custom/unlisted attacks have no catalog entry to verify against,
  // so they keep using the manual "Proficient" checkbox.
  const isProficient = a.weaponKey ? isWeaponProficient(a.weaponKey) : !!a.proficient;
  return mod(abilTotal(a.abilityKey)) + (isProficient ? profBonus() : 0) + (parseInt(a.miscBonus)||0);
}

function attackDisplayName(a){
  return a.weaponKey || a.customName || "Unnamed Attack";
}

// Great Weapon Master's Heavy Weapon Mastery: extra damage equal to your proficiency bonus
// whenever you hit with a Heavy weapon — confirmed against the project's verified feat text,
// which (unlike the 2014 version) has no −5-to-hit tradeoff attached, so this is simply always
// on rather than an optional per-swing choice. Only 9 weapons have the Heavy property (Glaive,
// Greataxe, Greatsword, Halberd, Lance, Maul, Pike, Heavy Crossbow, Longbow — flagged via
// `heavy:true` on each in WEAPONS), confirmed against the project's verified equipment reference.
function greatWeaponMasterBonus(a){
  if(!a.weaponKey || !WEAPONS[a.weaponKey] || !WEAPONS[a.weaponKey].heavy) return 0;
  if(!allChosenFeats().some(f=>f.feat==="Great Weapon Master")) return 0;
  return profBonus();
}

// Tavern Brawler's Enhanced Unarmed Strike: upgrades the base Unarmed Strike damage from a flat
// 1 (modeled on this sheet as 1d1 — see the Unarmed Strike entry in WEAPONS) to 1d4, automatically,
// for anyone with the feat — confirmed against the project's verified feat text. Live, like the
// Great Weapon Master bonus above: taking or losing the feat updates this immediately without
// needing to re-select the attack's weapon.
function hasTavernBrawlerUnarmedUpgrade(a){
  return a.weaponKey==="Unarmed Strike" && allChosenFeats().some(f=>f.feat==="Tavern Brawler");
}

function attackDamageSummaryText(a){
  const abilMod = a.abilityKey ? mod(abilTotal(a.abilityKey)) : 0;
  const gwmBonus = greatWeaponMasterBonus(a);
  const tavernBrawlerUpgrade = hasTavernBrawlerUnarmedUpgrade(a);
  return (a.damages||[]).filter(d=>d.active!==false).map((d,i)=>{
    const count = parseInt(d.count)||1;
    let die = parseInt(d.die)||6;
    if(i===0 && tavernBrawlerUpgrade) die = 4;
    let str = `${count}d${die}`;
    if(i===0 && a.addAbilityToDamage && a.abilityKey && abilMod!==0) str += fmt(abilMod);
    if(i===0 && gwmBonus) str += `${fmt(gwmBonus)} (GWM)`;
    if(d.type) str += ` ${d.type}`;
    return str;
  }).filter(Boolean).join(" + ") || "—";
}

// A spell always includes your proficiency bonus (there's no "not proficient with a spell" the
// way there is for a weapon) — so unlike computeAttackBonus(), this never needs a proficiency
// check. "attack" resolution returns the Spell Attack Bonus (added to a d20 roll); "save"
// resolution returns the full Spell Save DC instead, since that's the number a player actually
// needs at the table, not a bonus to add to anything.
function computeSpellRollBonus(s){
  if(!s.abilityKey) return parseInt(s.miscBonus)||0;
  const abilMod = mod(abilTotal(s.abilityKey));
  if(s.resolution==="save") return 8 + profBonus() + abilMod + (parseInt(s.miscBonus)||0);
  return abilMod + profBonus() + (parseInt(s.miscBonus)||0);
}

// Mirrors attackDamageSummaryText(), but defaults to NOT adding the ability modifier to damage —
// most damage spells (cantrips very much included) deal only their listed dice, with the ability
// score affecting the attack roll or save DC instead, not the damage itself. A player can still
// turn "Add ability modifier to damage" on for the rare spell that calls for it.
function spellDamageSummaryText(s){
  const abilMod = s.abilityKey ? mod(abilTotal(s.abilityKey)) : 0;
  return (s.damages||[]).filter(d=>d.active!==false).map((d,i)=>{
    const count = parseInt(d.count)||1;
    const die = parseInt(d.die)||6;
    let str = `${count}d${die}`;
    if(i===0 && s.addAbilityToDamage && s.abilityKey && abilMod!==0) str += fmt(abilMod);
    if(d.type) str += ` ${d.type}`;
    return str;
  }).filter(Boolean).join(" + ") || "—";
}

function carryCapacityInfo(){
  const str = abilTotal("str");
  const mult = state.powerfulBuild ? 2 : 1;
  const capacity = str*15*mult;
  const encumberedAt = str*5*mult;
  const heavyAt = str*10*mult;
  const pushDragLift = capacity*2;
  const load = parseFloat(state.carriedWeight)||0;
  let status = "Unencumbered", speedPenalty = 0, note = "You're carrying a comfortable amount — no penalties.";
  if(load > capacity){
    status = "Over Capacity"; speedPenalty = state.useVariantEncumbrance?20:0;
    note = "You're carrying more than your maximum — drop something or you won't be able to move (or move only 5 ft per turn, DM's call).";
  } else if(state.useVariantEncumbrance && load > heavyAt){
    status = "Heavily Encumbered"; speedPenalty = 20;
    note = "Speed -20 ft; disadvantage on Strength, Dexterity, and Constitution checks, attack rolls, and saving throws.";
  } else if(state.useVariantEncumbrance && load > encumberedAt){
    status = "Encumbered"; speedPenalty = 10;
    note = "Speed -10 ft.";
  }
  return {str, mult, capacity, encumberedAt, heavyAt, pushDragLift, load, status, speedPenalty, note};
}

function autoSpeed(){
  const raceSpeed = state.raceBonus ? (RACE_SPEED[state.raceBonus] ?? 30) : 30;
  let classBonus = 0;
  const barbLvl = classLevelOf("Barbarian");
  if(barbLvl >= 5) classBonus += 10;
  const monkLvl = classLevelOf("Monk");
  if(monkLvl >= 18) classBonus += 30;
  else if(monkLvl >= 14) classBonus += 25;
  else if(monkLvl >= 10) classBonus += 20;
  else if(monkLvl >= 6) classBonus += 15;
  else if(monkLvl >= 2) classBonus += 10;
  const encumbrancePenalty = carryCapacityInfo().speedPenalty;
  return Math.max(0, raceSpeed + classBonus + totalBonus("speed") - encumbrancePenalty);
}

// Ability Score Improvements and feats can't raise a score above 20 — only an Epic Boon's +1 may go
// up to 30. That ceiling applies to what ASIs/feats ADD; it never lowers a score that's already higher,
// and magic items / other modifiers (totalBonus) sit on top of it, uncapped.
function abilityGainCap(a){
  const epic = allChosenFeats().some(f=> FEATS[f.feat].tier==="epic" && resolvedFeatAbility(f)===a);
  return epic ? 30 : 20;
}
function abilTotal(a){
  const base = (state.abilities[a] ?? 10) + ((state.abilityPointAllocation||{})[a] || 0);
  const improved = Math.max(base, Math.min(base + asiBonus(a) + featAbilityBonus(a), abilityGainCap(a)));
  return improved + totalBonus(a);
}

// Standard 5e XP-to-level thresholds (index = level-1).
const XP_LEVEL_THRESHOLDS = [0,300,900,2700,6500,14000,23000,34000,48000,64000,85000,100000,120000,140000,165000,195000,225000,265000,305000,355000];
function xpBasedLevel(xp){
  let lvl = 1;
  for(let i=0;i<XP_LEVEL_THRESHOLDS.length;i++){ if(xp >= XP_LEVEL_THRESHOLDS[i]) lvl = i+1; }
  return lvl;
}

function characterRaceName(){
  if(state.raceBonus==="__custom__") return state.customRace || "Custom Race";
  return state.raceBonus || "";
}

function abilityPointsTotal(){
  return Object.values(state.abilityPointAllocation||{}).reduce((s,v)=>s+(parseInt(v)||0),0);
}

function expertiseLimit(){
  let grants = 0;
  unlockedFeatureInstances().forEach(inst=>{ if(inst.fname === "Expertise") grants++; });
  // Feats that grant an Expertise pick (Skill Expert, Boon of Skill, and Keen Mind / Observant, whose
  // "proficiency or Expertise" pick is Expertise when you're already proficient).
  const featPicks = allChosenFeats().reduce((n,f)=> n + (FEATS[f.feat].grantsExpertise||0), 0);
  return grants * 2 + featPicks;
}

// A Custom class row's Hit Die (defaults to d8, matching the sheet's existing fallback for any
// class it doesn't recognize).
function customHitDie(c){ return parseInt(c.customHitDie)||8; }

function autoMaxHP(){
  let total = 0;
  const conMod = mod(abilTotal("con"));
  state.classes.forEach((c,idx)=>{
    if(!c.cls) return;
    const lvl = parseInt(c.level)||0;
    if(lvl<=0) return;
    const die = classHitDie(c);
    const maxDieLevelHP = die + conMod; // level 1 of your very first class overall: always max die
    if(c.cls==="Custom" && !c.customFixedHP){
      // Rolled HP: the player enters what they actually rolled for each level (see the per-level
      // inputs in Classes & Features), rather than the sheet deriving an average. Level 1 of your
      // very first class is still always max die, same as any class — only levels beyond that (or
      // every level, if this Custom class isn't your first) come from the stored rolls.
      const rolls = c.customHpRolls || [];
      if(idx===0){
        total += maxDieLevelHP;
        for(let l=2; l<=lvl; l++){ total += (parseInt(rolls[l-1])||1) + conMod; }
      } else {
        for(let l=1; l<=lvl; l++){ total += (parseInt(rolls[l-1])||1) + conMod; }
      }
    } else {
      const avgPerLevel = c.cls==="Custom"
        ? (parseInt(c.customFixedHPValue)||Math.floor(die/2)+1) + conMod
        : Math.floor(die/2) + 1 + conMod;
      if(idx===0){
        total += maxDieLevelHP;
        total += avgPerLevel * (lvl-1);
      } else {
        total += avgPerLevel * lvl;
      }
    }
  });
  total += totalBonus("hpMax");
  total += featHpBonus();
  return Math.max(1,total);
}

// Fighter/Rogue subclasses that grant limited ("third-caster") spellcasting starting at level 3.
const THIRD_CASTER_SUBCLASSES = {Fighter:"Eldritch Knight", Rogue:"Arcane Trickster"};

function isThirdCaster(c){
  return THIRD_CASTER_SUBCLASSES[c.cls] && c.subclass===THIRD_CASTER_SUBCLASSES[c.cls] && (parseInt(c.level)||0) >= 3;
}

function fullCasterLevelEquiv(){
  let full=0, half=0, third=0;
  state.classes.forEach(c=>{
    const t = CLASS_CASTER_TYPE[c.cls];
    const lvl = parseInt(c.level)||0;
    if(t==="full") full += lvl;
    else if(t==="half") half += lvl;
    else if(isThirdCaster(c)) third += lvl;
  });
  // 2024: half-casters (Paladin/Ranger) count half their levels ROUNDED UP — which is why a level 1
  // Paladin already has two 1st-level slots. Third-casters (Eldritch Knight/Arcane Trickster) still round down.
  return full + Math.ceil(half/2) + Math.floor(third/3);
}

function warlockLevel(){
  const w = state.classes.find(c=>c.cls==="Warlock");
  return w ? (parseInt(w.level)||0) : 0;
}

/* ===================== RENDER ===================== */

const app = document.getElementById("app");

function hasSpellcasting(){
  return state.classes.some(c => (c.cls && CLASS_CASTER_TYPE[c.cls] && CLASS_CASTER_TYPE[c.cls] !== "none") || isThirdCaster(c));
}

function maxCastableSpellLevel(){
  const slotInfo = spellSlotSummary();
  let maxLevel = 0;
  slotInfo.full.forEach((n,i)=>{ if(n>0) maxLevel = Math.max(maxLevel, i+1); });
  if(slotInfo.pact) maxLevel = Math.max(maxLevel, slotInfo.pact.slvl);
  return maxLevel;
}

function characterSpellSourceClasses(){
  if(_cache.characterSpellSourceClasses) return _cache.characterSpellSourceClasses;
  // Only TRUE base spellcasting classes (full/half/pact). Third-casters (Eldritch Knight,
  // Arcane Trickster) don't get their own tag on any spell — they draw from the Wizard list
  // instead, restricted by school (see characterThirdCasterSchoolNames).
  const set = new Set();
  state.classes.forEach(c=>{
    if(!c.cls) return;
    const t = CLASS_CASTER_TYPE[c.cls];
    if(t && t!=="none") set.add(c.cls);
  });
  _cache.characterSpellSourceClasses = set;
  return set;
}

function characterSubclassBonusSpellNames(){
  if(_cache.characterSubclassBonusSpellNames) return _cache.characterSubclassBonusSpellNames;
  const names = new Set();
  state.classes.forEach(c=>{
    if(c.subclass && SUBCLASS_SPELLS[c.subclass]){
      SUBCLASS_SPELLS[c.subclass].forEach(s=> names.add(s.name));
    }
    if(c.cls==="Druid" && c.subclass==="Circle of the Land" && c.terrain && TERRAIN_SPELLS[c.terrain]){
      TERRAIN_SPELLS[c.terrain].forEach(s=> names.add(s.name));
    }
    if(c.subclass==="College of Lore" && classLevelOf(c.cls)>=6){
      const secretsChoice = state.featureChoices[featureKey(c.cls,6,"Magical Discoveries")];
      if(secretsChoice){
        if(secretsChoice.spell1) names.add(secretsChoice.spell1);
        if(secretsChoice.spell2) names.add(secretsChoice.spell2);
      }
    }
  });
  _cache.characterSubclassBonusSpellNames = names;
  return names;
}

// EK/AT get a growing number of "any school" wildcard picks on top of their normal
// school-restricted list: 1 at 3rd level (folded into their very first three spells known),
// then one more each at 8th, 14th, and 20th.
function thirdCasterWildcardLimit(lvl){
  if(lvl>=20) return 4;
  if(lvl>=14) return 3;
  if(lvl>=8) return 2;
  if(lvl>=3) return 1;
  return 0;
}

function characterThirdCasterSchoolNames(){
  if(_cache.characterThirdCasterSchoolNames) return _cache.characterThirdCasterSchoolNames;
  const names = new Set();
  state.classes.forEach(c=>{
    if(!isThirdCaster(c)) return;
    const allowed = c.cls==="Fighter" ? EK_ALLOWED_SPELLS : (c.cls==="Rogue" ? AT_ALLOWED_SPELLS : []);
    allowed.forEach(n=> names.add(n));
    // Cantrips are never school-restricted for either subclass.
    SPELL_LIST.filter(sp=>sp.lvl===0 && sp.classes.includes("Wizard")).forEach(sp=>names.add(sp.name));
    // Their "any school" wildcard picks.
    const wildcardKey = `class-agg:${c.cls}:ThirdCasterWildcards`;
    const picks = (state.featureChoices[wildcardKey] && state.featureChoices[wildcardKey].picks) || [];
    picks.forEach(n=>names.add(n));
  });
  _cache.characterThirdCasterSchoolNames = names;
  return names;
}

function isSpellAvailableToCharacter(sp){
  const classSet = characterSpellSourceClasses();
  if(sp.classes.some(c=>classSet.has(c))) return true;
  if(characterSubclassBonusSpellNames().has(sp.name)) return true;
  return characterThirdCasterSchoolNames().has(sp.name);
}

function maxSpellLevelForPicker(){
  // One level of headroom above what you can currently cast, so you can plan ahead —
  // but not so far ahead that the list fills with spells you can't use for many levels.
  return Math.min(9, maxCastableSpellLevel() + 1);
}

function pruneSpellsToAvailability(){
  if(!hasSpellcasting()){
    state.spellsKnown = [];
  } else {
    const maxLevel = maxCastableSpellLevel();
    const classSet = characterSpellSourceClasses();
    const bonusNames = characterSubclassBonusSpellNames();
    const thirdCasterNames = characterThirdCasterSchoolNames();
    state.spellsKnown = (state.spellsKnown||[]).filter(s=>{
      if(s.lvl==="" || s.lvl===undefined || s.lvl===null) return true;
      const lvl = parseInt(s.lvl);
      if(isNaN(lvl)) return true;
      if(lvl>0 && lvl>maxLevel) return false;
      if(s.custom) return true;
      const matched = SPELL_LIST.find(sp=>sp.name===s.name);
      if(!matched) return true;
      return matched.classes.some(c=>classSet.has(c)) || bonusNames.has(matched.name) || thirdCasterNames.has(matched.name);
    });
  }
  // If you were concentrating on a specific spell or class effect that just became
  // unavailable (e.g. your class no longer has spellcasting, or the effect got removed),
  // clear it rather than leaving a stale, no-longer-real thing shown as active.
  if(state.concentration && state.concentration.active && !state.concentration.isCustom){
    if(!concentrationOptions().includes(state.concentration.label)){
      const was = state.concentration.label || "your spell/effect";
      state.concentration = {active:false, label:"", isCustom:false};
      showToast(`Concentration on ${was} cleared — no longer available after that change.`);
    }
  }
  // Same idea for Mystic Arcanum — clear any picks tied to a Warlock level you no longer have.
  const unlockedArcanum = mysticArcanumUnlockedLevels();
  Object.keys(state.mysticArcanum||{}).forEach(lvl=>{
    if(!unlockedArcanum.has(parseInt(lvl)) && state.mysticArcanum[lvl].spell){
      state.mysticArcanum[lvl] = {spell:"", used:false, category:"combat"};
    }
  });
}

function render(){
  applyTheme();
  if(currentView==="settings"){
    app.innerHTML = renderSettingsPage();
    wireSettingsPageEvents();
    return;
  }
  if(currentView==="campaign"){
    app.innerHTML = renderCampaignPage();
    wireCampaignPageEvents();
    return;
  }
  const t = totalLevel();
  const pb = profBonus();
  app.innerHTML = `
    ${renderLevelUpBanner()}
    ${renderMasthead()}
    ${renderStatbar(pb,t)}
    ${renderScenarioSummary()}
    ${card("diceRoller","Dice Roller", renderDiceRollerCard(), "Build a pool of any dice you need and roll them together, with Advantage/Disadvantage for a single d20 and an optional ability check, saving throw, or skill modifier added automatically as its own line.")}

    ${card("classes","Classes &amp; Features", renderClassesCard(t), "Your class(es) and level(s). Add more than one row to multiclass. Features you've unlocked at each level are listed automatically below.")}
    ${hasSpellcasting() ? card("spells","Spellcasting", renderSpellsCard(), "Spell slots (computed from your caster level), plus a list of spells you know or have prepared.") : ""}
    ${featSpellEntries().length ? card("featSpells","Spells from Feats", renderFeatSpellsCard(), "Spells granted by feats (Magic Initiate, Fey-Touched, Shadow-Touched, Ritual Caster, Telekinetic, Telepathic). Always prepared, tracked separately from your class spell list, and available even without a spellcasting class.") : ""}
    ${card("abilities","Abilities, Saves &amp; Skills", renderAbilitiesCard(pb), "Your six ability scores and the modifiers, saving throws, and skills that come from them.")}
    ${card("equipment","Equipment &amp; Currency", renderEquipmentCard(), "Your coin purse, the armor/shield driving your AC, weapon/armor proficiencies, carrying capacity, and a list of gear, weapons, and magic items.")}
    ${card("combat","Combat &amp; Health", renderCombatCard(), "Armor Class, speed, hit points, death saves, conditions, concentration, and your attacks list.")}
    ${card("customFeatures","Additional Features", renderCustomFeaturesCard(), "Racial traits, feats, or homebrew abilities not already covered elsewhere. Tag each for Combat, Out of Combat, or Both to have it appear in the Quick Reference above.")}
    ${card("notes","Personality &amp; Notes", renderNotesCard(), "Roleplay hooks, extra racial/feat features, and open session notes.")}
    ${card("images","Character Images", renderImagesCard(), "Upload a full character portrait, crop a profile picture from it, and optionally add a photo of your tabletop mini.")}
    ${renderCharacterRoster()}
    <div class="footer-note">

    </div>

    ${renderHelpPopup()}
  `;
  wireEvents();
}

// Navigation between the two views is just a hash change — the hashchange listener (set up
// near the bottom of the script) is what actually flips currentView and re-renders, so both
// these buttons and the browser's own Back/Forward buttons go through the same path.
// Updates the hash (so Back/Forward keep working — see the hashchange listener near the
// bottom of the script) but also switches the view and re-renders right here, synchronously —
// the browser doesn't fire the hashchange event until the next tick, and a click should feel
// instant rather than waiting a beat for that to come back around.
function goToSettings(){
  teardownCampaignRollSub();
  if(location.hash !== "#settings") location.hash = "settings";
  currentView = "settings";
  render();
  window.scrollTo(0,0);
}
function goToSheet(){
  teardownCampaignRollSub();
  if(location.hash) location.hash = "";
  currentView = "sheet";
  render();
  window.scrollTo(0,0);
}

function wireSettingsPageEvents(){
  document.getElementById("btn-back-to-sheet").addEventListener("click", goToSheet);
  document.getElementById("btn-back-to-sheet-bottom").addEventListener("click", goToSheet);

  app.querySelectorAll("[data-section-visible]").forEach(el=>{
    el.addEventListener("change", ()=>{
      const key = el.getAttribute("data-section-visible");
      if(!state.hiddenSections) state.hiddenSections = {};
      state.hiddenSections[key] = !el.checked;
      saveState(); renderPreserveScroll();
    });
  });
  document.getElementById("btn-section-preset-combat").addEventListener("click", ()=>{
    const keep = new Set(["summary","diceRoller","combat","spells","featSpells"]);
    const hidden = {};
    HIDEABLE_SECTIONS.forEach(([key])=>{ if(!keep.has(key)) hidden[key] = true; });
    state.hiddenSections = hidden;
    saveState(); renderPreserveScroll();
  });
  document.getElementById("btn-section-preset-all").addEventListener("click", ()=>{
    state.hiddenSections = {};
    saveState(); renderPreserveScroll();
  });

  const themeSelect = document.querySelector('select[data-field="themeMode"]');
  if(themeSelect) themeSelect.addEventListener("change", ()=>{
    state.themeMode = themeSelect.value;
    saveState(); renderPreserveScroll();
  });

  const soundMutedChk = document.getElementById("chk-sound-muted");
  if(soundMutedChk) soundMutedChk.addEventListener("change", ()=>{
    state.soundMuted = soundMutedChk.checked;
    saveState(); renderPreserveScroll();
  });

  document.getElementById("btn-export").addEventListener("click", ()=>{
    // Images are intentionally left out of exports — they're the main reason JSON files
    // get large enough to hit mobile storage limits (the bug that caused imports to silently
    // fail to save). Each device keeps its own images; only the character data itself travels.
    const exportState = Object.assign({}, state, {characterImage:"", profileImage:"", miniImage:""});
    saveFile((state.name || "character") + ".json", JSON.stringify(exportState,null,2));
  });
  document.getElementById("btn-import").addEventListener("click", ()=>{
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json";
    input.addEventListener("change", (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const parsed = JSON.parse(reader.result);
          const newState = migrateArmor(parsed, migrateRace(migrateAttacks(Object.assign(structuredClone(DEFAULT_STATE), parsed))));
          // Exports don't include images (see Export JSON) — keep whatever images are already
          // set on this device instead of wiping them out just because the import has none.
          newState.characterImage = state.characterImage;
          newState.profileImage = state.profileImage;
          newState.miniImage = state.miniImage;
          state = newState;
          const saved = saveState();
          render();
          if(!saved){
            showToast("Imported, but it couldn't be saved to this device's storage — it'll revert if you close the app. This usually means storage is full. Try removing the character portrait/mini photo, then import again.");
          }
        }catch(err){ showToast("That file didn't look like a valid character export."); }
      };
      reader.readAsText(file);
    });
    input.click();
  });
  document.getElementById("btn-print-sheet").addEventListener("click", ()=>{
    const printCss = `
      body{background:#fff;color:#111;font-family:Arial,sans-serif;font-size:11px;max-width:800px;margin:0 auto;padding:16px;}
      h1{font-family:Georgia,serif;font-size:24px;margin:0;}
      h2{font-family:Georgia,serif;font-size:14px;margin:0 0 4px;border-bottom:1.5px solid #111;padding-bottom:2px;}
      .ps-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px;}
      .ps-sub{font-size:12px;color:#333;margin-top:2px;}
      .ps-grid{display:grid;gap:10px;margin-bottom:10px;}
      .ps-grid-2{grid-template-columns:1fr 1fr;}
      .ps-grid-3{grid-template-columns:1fr 1fr 1fr;}
      .ps-box-section{border:1.5px solid #111;border-radius:4px;padding:8px;break-inside:avoid;}
      .ps-abil-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px;}
      .ps-abil-box{border:1.5px solid #111;border-radius:6px;text-align:center;padding:4px 2px;}
      .ps-abil-label{font-size:10px;font-weight:600;letter-spacing:.05em;}
      .ps-abil-mod{font-size:18px;font-weight:700;font-family:Georgia,serif;}
      .ps-abil-score{font-size:10px;color:#333;}
      .ps-line{display:flex;align-items:center;gap:6px;padding:2px 0;border-bottom:1px dotted #999;}
      .ps-line .ps-fill{margin-left:auto;font-weight:600;}
      .ps-box{display:inline-block;width:12px;height:12px;border:1px solid #111;text-align:center;line-height:11px;font-size:9px;flex-shrink:0;}
      table{width:100%;border-collapse:collapse;margin-bottom:8px;}
      th,td{border:1px solid #111;padding:3px 5px;font-size:10.5px;text-align:left;}
      th{background:#eee;}
      .ps-feature{padding:2px 0;border-bottom:1px dotted #ccc;}
      .ps-blank-lines{border-bottom:1px solid #999;height:16px;margin-bottom:4px;}
      .ps-footer{text-align:center;color:#666;font-size:9px;margin-top:14px;}
      @media print{ .ps-print-btn{ display:none !important; } }
      .ps-print-btn{ display:block; margin:0 auto 14px; padding:10px 18px; font-size:13px; cursor:pointer; }
    `;
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeAttr(state.name||"Character Sheet")}</title><style>${printCss}</style></head>
      <body>
        <button class="ps-print-btn" onclick="window.print()">Print / Save as PDF</button>
        ${buildPrintSheetHtml()}
      </body></html>`;

    const win = window.open("", "_blank");
    if(!win){
      showToast("Your browser blocked the new tab this needs to open. Please allow pop-ups for this page and click the button again.");
      return;
    }
    win.document.open();
    win.document.write(html);
    win.document.close();
  });
  document.getElementById("btn-export-ai").addEventListener("click", ()=>{
    saveFile((state.name || "character") + "-ai-summary.md", buildAiSummaryText());
  });

  const dismissToastBtn = document.getElementById("btn-dismiss-toast");
  if(dismissToastBtn) dismissToastBtn.addEventListener("click", ()=>{
    toastMessage = null;
    clearTimeout(toastTimer);
    renderPreserveScroll();
  });
}

// A homebrew/custom-class toggleable feature (Classes & Features) can grant a skill proficiency,
// and optionally Expertise on it, once it's turned on — meant for custom classes and one-off
// magic items (a scroll that teaches a skill, say), additive on top of your real skillProf/
// skillExpertise picks and never touching the official Expertise pool or cap. Only a
// non-concentration effect can grant this: concentration is inherently temporary/breakable,
// which doesn't fit "permanently learned."
function effectGrantsSkill(skillName){
  return (state.classEffects||[]).some(e=>e.active && !e.concentration && e.skill===skillName);
}
function effectGrantsSkillExpertise(skillName){
  return (state.classEffects||[]).some(e=>e.active && !e.concentration && e.skill===skillName && e.skillExpertise);
}
// Shared by every place that reads a skill's Expertise status, so a custom-feature grant is
// never missed in one spot while correctly showing up in another.
function isSkillExpertise(skillName){
  return !!state.skillExpertise[skillName] || effectGrantsSkillExpertise(skillName);
}

function isSkillProficient(skillName){
  // Background-granted proficiency is automatic, not a stored choice — always counted as
  // proficient regardless of what's saved in skillProf, so it can't get out of sync (e.g. an
  // imported character, or one whose background was set before this auto-grant existed).
  if(allChosenFeats().some(f=>FEATS[f.feat].grantsAllSkills)) return true; // Boon of Skill
  return !!state.skillProf[skillName] || skillEligibility().bgSkills.includes(skillName) || effectGrantsSkill(skillName);
}

function passivePerception(){
  const pb = profBonus();
  const prof = isSkillProficient("Perception");
  const exp = !!state.skillExpertise["Perception"];
  let bonus = mod(abilTotal("wis"));
  if(exp) bonus += pb*2; else if(prof) bonus += pb;
  return 10 + bonus;
}

function passiveInvestigation(){
  const pb = profBonus();
  const prof = isSkillProficient("Investigation");
  const exp = !!state.skillExpertise["Investigation"];
  let bonus = mod(abilTotal("int"));
  if(exp) bonus += pb*2; else if(prof) bonus += pb;
  return 10 + bonus;
}

function renderStatbar(pb,t){
  const abilRow = ABILS.map(a=>{
    const total = abilTotal(a);

function hasUnarmoredDefenseClass(){
  return state.classes.some(c=>UNARMORED_DEFENSE_CLASSES[c.cls]);

// Verifies state.unarmoredDefenseClass isn't stale — e.g. it was set while the character had
// Barbarian, then Barbarian was later removed/respecced away. The dropdown that sets this value
// is already hidden once ineligible, but the stored value itself was never being cleared, so
// anything reading it directly (AC math, both exports) could keep silently using a class the
// character doesn't actually have anymore. Returns the class name if it's still genuinely valid,
// or "" otherwise.
function unarmoredDefenseActive(){
  const cls = state.unarmoredDefenseClass;
  return (cls && UNARMORED_DEFENSE_CLASSES[cls] && state.classes.some(c=>c.cls===cls)) ? cls : "";
}

function computeAC(){
  let base, dexComponent;
  const udClass = unarmoredDefenseActive();
  if(udClass && !state.armorEquipped){
    const secondAbil = UNARMORED_DEFENSE_CLASSES[udClass];
    base = 10;
    dexComponent = mod(abilTotal("dex")) + mod(abilTotal(secondAbil));
  } else if(!state.armorEquipped){
    base = 10;
    dexComponent = mod(abilTotal("dex"));
  } else {
    base = parseInt(state.armorBaseAC)||10;
    if(state.armorEquipped==="Light Armor") dexComponent = mod(abilTotal("dex"));
    else if(state.armorEquipped==="Medium Armor"){
      // Medium Armor Master feat: Dex bonus cap raises from +2 to +3, but ONLY if Dexterity is 16+
      // (confirmed against the 2024 PHB feat text — this condition was previously missing entirely,
      // so the feat had no mechanical effect on AC at all, only descriptive text).
      const hasMAM = allChosenFeats().some(f=>f.feat==="Medium Armor Master");
      const dexCap = (hasMAM && abilTotal("dex")>=16) ? 3 : 2;
      dexComponent = Math.min(dexCap, mod(abilTotal("dex")));
    }
    else dexComponent = 0; // Heavy Armor: no Dex bonus at all
  }
  let ac = base + dexComponent;
  if(state.shieldEquipped) ac += (parseInt(state.shieldBonus)||0);
  ac += (parseInt(state.acMisc)||0) + totalBonus("ac") + (fightingStyleChoice().includes("Defense") ? 1 : 0);
  return ac;
}

// Live-computed text for base CLASS_TABLE features whose numbers scale with level — used by the
// "Standard Class Features" builder in place of the static FEATURE_LIB description, so these
// don't ALSO need a separate (and previously duplicate, mislabeled-as-subclass) entry elsewhere.
function liveClassFeatureText(cls, fname, fLvl, instLvl){
  if(fname==="Second Wind" && cls==="Fighter") return `1d10 + ${fLvl} HP recovered (once per short or long rest, more uses at higher levels).`;
  if(fname==="Sneak Attack" && cls==="Rogue") return `${sneakAttackDice(fLvl)}d6 extra damage, once per turn.`;
  if(fname==="Martial Arts" && cls==="Monk") return `d${martialArtsDie(fLvl)} for unarmed strikes and monk weapons.`;
  if(fname==="Bardic Inspiration" && cls==="Bard") return `d${bardicInspirationDie(fLvl)} die to grant an ally.`;
  if(fname==="Rage" && cls==="Barbarian") return `+${rageDamageBonus(fLvl)} damage on Strength-based melee weapon attacks while raging.`;
  if(fname==="Lay on Hands" && cls==="Paladin") return `Pool of ${fLvl*5} HP to spend on healing (refills on a long rest).`;
  if((fname==="Brutal Strike" || fname==="Improved Brutal Strike") && cls==="Barbarian") return `+${brutalStrikeDice(fLvl)}d10 extra damage plus a rider effect, in place of one Reckless Attack's advantage.`;
  if(fname==="Unarmored Defense" && cls==="Barbarian") return "While not wearing armor: AC = 10 + Dexterity + Constitution (you can still use a Shield).";
  if(fname==="Unarmored Defense" && cls==="Monk") return "While not wearing armor or wielding a Shield: AC = 10 + Dexterity + Wisdom.";
  if(fname==="Fighting Style"){
    const st = (state.featureChoices[featureKey(cls,instLvl,"Fighting Style")]||{}).style;
    return st ? `${st} — ${FIGHTING_STYLE_OPTIONS[st]}` : "Not chosen yet — pick it in Classes & Features.";
  }
  if(fname==="Weapon Mastery"){
    const picks = (state.weaponMasteries||[]).filter(w=>w && WEAPONS[w]).map(w=>`${w} (${WEAPONS[w].mastery})`);
    return picks.length ? `Mastered: ${picks.join(", ")}.` : "No weapons chosen yet — pick them in Equipment & Currency.";
  }
  if(fname==="Jack of All Trades" && cls==="Bard") return `+${Math.floor(profBonus()/2)} to any skill check using a skill you're not proficient in (already applied when rolling a Skill Check via the Dice Roller).`;
  return null;
}

// Builds the "Standard Class Features" list. Same-named features from different classes (Extra Attack,
// Weapon Mastery...) are collapsed into ONE entry when their text is identical — Extra Attack doesn't
// stack across classes. When the text genuinely differs (e.g. Unarmored Defense's formula, or two
// different chosen Fighting Styles), each is kept and tagged with its class.
function standardFeaturesHtml(insts){
  const entries = insts.map(inst=>({
    cls:inst.cls, fname:inst.fname,
    text: liveClassFeatureText(inst.cls,inst.fname,classLevelOf(inst.cls),inst.lvl) ?? (FEATURE_LIB[inst.fname]||"")
  }));
  const byName = {};
  entries.forEach(e=>{ (byName[e.fname] = byName[e.fname]||[]).push(e); });
  const NEVER_COLLAPSE = new Set(["Fighting Style"]); // each class's pick is its own choice to make
  const done = new Set(), out = [];
  entries.forEach(e=>{
    if(done.has(e.fname)) return;
    done.add(e.fname);
    const group = byName[e.fname];
    if(group.length===1 || (group.every(g=>g.text===group[0].text) && !NEVER_COLLAPSE.has(e.fname))){
      out.push({name:e.fname, text:e.text});
    } else {
      group.forEach(g=> out.push({name:`${g.fname} (${g.cls})`, text:g.text}));
    }
  });
  return out.map(o=>`<div class="feat-item"><div class="fname">${o.name}</div><div class="fdesc">${o.text}</div></div>`).join("");
}

function concentrationOptions(){
  const opts = [];
  (state.spellsKnown||[]).forEach(s=>{
    // A cantrip never needs preparation — it's always available — so it counts here regardless
    // of its own "prepared" checkbox, which is purely cosmetic for cantrips (it exists but never
    // affects anything, per preparedSpellCount() excluding them from the prep cap entirely too).
    // Only a leveled spell actually needs s.prepared to be true.
    const effectivelyPrepared = s.prepared || parseInt(s.lvl)===0;
    if(effectivelyPrepared && s.name && spellRequiresConcentration(s)) opts.push(s.name);
  });
  // No "active" requirement here — a concentration-flagged class effect has no separate active
  // checkbox anymore (see the Classes & Features UI). Selecting it here IS what turns it on.
  (state.classEffects||[]).forEach(e=>{
    if(e.concentration && e.name) opts.push(e.name);
  });
  return opts;
}
